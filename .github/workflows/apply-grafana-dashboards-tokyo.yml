name: Apply Grafana dashboards — TOKYO

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Apply grafana-dashboards ConfigMap to Tokyo + restart grafana
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          kubectl -n monitoring delete configmap grafana-dashboards --ignore-not-found
          kubectl apply -f kubernetes-manifests/monitoring/grafana-dashboards.yaml
          # grafana.yaml carries the Deployment env (e.g. GF_USERS_VIEWERS_CAN_EDIT)
          # + datasource provisioning. Apply it too so env changes take effect.
          # admin-password is a placeholder — substitute the real secret so
          # this doesn't reset the admin password back to a literal.
          sed "s|__GRAFANA_ADMIN_PASSWORD__|${{ secrets.GRAFANA_ADMIN_PASSWORD }}|g" \
            kubernetes-manifests/monitoring/grafana.yaml | kubectl apply -f -
          # Clean single-pod restart (RWO PVC): scale to 0 to release the volume
          # and clear any stuck ContainerCreating pod, then back to 1.
          echo "===== scale 0 (release RWO PVC) -> 1 ====="
          kubectl -n monitoring scale deploy grafana --replicas=0
          for i in $(seq 1 30); do
            N=$(kubectl -n monitoring get pod -l app=grafana --no-headers 2>/dev/null | wc -l)
            [ "$N" = "0" ] && break; echo "  waiting grafana pods to terminate ($N left)..."; sleep 5
          done
          kubectl -n monitoring scale deploy grafana --replicas=1
          kubectl -n monitoring rollout status deployment/grafana --timeout=150s
          echo "===== grafana pod ====="
          kubectl -n monitoring get pod -l app=grafana -o wide
          echo "===== confirm VIEWERS_CAN_EDIT live ====="
          kubectl -n monitoring exec deploy/grafana -- sh -c 'env | grep -i VIEWERS_CAN_EDIT' 2>/dev/null || echo "(env not found!)"
          echo "===== confirm data links now use queryType traceId ====="
          kubectl -n monitoring get configmap grafana-dashboards -o yaml 2>/dev/null | grep -oE 'queryType%22:%22trace(ql|Id)%22' | sort | uniq -c
