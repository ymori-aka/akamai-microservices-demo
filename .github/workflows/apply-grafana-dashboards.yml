name: Apply Grafana dashboards

# Standalone: re-applies the grafana-dashboards ConfigMap and restarts
# Grafana so dashboard JSON changes land without a full Build+Deploy.
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Apply + reload
        run: |
          set +e
          # Delete + recreate to force Grafana to drop any cached version.
          kubectl -n monitoring delete configmap grafana-dashboards --ignore-not-found
          kubectl apply -f kubernetes-manifests/monitoring/grafana-dashboards.yaml
          # Also apply grafana.yaml (provisioning provider paths /
          # disableDeletion changes) so Istio dashboard duplicates get
          # cleaned up and not re-created.
          # admin-password is a placeholder — substitute the real secret so
          # this doesn't reset the admin password back to a literal.
          sed "s|__GRAFANA_ADMIN_PASSWORD__|${{ secrets.GRAFANA_ADMIN_PASSWORD }}|g" \
            kubernetes-manifests/monitoring/grafana.yaml | kubectl apply -f -
          kubectl -n monitoring rollout restart deployment/grafana
          kubectl -n monitoring rollout status deployment/grafana --timeout=120s
          echo "Done. Dashboards reloaded; Istio duplicates cleaned."
