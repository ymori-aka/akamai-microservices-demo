name: Apply Grafana NB firewall ACL — TOKYO

# grafana.tserof.net (NB 2238107) also serves Chaos Mesh / chaos-button /
# Kiali through tools-proxy, so it must not be open to the internet.
#
# LKE's CCM cannot attach a firewall we created ourselves (firewall-id
# annotation -> [403] Unauthorized, and the Service keeps failing to sync).
# It can manage a firewall it creates from the firewall-acl annotation, so
# this workflow sets that annotation on monitoring/grafana.
#
# LINODE_PAT has no NodeBalancer/Firewall scope, so this workflow only does
# the Kubernetes side. If a hand-attached stop-gap firewall is on the NB,
# detach it right after this run (with a token that can) — CCM retries and
# then attaches its own firewall. Until then the stop-gap keeps the NB closed.
#
# The allowlist comes from the NB_TOOLS_ALLOWLIST secret (comma-separated
# CIDRs) so the IPs never land in this public repo. The annotation is added
# with `kubectl annotate`, which client-side `kubectl apply` in the deploy
# workflows leaves alone.
on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  apply:
    runs-on: self-hosted
    env:
      LINODE_PAT: ${{ secrets.LINODE_PAT }}
      ALLOWLIST: ${{ secrets.NB_TOOLS_ALLOWLIST }}
      ANN: service.beta.kubernetes.io/linode-loadbalancer-firewall-acl
    steps:
      - name: Annotate monitoring/grafana with firewall-acl
        run: |
          set -euo pipefail
          [ -n "$ALLOWLIST" ] || { echo "NB_TOOLS_ALLOWLIST is empty"; exit 1; }
          export KUBECONFIG="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KUBECONFIG"
          kubectl -n monitoring get svc grafana -o wide
          ACL=$(python3 -c 'import os,json;print(json.dumps({"allowList":{"ipv4":[x.strip() for x in os.environ["ALLOWLIST"].split(",") if x.strip()]}}))')
          kubectl -n monitoring annotate svc grafana --overwrite "$ANN=$ACL" >/dev/null
          echo "annotated monitoring/grafana with $ANN ($(echo "$ACL" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)["allowList"]["ipv4"]))') CIDRs)"

      - name: Show CCM events for monitoring/grafana
        run: |
          export KUBECONFIG="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          sleep 20
          kubectl -n monitoring get events --field-selector involvedObject.name=grafana --sort-by=.lastTimestamp | tail -6
