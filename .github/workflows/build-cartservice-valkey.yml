name: Build cartservice image (valkey branch only, never :latest)

# Standalone image build for the valkey branch's cartservice (Managed
# Valkey support). Tags ONLY valkey-<short-sha> — deliberately never
# pushes :latest, since main's production cartservice Deployment is
# pinned to ghcr.io/ymori-aka/cartservice:latest and must not be
# affected by work on this branch.
on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  CART_IMAGE: ghcr.io/ymori-aka/cartservice

jobs:
  build-cartservice-valkey:
    name: Build Cart Service Image (valkey)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Compute tag
        id: tag
        run: echo "tag=valkey-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push cartservice image (valkey tag only)
        uses: docker/build-push-action@v6
        with:
          context: ./src/cartservice/src
          platforms: linux/amd64
          push: true
          tags: ${{ env.CART_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image
        run: echo "Pushed ${{ env.CART_IMAGE }}:${{ steps.tag.outputs.tag }}"
