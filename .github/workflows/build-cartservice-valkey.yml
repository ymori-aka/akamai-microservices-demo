name: Build valkey-branch images (never :latest)

# Standalone image builds for the valkey branch (Managed Valkey support:
# cartservice cart store + checkoutservice ranking writes + frontend
# ranking reads). Tags ONLY valkey-<short-sha> — deliberately never
# pushes :latest, since main's production Deployments are pinned to the
# :latest / sha- tags and must not be affected by work on this branch.
on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.svc }} (valkey)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - svc: cartservice
            context: ./src/cartservice/src
          - svc: checkoutservice
            context: ./src/checkoutservice
          - svc: frontend
            context: ./src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Compute tag
        id: tag
        run: echo "tag=valkey-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.svc }} image (valkey tag only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/ymori-aka/${{ matrix.svc }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image
        run: echo "Pushed ${{ env.REGISTRY }}/ymori-aka/${{ matrix.svc }}:${{ steps.tag.outputs.tag }}"
