name: Check loaded Grafana dashboard

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Inspect the home dashboard as Grafana has it loaded
        run: |
          set +e
          G=$(kubectl -n monitoring get pod -l app=grafana -o name | head -1)

          echo "===== Provisioned dashboards list ====="
          kubectl -n monitoring exec "$G" -- \
            wget -qO- "http://admin:admin@localhost:3000/api/search?type=dash-db" 2>/dev/null \
            | tr ',' '\n' | grep -E '"title"|"uid"' | head -30

          echo ""
          echo "===== home dashboard: Revenue/Orders panel targets ====="
          kubectl -n monitoring exec "$G" -- \
            wget -qO- "http://admin:admin@localhost:3000/api/dashboards/uid/akamai-home" 2>/dev/null \
            > /tmp/home.json
          # show panels whose title mentions Revenue/Orders + their expr + datasource
          cat /tmp/home.json | tr '{' '\n' \
            | grep -iE 'Revenue Yester|Orders Yester|Revenue Today|Orders Today|orders_daily|orders_today' | head -20

          echo ""
          echo "===== Does loaded JSON contain orders_daily_order_count? ====="
          if grep -q 'orders_daily_order_count' /tmp/home.json; then
            echo "YES — query present in loaded dashboard"
          else
            echo "NO — loaded dashboard does NOT contain the query (stale/old version!)"
          fi

          echo ""
          echo "===== Datasource UID(s) used by Revenue/Orders panels in loaded JSON ====="
          # crude: list all datasource uids referenced
          cat /tmp/home.json | grep -oE '"uid":"[^"]*"' | sort | uniq -c

          echo ""
          echo "===== Dashboard meta (version, updated) ====="
          cat /tmp/home.json | tr ',' '\n' | grep -E '"version"|"updated"|"provisioned"' | head -10
