name: Check Grafana duplicate dashboards

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: List all dashboards with title + uid + folder
        run: |
          set +e
          G=$(kubectl -n monitoring get pod -l app=grafana -o name | head -1)
          echo "===== All dashboards (raw, one object per line) ====="
          kubectl -n monitoring exec "$G" -- \
            wget -qO- "http://admin:admin@localhost:3000/api/search?type=dash-db" 2>/dev/null \
            | sed 's/},{/}\n{/g' \
            | grep -oE '"title":"[^"]*"|"uid":"[^"]*"' \
            | paste - - \
            | head -60
