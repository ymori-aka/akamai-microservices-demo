name: Check Grafana panel query

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Run the exact Revenue/Orders panel queries through Grafana
        run: |
          set +e
          G=$(kubectl -n monitoring get pod -l app=grafana -o name | head -1)
          echo "grafana pod: $G"

          echo "===== datasources (id, uid, name, type) ====="
          kubectl -n monitoring exec "$G" -- \
            wget -qO- "http://admin:admin@localhost:3000/api/datasources" 2>/dev/null \
            | tr '{' '\n' | grep -E '"(id|uid|name|type)"' | head -40

          echo ""
          echo "===== query sum(orders_daily_order_count) via datasource proxy uid ====="
          kubectl -n monitoring exec "$G" -- \
            wget -qO- "http://admin:admin@localhost:3000/api/datasources/proxy/uid/PBFA97CFB590B2093/api/v1/query?query=sum(orders_daily_order_count)" 2>/dev/null
          echo ""
          echo "===== query sum(orders_daily_revenue_usd) ====="
          kubectl -n monitoring exec "$G" -- \
            wget -qO- "http://admin:admin@localhost:3000/api/datasources/proxy/uid/PBFA97CFB590B2093/api/v1/query?query=sum(orders_daily_revenue_usd)" 2>/dev/null
          echo ""

          echo "===== what the LOADED home.json has for Revenue/Orders panels ====="
          kubectl -n monitoring exec "$G" -- sh -c \
            "grep -oE 'orders_(daily|today)_(order_count|revenue_usd)' /var/lib/grafana/dashboards/home.json | sort | uniq -c" 2>/dev/null \
            || echo "(home.json not readable at that path)"

          echo ""
          echo "===== home.json datasource uids referenced ====="
          kubectl -n monitoring exec "$G" -- sh -c \
            "grep -oE 'PBFA97CFB590B2093|P8E80F9AEF21F6940' /var/lib/grafana/dashboards/home.json | sort | uniq -c" 2>/dev/null
