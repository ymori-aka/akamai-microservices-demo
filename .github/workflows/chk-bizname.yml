name: chk-bizname
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: self-hosted
    steps:
      - name: real series names + checkout status
        env: { LINODE_PAT: "${{ secrets.LINODE_PAT }}" }
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          PP=$(kubectl -n monitoring get pod 2>/dev/null | grep -i prometheus | awk '{print $1}' | head -1)
          echo "=== metric names containing akamai/checkout/chats/revenue/order ==="
          kubectl -n monitoring exec "$PP" -c prometheus -- wget -qO- "http://localhost:9090/api/v1/label/__name__/values" 2>/dev/null | python3 -c 'import sys,json;[print(" ",n) for n in json.load(sys.stdin)["data"] if any(k in n.lower() for k in ["akamai","checkout","chats","revenue","order"])]'
          echo "=== checkout status breakdown ==="
          kubectl -n monitoring exec "$PP" -c prometheus -- wget -qO- "http://localhost:9090/api/v1/query?query=sum%20by%20(status,expected_response)(k6_http_reqs_total%7Bname%3D%22POST%20%2Fcart%2Fcheckout%22%7D)" 2>/dev/null | python3 -c 'import sys,json;[print("  status",r["metric"].get("status"),"exp",r["metric"].get("expected_response"),"=",r["value"][1]) for r in json.load(sys.stdin)["data"]["result"]]'
          echo "=== k6_checks (pass rate by name) ==="
          kubectl -n monitoring exec "$PP" -c prometheus -- wget -qO- "http://localhost:9090/api/v1/query?query=k6_checks_total" 2>/dev/null | python3 -c 'import sys,json;r=json.load(sys.stdin)["data"]["result"];print("  ",len(r),"series");[print("   ",x["metric"]) for x in r[:8]]' 2>/dev/null
          echo "=== k6 script counters.add lines (sanity: names match?) ==="
          kubectl -n default get cm k6-script -o jsonpath='{.data.scenario\.js}' 2>/dev/null | grep -nE "new Counter|checkouts\.add|chats\.add" 
