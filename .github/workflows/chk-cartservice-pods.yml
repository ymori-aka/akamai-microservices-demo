name: CHK - cartservice pod status + logs (read-only)
on:
  workflow_dispatch: {}
jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: current working image + rollback
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['kubeconfig']).decode())" > "$KC"
          export KUBECONFIG="$KC"
          echo "===== rollout history (image per revision) ====="
          kubectl rollout history deployment/cartservice 2>&1
          echo ""
          echo "===== old healthy pod image (if still present) ====="
          kubectl get pods -l app=cartservice -o jsonpath='{range .items[*]}{.metadata.name}{"  "}{.status.phase}{"  "}{.spec.containers[0].image}{"\n"}{end}' 2>&1
          echo ""
          echo "===== replicasets for cartservice (image per RS) ====="
          kubectl get rs -l app=cartservice -o jsonpath='{range .items[*]}{.metadata.name}{"  replicas="}{.spec.replicas}{"  image="}{.spec.template.spec.containers[0].image}{"\n"}{end}' 2>&1
