name: chk-chatfull
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: self-hosted
    steps:
      - name: full reply + AKMT ids
        env: { LINODE_PAT: "${{ secrets.LINODE_PAT }}" }
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          FE=$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          for q in "おすすめのTシャツは?" "Recommend a gift under \$30"; do
            echo "=== Q: $q ==="
            curl -s -m40 -X POST "http://$FE/bot" -H "Content-Type: application/json" -d "$(python3 -c "import json,sys;print(json.dumps({'message':sys.argv[1],'history':[]}))" "$q")" | python3 -c 'import sys,json;m=json.load(sys.stdin).get("message","");print(m[:500]);import re;print("AKMT ids:",re.findall(r"AKMT\d+",m))'
          done
