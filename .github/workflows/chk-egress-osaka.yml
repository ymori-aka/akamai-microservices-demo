name: CHK - Osaka egress test (read-only)
on:
  workflow_dispatch: {}
jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: egress/dns test from a throwaway pod
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-osa.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/598466/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          OV='{"apiVersion":"v1","spec":{"containers":[{"name":"t","image":"curlimages/curl:8.10.1","command":["sh","-c","echo=DNS; nslookup auth.app.wiz.io 2>&1 | tail -6; echo; echo=DNS_PUBLIC; nslookup github.com 2>&1 | tail -4; echo; echo=HTTPS_WIZ; curl -sS -m 12 -o /dev/null -w wiz=%{http_code}\\\\n https://auth.app.wiz.io/ 2>&1; echo=HTTPS_PUBLIC; curl -sS -m 12 -o /dev/null -w gh=%{http_code}\\\\n https://github.com/ 2>&1"],"securityContext":{"allowPrivilegeEscalation":false,"runAsNonRoot":true,"runAsUser":1000,"capabilities":{"drop":["ALL"]},"seccompProfile":{"type":"RuntimeDefault"}}}]}}'
          kubectl -n default run egress-test --rm -i --restart=Never --image=curlimages/curl:8.10.1 --overrides="$OV" 2>&1 | grep -vE "pod .* deleted" | head -40
          echo "===== coredns status ====="
          kubectl -n kube-system get pods -l k8s-app=kube-dns -o wide 2>&1 | head
