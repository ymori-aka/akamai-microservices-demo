name: CHK - frontend deployments IMAGE_BASE_URL + svc selector
on:
  workflow_dispatch: {}
jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: dump
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          echo "===== deployments named frontend* ====="
          kubectl -n default get deploy | grep -i frontend
          echo "===== IMAGE_BASE_URL per frontend deploy ====="
          for d in $(kubectl -n default get deploy -o name | grep -i frontend); do
            v=$(kubectl -n default get "$d" -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="IMAGE_BASE_URL")].value}')
            lbl=$(kubectl -n default get "$d" -o jsonpath='{.spec.template.metadata.labels}')
            echo "$d  IMAGE_BASE_URL='$v'"
            echo "     podLabels=$lbl"
          done
          echo "===== frontend-external Service selector + endpoints ====="
          kubectl -n default get svc frontend-external -o jsonpath='selector={.spec.selector}{"\n"}'
          echo "endpoints (pods behind the LB):"
          kubectl -n default get endpoints frontend-external -o jsonpath='{range .subsets[*].addresses[*]}{.targetRef.name}{"\n"}{end}'
          echo "===== pods app=frontend + their image ====="
          kubectl -n default get pods -l app=frontend -o jsonpath='{range .items[*]}{.metadata.name}{"  "}{.spec.containers[0].image}{"\n"}{end}'
