name: chk-feimg
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: self-hosted
    steps:
      - name: check
        env: { LINODE_PAT: "${{ secrets.LINODE_PAT }}" }
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          echo "deploy image:"; kubectl -n default get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          echo "running pods image:"; kubectl -n default get pod -l app=frontend -o jsonpath='{range .items[*]}{.metadata.name} {.spec.containers[0].image} {.status.phase}{"\n"}{end}'
          echo "imagePullPolicy:"; kubectl -n default get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].imagePullPolicy}{"\n"}'
          echo "=== recent frontend chatbot logs (assistant request size hint) ==="
          kubectl -n default logs deploy/frontend --tail=60 2>&1 | grep -iE 'chatbot|assistant|catalog|400|502|blocked|empty' | tail -10
