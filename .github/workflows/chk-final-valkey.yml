name: CHK - final valkey cartservice state (read-only)
on:
  workflow_dispatch: {}
jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: final state
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['kubeconfig']).decode())" > "$KC"
          export KUBECONFIG="$KC"
          echo "===== cartservice pods (current) ====="
          kubectl get pods -l app=cartservice -o wide 2>&1
          echo ""
          echo "===== redis-cart leftovers? ====="
          kubectl get deploy,svc -l app=redis-cart 2>&1
          echo ""
          echo "===== cartservice env (proof of valkey wiring) ====="
          kubectl get deploy cartservice -o jsonpath='{.spec.template.spec.containers[0].env[*].name}' 2>&1
          echo ""
          echo "===== fresh live round-trip (2nd, independent check) ====="
          BASE="https://aka-store.tserof.net"
          CJ="${RUNNER_TEMP:-/tmp}/cj2.txt"
          curl -sS -c "$CJ" -o /dev/null "$BASE/"
          curl -sS -b "$CJ" -c "$CJ" -o /dev/null -w "add: %{http_code}\n" -X POST "$BASE/cart" --data "product_id=AKMT005&quantity=3"
          curl -sS -b "$CJ" "$BASE/cart" | grep -o "AKMT005" && echo "CONFIRMED persisted"
