name: CHK - hash-compare GRAFANA_NEW_ADMIN_PW secret vs k8s secret vs live login

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: hash compare
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
          NEW_PW: ${{ secrets.GRAFANA_NEW_ADMIN_PW }}
        run: |
          set +e
          echo "1) sha256 of \$NEW_PW as seen in this workflow (no newline appended):"
          printf '%s' "$NEW_PW" | shasum -a 256

          echo ""
          echo "2) length of \$NEW_PW: ${#NEW_PW}"

          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          echo ""
          echo "3) sha256 of the CURRENT k8s secret's admin-password (decoded):"
          kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-password}' | base64 -d | shasum -a 256

          echo ""
          echo "4) sha256 of admin-user field (sanity: is it really 'admin'?):"
          kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-user}' | base64 -d
          echo ""

          GRAFANA_IP=$(kubectl -n monitoring get svc grafana -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo ""
          echo "5) live curl -v basic auth attempt (headers only, no body leak):"
          curl -v -u "admin:${NEW_PW}" "http://${GRAFANA_IP}:3000/api/user" 2>&1 | grep -iE '^> |^< |HTTP/'
