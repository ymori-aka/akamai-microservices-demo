name: CHK - retest Grafana admin delete permission after settle time (Tokyo)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: retest with fresh login + settle time
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
          NEW_PW: ${{ secrets.GRAFANA_NEW_ADMIN_PW }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          GRAFANA_IP=$(kubectl -n monitoring get svc grafana -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "grafana IP: $GRAFANA_IP"

          echo "===== pod age/uptime ====="
          kubectl -n monitoring get pods -l app=grafana

          echo ""
          echo "===== /api/user ====="
          curl -sS -u "admin:${NEW_PW}" "http://${GRAFANA_IP}:3000/api/user" -w '\nHTTP_CODE=%{http_code}\n'

          echo ""
          echo "===== /api/access-control/user/permissions (which permissions does this admin actually have?) ====="
          curl -sS -u "admin:${NEW_PW}" "http://${GRAFANA_IP}:3000/api/access-control/user/permissions" -w '\nHTTP_CODE=%{http_code}\n' | head -c 3000

          echo ""
          echo ""
          echo "===== create + delete throwaway datasource ====="
          curl -sS -u "admin:${NEW_PW}" -X POST "http://${GRAFANA_IP}:3000/api/datasources" \
            -H 'Content-Type: application/json' \
            -d '{"name":"rbac-retest","type":"testdata","access":"proxy"}' -w '\nHTTP_CODE=%{http_code}\n'
          UID2=$(curl -sS -u "admin:${NEW_PW}" "http://${GRAFANA_IP}:3000/api/datasources" | python3 -c "import sys,json; ds=json.load(sys.stdin); m=[d['uid'] for d in ds if d['name']=='rbac-retest']; print(m[0] if m else '')")
          echo "uid: $UID2"
          if [ -n "$UID2" ]; then
            curl -sS -u "admin:${NEW_PW}" -X DELETE "http://${GRAFANA_IP}:3000/api/datasources/uid/${UID2}" -w '\nHTTP_CODE=%{http_code}\n'
          fi

          echo ""
          echo "===== grafana container logs (any RBAC/migration errors at boot?) ====="
          POD=$(kubectl -n monitoring get pods -l app=grafana -o jsonpath='{.items[0].metadata.name}')
          kubectl -n monitoring logs "$POD" --tail=300 | grep -iE 'rbac|migrat|permission|accesscontrol|error|fatal' | tail -40
