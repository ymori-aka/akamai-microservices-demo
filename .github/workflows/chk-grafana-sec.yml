name: CHK - Grafana admin password + phx datasources status (read-only, Tokyo)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: inspect grafana-secret + datasources
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          echo "===== admin password length (not the value) ====="
          PW=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-password}' 2>/dev/null | base64 -d)
          echo "length=${#PW}"

          echo ""
          echo "===== anonymous access setting ====="
          kubectl -n monitoring get deploy grafana -o jsonpath='{.spec.template.spec.containers[0].env}' 2>/dev/null | python3 -c "import sys,json; envs=json.load(sys.stdin); [print(e.get('name'),'=',e.get('value')) for e in envs if 'ANON' in e.get('name','')]"

          echo ""
          echo "===== datasource counts ====="
          GRAFANA_IP=$(kubectl -n monitoring get svc grafana -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          echo "grafana svc external IP: $GRAFANA_IP"
          ADMIN_PW=$PW
          TOTAL=$(curl -fsS -u "admin:${ADMIN_PW}" "http://${GRAFANA_IP}:3000/api/datasources" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null)
          PHX=$(curl -fsS -u "admin:${ADMIN_PW}" "http://${GRAFANA_IP}:3000/api/datasources" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([x for x in d if x['name'].startswith('_phx_')]))" 2>/dev/null)
          echo "total datasources: $TOTAL"
          echo "_phx_* datasources: $PHX"
