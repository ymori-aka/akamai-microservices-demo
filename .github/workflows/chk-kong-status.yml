name: CHK - Kong AI gateway status (read-only, Tokyo)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: inspect kong pods + probe the AI route
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          echo "===== kong namespace pods ====="
          kubectl -n kong get pods -o wide 2>&1

          echo ""
          echo "===== kong routes/services (admin API, in-cluster) ====="
          kubectl -n kong get svc 2>&1

          echo ""
          echo "===== probe chat via kong lane (in-cluster) ====="
          kubectl run kong-probe --rm -i --restart=Never --image=curlimages/curl:8.10.1 --quiet -- \
            curl -sS -X POST "http://kong-kong-proxy.kong.svc.cluster.local/chat" \
            -H "Content-Type: application/json" \
            -d '{"message":"hello","history":[]}' -w "\nHTTP %{http_code}\n" 2>&1
