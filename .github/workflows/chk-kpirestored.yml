name: chk-kpirestored
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: self-hosted
    steps:
      - name: confirm orders_today KPI now non-zero
        env: { LINODE_PAT: "${{ secrets.LINODE_PAT }}" }
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          sleep 65
          PP=$(kubectl -n monitoring get pod 2>/dev/null | grep -i prometheus | awk '{print $1}' | head -1)
          for m in orders_today_order_count orders_today_revenue_usd orders_daily_order_count orders_daily_revenue_usd; do
            echo "--- $m ---"
            kubectl -n monitoring exec "$PP" -c prometheus -- wget -qO- "http://localhost:9090/api/v1/query?query=$m" 2>/dev/null | python3 -c 'import sys,json;d=json.load(sys.stdin)["data"]["result"];[print("  val=",r["value"][1]) for r in d]'
          done
          echo "=== checkoutservice persisted count in last 5m ==="
          kubectl -n default logs deploy/checkoutservice --since=5m 2>&1 | grep -c persisted
