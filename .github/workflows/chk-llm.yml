name: chk-llm
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: self-hosted
    steps:
      - name: probe gemma4 LLM directly (small vs large prompt)
        run: |
          set +e
          LLM="http://172.238.48.187:8000"
          echo "=== /health & /v1/models ==="
          curl -s -m 10 "$LLM/health" -w " [%{http_code}]\n"; curl -s -m 10 "$LLM/v1/models" -w " [%{http_code}]\n" | head -c 300; echo ""
          MODEL=$(curl -s -m 10 "$LLM/v1/models" | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"][0]["id"])' 2>/dev/null); echo "model=$MODEL"
          echo "=== SMALL prompt ==="
          curl -s -m 40 -X POST "$LLM/v1/chat/completions" -H "Content-Type: application/json" -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":16}" -w "\n[HTTP %{http_code}]\n" | head -c 300
          echo "=== LARGE prompt (~10-line catalog system) ==="
          CAT=$(python3 -c "print('\n'.join('- [AKMT%03d] Akamai Product %d - merch.'%(i,i) for i in range(10)))")
          BODY=$(python3 -c "import json,sys,os; print(json.dumps({'model':sys.argv[2],'messages':[{'role':'system','content':'You are a shopping assistant. Catalog:\n'+sys.argv[1]},{'role':'user','content':'osusume'}],'max_tokens':64}))" "$CAT" "$MODEL")
          curl -s -m 60 -X POST "$LLM/v1/chat/completions" -H "Content-Type: application/json" -d "$BODY" -w "\n[HTTP %{http_code}]\n" | head -c 400
          echo "=== llm-server.service / n_ctx hint (if reachable via ssh? skip) ==="
