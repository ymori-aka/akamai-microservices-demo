name: CHK - NodeBalancer inventory (read-only)

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: All LoadBalancer Services (one NodeBalancer each = $10/mo)
        run: |
          set +e
          echo "===== LoadBalancer type Services ====="
          kubectl get svc -A -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name,TYPE:.spec.type,EXTERNAL-IP:.status.loadBalancer.ingress[0].ip,PORTS:.spec.ports[*].port' 2>/dev/null | grep -vE '^\S+\s+\S+\s+ClusterIP'
          echo
          echo "===== 台数 ====="
          kubectl get svc -A --field-selector spec.type=LoadBalancer --no-headers 2>/dev/null | wc -l

      - name: TLS / CCM annotations per LoadBalancer Service
        run: |
          set +e
          for row in $(kubectl get svc -A --field-selector spec.type=LoadBalancer -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' 2>/dev/null); do
            ns="${row%%/*}"; nm="${row##*/}"
            ip=$(kubectl -n "$ns" get svc "$nm" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            echo "--- $ns/$nm  ip=$ip ---"
            kubectl -n "$ns" get svc "$nm" -o jsonpath='{.metadata.annotations}' 2>/dev/null | tr ',' '\n' | grep -iE 'linode|tls|443|protocol' | sed 's/^/    /'
          done

      - name: Reminder of externally-referenced IPs
        run: |
          echo "  aka-store.tserof.net / tserof.net / www -> 172.237.1.139  (TLS終端あり・維持必須)"
          echo "  grafana.tserof.net                      -> 172.237.3.209  (TLS終端あり・維持必須)"
          echo "  Spin functions (Akamai Functions) OTel  -> 172.237.3.147:4319"
          echo "     ^ spin.toml の allowed_outbound_hosts に直書き。変更時は3関数の再デプロイが必要"
