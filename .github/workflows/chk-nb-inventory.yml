name: CHK - NodeBalancer inventory (read-only)

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: All LoadBalancer Services (one NodeBalancer each = $10/mo each)
        run: |
          set +e
          echo "NAMESPACE/SERVICE                          EXTERNAL-IP        PORTS"
          kubectl get svc -A -o json 2>/dev/null | python3 -c "
import json,sys
d=json.load(sys.stdin)
n=0
for s in d.get('items',[]):
    if s.get('spec',{}).get('type')!='LoadBalancer': continue
    n+=1
    ns=s['metadata']['namespace']; nm=s['metadata']['name']
    ing=(s.get('status',{}).get('loadBalancer',{}) or {}).get('ingress') or [{}]
    ip=ing[0].get('ip','<pending>')
    ports=','.join(str(p.get('port')) for p in s['spec'].get('ports',[]))
    ann=s['metadata'].get('annotations',{}) or {}
    tls=[k for k in ann if 'port-443' in k or 'tls' in k.lower()]
    print(f\"{ns+'/'+nm:<42} {ip:<18} {ports}\" + ('   [TLS終端あり]' if tls else ''))
print()
print('LoadBalancer Service 合計:', n, '→ 月額 \$'+str(n*10))
"
      - name: Which are referenced externally (must keep a public IP)?
        run: |
          set +e
          echo "===== TLS/ドメインが向いている先 ====="
          echo "  aka-store.tserof.net -> 172.237.1.139"
          echo "  grafana.tserof.net   -> 172.237.3.209"
          echo "  Spin functions OTel  -> 172.237.3.147:4319 (spin.toml allowlist に直書き)"
          echo "===== 各Serviceのセレクタ/用途を判別 ====="
          kubectl get svc -A -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name,TYPE:.spec.type,IP:.status.loadBalancer.ingress[0].ip,SELECTOR:.spec.selector' 2>/dev/null | grep -v ClusterIP
