name: chk-ordersexp
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: self-hosted
    steps:
      - name: find orders exporter + freshness
        env: { LINODE_PAT: "${{ secrets.LINODE_PAT }}" }
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          echo "=== pods/deploys/cronjobs mentioning orders/exporter/kpi (all ns) ==="
          kubectl get pods -A 2>&1 | grep -iE 'order|kpi|business|exporter' 
          kubectl get deploy,cronjob,job -A 2>&1 | grep -iE 'order|kpi|business|exporter'
          echo "=== current values ==="
          PP=$(kubectl -n monitoring get pod 2>/dev/null | grep -i prometheus | awk '{print $1}' | head -1)
          for m in orders_daily_revenue_usd orders_daily_order_count orders_today_revenue_usd orders_today_order_count; do
            echo "--- $m ---"
            kubectl -n monitoring exec "$PP" -c prometheus -- wget -qO- "http://localhost:9090/api/v1/query?query=$m" 2>/dev/null | python3 -c 'import sys,json,time;d=json.load(sys.stdin)["data"]["result"];[print("  val=",r["value"][1]," age_s=",round(time.time()-r["value"][0])) for r in d] or print("  NO DATA")'
          done
          echo "=== scrape target health for this exporter ==="
          kubectl -n monitoring exec "$PP" -c prometheus -- wget -qO- "http://localhost:9090/api/v1/targets" 2>/dev/null | python3 -c 'import sys,json;d=json.load(sys.stdin)["data"]["activeTargets"];[print(" ",t["scrapePool"],t["health"],t.get("lastError","")) for t in d if "order" in t["scrapePool"].lower() or "kpi" in t["scrapePool"].lower() or "business" in t["scrapePool"].lower()]'
