name: CHK - Apply prometheus-rules to Tokyo (Osaka cleanup)

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: Apply prometheus-rules (alert now targets 481207, not deleted 470692)
        run: |
          set -e
          kubectl apply -f kubernetes-manifests/monitoring/prometheus-rules.yaml
          kubectl -n monitoring rollout restart deployment/prometheus || true
          kubectl -n monitoring rollout status deployment/prometheus --timeout=180s || true

      - name: Verify no rule still references the Osaka DB
        run: |
          set +e
          echo "===== 470692 references left in the live rules ConfigMap ====="
          kubectl -n monitoring get cm -o yaml 2>/dev/null | grep -c "470692"
          echo "(0 = clean)"
          echo "===== aclp-collector entity_ids now in cluster ====="
          kubectl -n monitoring get cm -o yaml 2>/dev/null | grep -oE "entity_ids: \[[0-9, ]+\]" | sort -u
