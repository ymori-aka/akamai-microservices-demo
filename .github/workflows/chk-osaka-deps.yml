name: CHK - Locate remaining Osaka refs in Tokyo cluster

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: Which ConfigMaps still contain 470692 / Osaka NB ids?
        run: |
          set +e
          echo "===== ConfigMaps containing 470692 ====="
          for ns in monitoring default; do
            for cm in $(kubectl -n $ns get cm -o name 2>/dev/null); do
              n=$(kubectl -n $ns get $cm -o yaml 2>/dev/null | grep -c "470692")
              [ "$n" != "0" ] && echo "  $ns/$cm : $n hit(s)"
            done
          done
          echo "===== CronJobs (healer) and their watched entity ====="
          kubectl -n monitoring get cronjob -o yaml 2>/dev/null | grep -oE 'entity_id=\\?"[0-9]+' | sort | uniq -c
          kubectl -n monitoring get cronjob 2>/dev/null
          echo "===== nodebalancer entity_ids in the live aclp config ====="
          kubectl -n monitoring get cm -o yaml 2>/dev/null | grep -B3 -A1 "2154313\|2001057" | head -20
