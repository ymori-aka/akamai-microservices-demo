name: chk-queuemaster
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: self-hosted
    steps:
      - name: queuemaster + rabbitmq + orders table check
        env: { LINODE_PAT: "${{ secrets.LINODE_PAT }}" }
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          echo "=== queuemaster / rabbitmq pods ==="
          kubectl -n default get pod -l app=queuemaster -o wide 2>&1
          kubectl -n default get pod -l app=rabbitmq -o wide 2>&1
          echo "=== queuemaster recent logs ==="
          kubectl -n default logs deploy/queuemaster --tail=40 2>&1 | tail -30
          echo "=== rabbitmq queue depth (order.placed) ==="
          RMQ=$(kubectl -n default get pod -l app=rabbitmq -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          kubectl -n default exec "$RMQ" -- rabbitmqctl list_queues name messages consumers 2>&1
          echo "=== postgres-exporter custom query config (orders_ metrics SQL) ==="
          kubectl -n monitoring get cm -o name 2>&1 | grep -i postgres
          kubectl -n monitoring get cm -o name 2>/dev/null | grep -i postgres | xargs -I{} kubectl -n monitoring get {} -o yaml 2>/dev/null | grep -iE 'orders_|query:|SELECT' | head -30
          echo "=== postgres-exporter pod logs (query errors?) ==="
          kubectl -n monitoring logs deploy/postgres-exporter --tail=30 2>&1 | grep -iE 'error|orders|fail' | tail -15
