name: CHK - TLS verify from inside the cluster (read-only)
on:
  workflow_dispatch: {}
jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: openssl verify from a pod using the mounted CA
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['kubeconfig']).decode())" > "$KC"
          export KUBECONFIG="$KC"
          HOST="public-a501007-akamai-prod-6468920-default.g2a.akamaidb.net"
          OV='{"apiVersion":"v1","spec":{"containers":[{"name":"t","image":"alpine/openssl:3.3.2","command":["sh","-c","echo | openssl s_client -connect '"$HOST"':23631 -servername '"$HOST"' -CAfile /ca/ca.pem 2>&1 | grep -iE \"Verify return code|verify error|subject=|issuer=|CONNECTED\" | head -8"],"volumeMounts":[{"name":"ca","mountPath":"/ca","readOnly":true}],"securityContext":{"allowPrivilegeEscalation":false,"runAsNonRoot":true,"runAsUser":1000,"capabilities":{"drop":["ALL"]},"seccompProfile":{"type":"RuntimeDefault"}}}],"volumes":[{"name":"ca","secret":{"secretName":"valkey-ca-cert"}}]}}'
          kubectl run tlscheck --rm -i --restart=Never --image=alpine/openssl:3.3.2 --overrides="$OV" --timeout=90s 2>&1 | head -20
