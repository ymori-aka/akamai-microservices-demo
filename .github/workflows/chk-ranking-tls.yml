name: CHK - ranking state after TLS fix (read-only)
on:
  workflow_dispatch: {}
jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: pods, images, fresh logs
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['kubeconfig']).decode())" > "$KC"
          export KUBECONFIG="$KC"
          for D in checkoutservice frontend; do
            echo "===== $D pods ====="
            kubectl get pods -l app=$D -o jsonpath='{range .items[*]}{.metadata.name}{"  "}{.status.phase}{"  age="}{.metadata.creationTimestamp}{"  "}{.spec.containers[0].image}{"\n"}{end}'
            echo "  CA env still present? -> $(kubectl get deploy $D -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REDIS_CA_CERT_PATH")].value}')"
            POD=$(kubectl get pods -l app=$D --field-selector=status.phase=Running --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}')
            echo "  newest pod: $POD"
            echo "  --- its ranking/x509 lines ---"
            kubectl logs "$POD" 2>&1 | grep -iE "ranking|x509|valkey" | tail -6
            echo ""
          done
          echo "===== does /ranking actually show data? ====="
          curl -sS "https://aka-store.tserof.net/ranking" | grep -oE "AKMT[0-9]+" | head -5
