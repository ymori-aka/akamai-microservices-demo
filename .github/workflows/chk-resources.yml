name: CHK - cluster resource usage (read-only)

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: Node capacity and actual usage
        run: |
          set +e
          echo "===== ノードの容量 / 割当可能 ====="
          kubectl get nodes -o custom-columns='NAME:.metadata.name,CPU:.status.capacity.cpu,MEM:.status.capacity.memory,ALLOC_CPU:.status.allocatable.cpu,ALLOC_MEM:.status.allocatable.memory'
          echo
          echo "===== 実使用量(metrics-server)====="
          kubectl top nodes 2>&1 | head -6

      - name: Requests vs allocatable per node
        run: |
          set +e
          echo "===== 各ノードの requests 合計 ====="
          for n in $(kubectl get nodes -o name | cut -d/ -f2); do
            echo "--- $n ---"
            kubectl describe node "$n" 2>/dev/null | sed -n '/Allocated resources/,/Events/p' | grep -E "cpu|memory" | head -4
          done

      - name: Memory usage by namespace (top consumers)
        run: |
          set +e
          echo "===== Pod別メモリ使用量 上位20 ====="
          kubectl top pods -A --sort-by=memory 2>/dev/null | head -21
          echo
          echo "===== namespace別 Pod数 ====="
          kubectl get pods -A --no-headers 2>/dev/null | awk '{print $1}' | sort | uniq -c | sort -rn
