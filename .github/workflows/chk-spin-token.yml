name: CHK - Spin Akamai Functions deploy token status

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Spin CLI and aka plugin
        run: |
          curl -fsSL https://developer.fermyon.com/downloads/install.sh | bash
          sudo mv spin /usr/local/bin/spin
          spin plugins update
          spin plugins install aka -y

      - name: Try login only (no deploy)
        run: |
          set +e
          spin aka login --token ${{ secrets.SPIN_AKA_ACCESS_TOKEN }}
          echo "login exit code: $?"
          echo "----"
          spin aka app list
          echo "list exit code: $?"
