name: CHK - Valkey status + Tokyo node external IPs (read-only)
on:
  workflow_dispatch: {}
jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: status + node IPs
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          echo "===== Valkey9 status ====="
          curl -sS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/databases/valkey/instances/501007" | python3 -c "import sys,json; d=json.load(sys.stdin); print('status=',d.get('status'), 'ssl=',d.get('ssl_connection'))"
          echo ""
          echo "===== Tokyo LKE node external IPs ====="
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['kubeconfig']).decode())" > "$KC"
          export KUBECONFIG="$KC"
          kubectl get nodes -o wide 2>&1 | awk '{print $1, $7}'
