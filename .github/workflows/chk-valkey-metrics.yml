name: CHK - does Cloud Pulse support Valkey dbaas metrics? (read-only)
on:
  workflow_dispatch: {}
jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: probe monitor API for entity 501007
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          echo "===== list available metric definitions for dbaas service ====="
          curl -sS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/monitor/services/dbaas/metric-definitions" | python3 -m json.tool 2>&1 | head -60

          echo ""
          echo "===== get a JWT token scoped to entity 501007 (Valkey) for dbaas ====="
          curl -sS -X POST -H "Authorization: Bearer $LINODE_PAT" -H "Content-Type: application/json" \
            "https://api.linode.com/v4/monitor/services/dbaas/token" \
            -d '{"entity_ids": [501007]}' | python3 -m json.tool 2>&1 | head -30
