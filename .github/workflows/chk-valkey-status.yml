name: CHK - Valkey9 status (read-only)
on:
  workflow_dispatch: {}
jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: status
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          curl -sS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/databases/valkey/instances/501007" | python3 -c "import sys,json; d=json.load(sys.stdin); print('status=',d.get('status'))"
