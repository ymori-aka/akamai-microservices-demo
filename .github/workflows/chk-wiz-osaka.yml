name: CHK - Wiz Osaka pod status (read-only)
on:
  workflow_dispatch: {}
jobs:
  chk:
    runs-on: self-hosted
    steps:
      - name: wiz ns status
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-osa.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/598466/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          export HELM_CACHE_HOME="${RUNNER_TEMP:-/tmp}/helm/cache" HELM_CONFIG_HOME="${RUNNER_TEMP:-/tmp}/helm/config" HELM_DATA_HOME="${RUNNER_TEMP:-/tmp}/helm/data"
          echo "===== pods ====="; kubectl -n wiz get pods -o wide 2>&1
          echo "===== not-ready pod describe (events) ====="
          for p in $(kubectl -n wiz get pods --no-headers 2>/dev/null | awk '$2!~/^([0-9]+)\/\1$/ || $3!="Running"{print $1}'); do
            echo "--- $p ---"; kubectl -n wiz describe pod "$p" 2>&1 | grep -A15 "Events:" | head -20
            echo "   containers:"; kubectl -n wiz get pod "$p" -o jsonpath='{range .status.containerStatuses[*]}{.name}={.state}{"\n"}{end}' 2>&1
          done
          echo "===== deploys/replicasets ====="; kubectl -n wiz get deploy,rs,ds 2>&1 | head -30
          echo "===== helm status ====="; helm -n wiz status wiz-integration 2>&1 | head -10
