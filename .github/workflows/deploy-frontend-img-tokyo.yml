name: deploy-frontend-img-tokyo
on: { workflow_dispatch: { inputs: { tag: { required: true }, tokyo_cluster_id: { default: "610031", required: true } } } }
jobs:
  c:
    runs-on: self-hosted
    steps:
      - name: pin frontend image + verify chat
        env: { LINODE_PAT: "${{ secrets.LINODE_PAT }}" }
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          echo "=== set image -> ${{ inputs.tag }} ==="
          kubectl -n default set image deployment/frontend server=ghcr.io/ymori-aka/frontend:${{ inputs.tag }} 2>&1
          kubectl -n default rollout status deployment/frontend --timeout=150s 2>&1
          FE=$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          echo "=== store / ==="; for i in 1 2 3; do curl -s -o /dev/null -w "  / HTTP %{http_code}\n" -m 12 "http://$FE/"; sleep 2; done
          echo "=== /bot (chat) 3x ==="
          for i in 1 2 3; do
            R=$(curl -s -m 40 -X POST "http://$FE/bot" -H "Content-Type: application/json" -d '{"message":"おすすめのTシャツは?","history":[]}' -w "|%{http_code}")
            echo "  #$i [${R##*|}] $(echo "$R"|sed -E 's/\|[0-9]+$//'|head -c160)"
          done
