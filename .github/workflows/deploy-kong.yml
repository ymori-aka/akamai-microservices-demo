name: Deploy Kong Gateway (Phase 1 — dbless OSS)
on: { workflow_dispatch: {} }
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Ensure helm is available
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            echo "Installing helm into ~/.local/bin"
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | HELM_INSTALL_DIR="$HOME/.local/bin" USE_SUDO=false bash
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi
          helm version

      - name: Create namespace + declarative ConfigMap
        run: |
          kubectl create namespace kong --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f kubernetes-manifests/kong/declarative.yaml

      - name: Install / upgrade Kong via Helm (dbless OSS)
        run: |
          helm repo add kong https://charts.konghq.com 2>/dev/null || true
          helm repo update
          helm upgrade --install kong kong/kong \
            -n kong \
            -f kubernetes-manifests/kong/values.yaml \
            --wait --timeout 6m

      - name: Verify
        run: |
          echo "===== kong namespace ====="
          kubectl -n kong get pods,svc -o wide
          echo ""
          POD=$(kubectl -n kong get pod -l app.kubernetes.io/name=kong -o name | head -1)
          if [ -n "$POD" ]; then
            echo "===== kong version ====="
            kubectl -n kong exec "$POD" -c proxy -- kong version || true
            echo "===== quick proxy probe (no routes yet, expect 404 from Kong) ====="
            kubectl -n kong run kong-curl --rm -i --restart=Never \
              --image=curlimages/curl:8.10.1 \
              --command -- curl -s -o /dev/null -w "kong-proxy: %{http_code}\n" \
              "http://kong-kong-proxy.kong.svc.cluster.local/" || true
          fi
