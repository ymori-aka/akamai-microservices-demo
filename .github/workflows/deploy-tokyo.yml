name: Deploy to Tokyo (jp-tyo-3) LKE

# Osaka→Tokyo consolidation, step ② (app + monitoring) and Kong.
#
# Deploys the SAME app + monitoring stack to the new Tokyo cluster
# (LKE id 610031, created by terraform-linode/lke.tf) so it runs in
# parallel with jp-osa until cut-over. This is the reproducible,
# "never region-locked again" path — it fetches the Tokyo kubeconfig and
# pins KUBECONFIG to it for every step, so it can NEVER touch jp-osa.
#
# Phase A (minimal-first, per migration plan):
#   - Postgres data is NOT migrated; the orders DB / postgres-exporter and
#     osa-specific monitoring (aclp-collector, audit-log-ingester) are SKIPPED.
#   - Istio is SKIPPED (the app runs sidecarless); so are istio policies + kiali.
#   - Object Storage images still point at the osa bucket via IMAGE_BASE_URL
#     in frontend.yaml until step ③ (new E3 bucket + copy).
#
# Required GitHub secrets (already present, used by deploy.yml / deploy-kong.yml):
#   GHCR_TOKEN, FRONTEND_ADMIN_PASSWORD, OTEL_BEARER_TOKEN
# Optional: FAI_API_KEY (Firewall for AI; created if present).
on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"
      image_tag:
        description: "Tag for the custom ghcr images (frontend/currency/productcatalog/checkout/cart)"
        required: true
        default: "latest"

env:
  REGISTRY: ghcr.io
  UPSTREAM: us-central1-docker.pkg.dev/google-samples/microservices-demo
  UPSTREAM_VERSION: v0.10.5

jobs:
  deploy-tokyo:
    name: Deploy app + monitoring + Kong to Tokyo
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Pin KUBECONFIG to the Tokyo cluster for ALL subsequent steps.
      # This guarantees we can never accidentally deploy into jp-osa.
      # ---------------------------------------------------------------
      - name: Fetch Tokyo kubeconfig + sanity-check target
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          if [ -z "$LINODE_PAT" ]; then
            echo "::error::LINODE_PAT secret is empty — cannot fetch kubeconfig. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          # Fetch via the Linode API directly (the runner has NO linode-cli).
          # GET .../kubeconfig returns {"kubeconfig":"<base64>"}.
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          if [ ! -s "$KC" ]; then
            echo "::error::Fetched kubeconfig is empty — aborting before any kubectl runs."
            exit 1
          fi
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"
          export KUBECONFIG="$KC"
          echo "=== target nodes (must be jp-tyo-3 / lke${{ inputs.cluster_id }}) ==="
          kubectl get nodes -o wide
          # Guard: refuse to proceed unless node names belong to this cluster.
          if ! kubectl get nodes -o name | grep -q "lke${{ inputs.cluster_id }}-"; then
            echo "::error::Node names do not match cluster ${{ inputs.cluster_id }} — aborting to protect jp-osa."
            exit 1
          fi

      - name: Create ghcr.io imagePullSecret (private custom images)
        continue-on-error: true
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=ymori-aka \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create frontend admin credentials Secret
        continue-on-error: true
        run: |
          kubectl create secret generic frontend-admin-secret \
            --from-literal=username=admin \
            --from-literal=password=${{ secrets.FRONTEND_ADMIN_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Firewall-for-AI secret (optional)
        continue-on-error: true
        env:
          FAI_API_KEY: ${{ secrets.FAI_API_KEY }}
        run: |
          if [ -n "$FAI_API_KEY" ]; then
            kubectl create secret generic fai-credentials \
              --from-literal=api-key="$FAI_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "FAI_API_KEY not set — skipping fai-credentials (frontend faiScreen no-ops)."
          fi

      - name: Apply orders DB credentials + schema (Tokyo Managed PG)
        # Migration ④: Tokyo gets its OWN empty Managed PostgreSQL
        # (MicroserviceDB-tyo, jp-tyo-3). Uses a Tokyo-specific secret so the
        # parallel OSA deploy keeps its own DB. Without ORDER_DB_DSN_TYO set,
        # this is skipped and orders simply aren't persisted (DSN is optional).
        if: env.ORDER_DB_DSN_TYO != ''
        continue-on-error: true
        env:
          ORDER_DB_DSN_TYO: ${{ secrets.ORDER_DB_DSN_TYO }}
        run: |
          for ns in default monitoring; do
            kubectl create secret generic orders-db-credentials \
              --from-literal=DSN="${ORDER_DB_DSN_TYO}" \
              --dry-run=client -o yaml | kubectl apply -n "$ns" -f -
          done
          kubectl create configmap orders-schema \
            --from-file=schema.sql=kubernetes-manifests/orders-schema.sql \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete job orders-schema-migrate --ignore-not-found
          kubectl apply -f kubernetes-manifests/orders-migrate-job.yaml
          kubectl wait --for=condition=complete --timeout=180s job/orders-schema-migrate || \
            kubectl logs job/orders-schema-migrate || true

      - name: Apply namespace PSS labels
        continue-on-error: true
        run: kubectl apply -f kubernetes-manifests/namespaces.yaml

      - name: Deploy core microservices (kustomize) + redis/mongodb
        continue-on-error: true
        run: |
          # Creates all deployments/services from bare manifests (image refs
          # are overridden in the next step). No istio, no sidecar injection.
          kubectl apply -k kubernetes-manifests/
          kubectl apply -f kubernetes-manifests/cartservice.yaml
          kubectl apply -f kubernetes-manifests/mongodb.yaml
          kubectl rollout status deployment/redis-cart --timeout=120s || true
          kubectl rollout status statefulset/mongodb --timeout=240s || true

      - name: Pin images (upstream v0.10.5 + custom ${{ inputs.image_tag }})
        continue-on-error: true
        run: |
          TAG="${{ inputs.image_tag }}"
          kubectl set image deployment/adservice             server=${UPSTREAM}/adservice:${UPSTREAM_VERSION}
          kubectl set image deployment/emailservice          server=${UPSTREAM}/emailservice:${UPSTREAM_VERSION}
          kubectl set image deployment/paymentservice        server=${UPSTREAM}/paymentservice:${UPSTREAM_VERSION}
          kubectl set image deployment/recommendationservice server=${UPSTREAM}/recommendationservice:${UPSTREAM_VERSION}
          kubectl set image deployment/shippingservice       server=${UPSTREAM}/shippingservice:${UPSTREAM_VERSION}
          kubectl set image deployment/cartservice           server=${REGISTRY}/ymori-aka/cartservice:${TAG}
          kubectl set image deployment/currencyservice       server=${REGISTRY}/ymori-aka/currencyservice:${TAG}
          kubectl set image deployment/productcatalogservice server=${REGISTRY}/ymori-aka/productcatalogservice:${TAG}
          kubectl set image deployment/checkoutservice       server=${REGISTRY}/ymori-aka/checkoutservice:${TAG}

      - name: Deploy frontend
        continue-on-error: true
        run: |
          TAG="${{ inputs.image_tag }}"
          kubectl apply -f kubernetes-manifests/frontend.yaml
          kubectl set image deployment/frontend server=${REGISTRY}/ymori-aka/frontend:${TAG}
          # Migration ③: point the product images at the new Tokyo (jp-tyo-3 / E3)
          # Object Storage bucket. Overridden here (not in the shared base
          # manifest) so the parallel OSA deployment keeps using its osa bucket
          # until the final cut-over.
          kubectl set env deployment/frontend \
            IMAGE_BASE_URL=https://akamai-boutique-img.jp-tyo-1.linodeobjects.com
          kubectl rollout status deployment/frontend --timeout=300s || {
            kubectl get pod -l app=frontend
            kubectl describe pod -l app=frontend | tail -40
            kubectl logs -l app=frontend --tail=30 --all-containers=true || true
          }

      - name: Enable app-level tracing (sidecarless → service-graph data)
        continue-on-error: true
        run: |
          # Tokyo runs sidecarless (no Istio) so there is NO Envoy telemetry.
          # Without app tracing the apps export nothing, Tempo's
          # metrics_generator produces no traces_service_graph_* metrics, and
          # both the Grafana Node Graph and Vizceral stay empty.
          #
          # The custom ymori-aka images (frontend/productcatalogservice/
          # checkoutservice/...) read COLLECTOR_SERVICE_ADDR and export OTLP
          # gRPC to it (and PANIC at boot if ENABLE_TRACING=1 but the addr is
          # unset). It is therefore the OTLP gRPC endpoint and MUST be the
          # collector's OTLP port :4317 — NOT the OpenCensus :55678 port, which
          # gives "Unimplemented: unknown service ...TraceService" because OTLP
          # TraceService isn't registered there. The upstream v0.10.5 images
          # (ad/email/payment/recommendation/shipping) and cartservice (.NET)
          # use OTEL_* instead; we set both families on every deployment and
          # each image reads only the one it understands. Idempotent.
          OC_ADDR="otel-collector.monitoring.svc.cluster.local:4317"
          OTLP="http://otel-collector.monitoring.svc.cluster.local:4317"
          APPS="frontend cartservice productcatalogservice currencyservice \
                checkoutservice shippingservice recommendationservice \
                adservice emailservice paymentservice"
          for d in $APPS; do
            # NOTE: do NOT force OTEL_PROPAGATORS here. These legacy images honor
            # the propagator env inconsistently (some hardcode it), so forcing
            # tracecontext desynced the services that were already correlating
            # and DROPPED frontend->productcatalog correlation from ~73% to ~3%.
            # Leaving the per-image defaults yields the best correlation; the
            # residual "user ->" edges (checkout/payment/email don't extract the
            # incoming context) would require rebuilding those images to fix.
            kubectl set env deployment/$d \
              ENABLE_TRACING=1 \
              COLLECTOR_SERVICE_ADDR="$OC_ADDR" \
              OTEL_EXPORTER_OTLP_ENDPOINT="$OTLP" \
              OTEL_EXPORTER_OTLP_PROTOCOL=grpc \
              OTEL_SERVICE_NAME="$d" || echo "skip $d (not present)"
            # Clear any OTEL_PROPAGATORS left over from a previous run.
            kubectl set env deployment/$d OTEL_PROPAGATORS- 2>/dev/null || true
          done
          # EXCEPTION: the custom currencyservice (Node.js) image has broken
          # OpenTelemetry-JS init code — it calls provider.addSpanProcessor(),
          # which was removed in its bundled SDK, so ENABLE_TRACING=1 makes it
          # crash at boot (TypeError: provider.addSpanProcessor is not a
          # function) and the store returns HTTP 500. Disable tracing just for
          # it; it still shows in the service graph as a target of its callers.
          kubectl set env deployment/currencyservice ENABLE_TRACING=0 || true
          kubectl rollout restart deployment $APPS || true

      - name: Attach ghcr-secret to all ServiceAccounts (fix private-image 401)
        continue-on-error: true
        run: |
          # cartservice/currencyservice use their own ServiceAccounts (not
          # "default"), which lacked the ghcr imagePullSecret, so their private
          # images fell back to anonymous pulls -> 401 ImagePullBackOff. Attach
          # ghcr-secret to EVERY ServiceAccount in the namespace so any pod
          # (current or future) can pull the private ymori-aka images. Durable:
          # re-running re-applies the same patch even after kustomize recreates
          # the SAs.
          for sa in $(kubectl get sa -o name); do
            kubectl patch "$sa" -p '{"imagePullSecrets":[{"name":"ghcr-secret"}]}' || true
          done
          # Re-roll the private-image apps so they re-pull with the secret.
          kubectl rollout restart deployment \
            frontend cartservice currencyservice productcatalogservice checkoutservice || true

      - name: Deploy k6 continuous load generator (keeps KPIs/graphs live)
        continue-on-error: true
        run: |
          # The demo is meant to show constant traffic (KPIs, Vizceral, Kiali,
          # service graph). loadgenerator.yaml is disabled in kustomize; k6.yaml
          # is a Deployment running constant-vus scenarios (browse/cart/checkout
          # /assistant) for 24h against frontend:80. Without it the dashboards
          # go quiet between manual bursts.
          kubectl apply -f kubernetes-manifests/k6.yaml
          # Restart so the updated scenario ConfigMap (e.g. chat scenario
          # disabled) is picked up — apply alone doesn't re-roll the pod.
          kubectl rollout restart deployment/k6 || true
          kubectl rollout status deployment/k6 --timeout=150s || \
            kubectl get pods -l app=k6 -o wide || true

      - name: Deploy core monitoring stack (no osa/DB/istio-specific parts)
        continue-on-error: true
        run: |
          kubectl apply -f kubernetes-manifests/monitoring/namespace.yaml
          kubectl create secret generic otel-bearer-token \
            --from-literal=token="${{ secrets.OTEL_BEARER_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -n monitoring -f -
          kubectl apply -f kubernetes-manifests/monitoring/otel-collector.yaml
          kubectl -n monitoring rollout restart deployment/otel-collector || true
          kubectl apply -f kubernetes-manifests/monitoring/redis-exporter.yaml
          kubectl apply -f kubernetes-manifests/monitoring/prometheus-rules.yaml
          kubectl apply -f kubernetes-manifests/monitoring/prometheus.yaml
          kubectl -n monitoring rollout restart deployment/prometheus || true
          kubectl apply -f kubernetes-manifests/monitoring/loki.yaml
          kubectl apply -f kubernetes-manifests/monitoring/promtail.yaml
          kubectl apply -f kubernetes-manifests/monitoring/tempo.yaml
          kubectl apply -f kubernetes-manifests/monitoring/grafana.yaml
          kubectl apply -f kubernetes-manifests/monitoring/grafana-dashboards.yaml
          # Vizceral animated service-traffic map (feeds off Tempo service-graph
          # metrics that the updated tempo.yaml now remote_writes to Prometheus).
          kubectl apply -f kubernetes-manifests/monitoring/vizceral.yaml
          # promviz + promviz-front — canonical Prometheus->Vizceral bridge,
          # same Tempo service-graph data source as vizceral.yaml + Node Graph.
          kubectl apply -f kubernetes-manifests/monitoring/promviz.yaml
          # Pick up the new OpenCensus receiver in the collector + new Tempo
          # metrics_generator config + reloaded dashboards.
          kubectl -n monitoring rollout restart deployment/otel-collector || true
          kubectl -n monitoring rollout restart deployment/tempo || true
          # vizceral/promviz embed config/HTML loaded at container start, so an
          # `apply` alone does not pick up ConfigMap/env changes — restart them.
          kubectl -n monitoring rollout restart deployment/vizceral || true
          kubectl -n monitoring rollout restart deployment/promviz || true
          kubectl -n monitoring rollout restart deployment/promviz-front || true
          kubectl -n monitoring rollout restart deployment/grafana || true
          # Akamai Cloud Pulse collector — Tokyo (jp-tyo-3) supports dbaas +
          # nodebalancer + objectstorage (jp-osa did NOT do objectstorage).
          # Bridges those into Prometheus :9464 (already scraped by the
          # 'aclp-dbaas' job) -> Grafana. IMPORTANT: the default deploy PAT
          # (LINODE_PAT) only has databases+monitor+lke scopes, so nodebalancer
          # and object_storage Cloud Pulse return nothing. Use ACLP_PAT (a
          # token scoped databases+monitor+nodebalancers+object_storage) when
          # present, falling back to LINODE_PAT.
          PAT="${{ secrets.ACLP_PAT }}"
          [ -z "$PAT" ] && PAT="${{ secrets.LINODE_PAT }}"
          kubectl -n monitoring create secret generic linode-pat \
            --from-literal=TOKEN="$PAT" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f kubernetes-manifests/monitoring/aclp-collector.yaml
          kubectl -n monitoring rollout restart deployment/aclp-collector || true
          # Business-KPI exporter: custom SQL on the orders table -> Prometheus
          # gauges (orders_daily_*, orders_today_*). Reads orders-db-credentials
          # (created above for the Tokyo Managed PG). Scraped by the existing
          # 'postgres-exporter' Prometheus job.
          kubectl apply -f kubernetes-manifests/monitoring/postgres-exporter.yaml
          kubectl -n monitoring rollout restart deployment/postgres-exporter || true
          echo "SKIPPED (osa/istio-specific): aclp-collector-healer, audit-log-ingester, kiali"

      - name: Wire promviz-front UPDATE_URL to promviz public LB
        continue-on-error: true
        run: |
          # promviz-front is a browser SPA that fetches UPDATE_URL directly from
          # the user's browser (no server-side proxy), so it must point at
          # promviz's PUBLIC LoadBalancer IP, not the in-cluster DNS name (which
          # the browser can't resolve -> UI stuck on "Loading"). Discover the LB
          # IP and inject it. promviz serves CORS * so the cross-origin fetch is
          # allowed.
          echo "waiting for promviz LoadBalancer IP..."
          PIP=""
          for i in $(seq 1 30); do
            PIP=$(kubectl -n monitoring get svc promviz -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            [ -n "$PIP" ] && break
            sleep 5
          done
          if [ -z "$PIP" ]; then
            echo "::warning::promviz LB IP not ready yet; promviz-front UPDATE_URL not wired this run."
          else
            echo "promviz LB IP = $PIP"
            kubectl -n monitoring set env deployment/promviz-front \
              UPDATE_URL="http://$PIP:9091/graph"
            kubectl -n monitoring rollout restart deployment/promviz-front || true
          fi

      - name: Deploy kube-state-metrics + node-exporter (pod/node metrics)
        continue-on-error: true
        run: |
          # Tokyo was missing these (they come from the grafana-k8s-monitoring
          # release on OSA), so kube_pod_* / node_* were empty -> "Pod Running"
          # and node panels blank. Install the standalone charts with
          # fullnameOverride so the Service names match the Prometheus static
          # targets (grafana-k8s-monitoring-kube-state-metrics:8080 and
          # -node-exporter:9100). monitoring ns enforces PSS=baseline, so
          # node-exporter runs with hostNetwork/hostPID disabled (reads the host
          # via hostPath, which baseline allows).
          if ! command -v helm >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | HELM_INSTALL_DIR="$HOME/.local/bin" USE_SUDO=false bash
            export PATH="$HOME/.local/bin:$PATH"
          fi
          export HELM_CONFIG_HOME="${RUNNER_TEMP:-/tmp}/helm-config" HELM_CACHE_HOME="${RUNNER_TEMP:-/tmp}/helm-cache" HELM_DATA_HOME="${RUNNER_TEMP:-/tmp}/helm-data"
          mkdir -p "$HELM_CONFIG_HOME" "$HELM_CACHE_HOME" "$HELM_DATA_HOME"
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community
          helm upgrade --install ksm prometheus-community/kube-state-metrics -n monitoring \
            --set fullnameOverride=grafana-k8s-monitoring-kube-state-metrics \
            --timeout 3m || true
          helm upgrade --install node-exporter prometheus-community/prometheus-node-exporter -n monitoring \
            --set fullnameOverride=grafana-k8s-monitoring-node-exporter \
            --set hostNetwork=false --set hostPID=false \
            --set service.port=9100 --set service.targetPort=9100 \
            --timeout 3m || true
          kubectl -n monitoring rollout status deployment/grafana-k8s-monitoring-kube-state-metrics --timeout=120s || true

      - name: Deploy Kong (dbless OSS) via Helm
        continue-on-error: true
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | HELM_INSTALL_DIR="$HOME/.local/bin" USE_SUDO=false bash
            export PATH="$HOME/.local/bin:$PATH"
          fi
          kubectl create namespace kong --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f kubernetes-manifests/kong/declarative.yaml || true
          export HELM_CONFIG_HOME="${RUNNER_TEMP:-/tmp}/helm-config"
          export HELM_CACHE_HOME="${RUNNER_TEMP:-/tmp}/helm-cache"
          export HELM_DATA_HOME="${RUNNER_TEMP:-/tmp}/helm-data"
          mkdir -p "$HELM_CONFIG_HOME" "$HELM_CACHE_HOME" "$HELM_DATA_HOME"
          helm repo add kong https://charts.konghq.com
          helm repo update kong
          helm upgrade --install kong kong/kong -n kong \
            -f kubernetes-manifests/kong/values.yaml --timeout 4m

      - name: Summary — pods + external IPs
        if: always()
        run: |
          echo "===== app pods (default) ====="
          kubectl get pods -o wide || true
          echo "===== monitoring pods ====="
          kubectl -n monitoring get pods -o wide || true
          echo "===== Kong pods ====="
          kubectl -n kong get pods -o wide || true
          kubectl -n kong get events --sort-by=.lastTimestamp 2>/dev/null | grep -iE "fail|error|warn" | tail -20 || true
          echo "===== NOT-Running app pods (diagnose ImagePullBackOff/crash) ====="
          for p in $(kubectl get pods --no-headers 2>/dev/null | grep -ivE 'Running|Completed' | awk '{print $1}'); do
            echo "--- $p ---"
            kubectl describe pod "$p" 2>/dev/null | grep -iE "image:|reason|message|failed|back-off|pull" | sed 's/^/    /' || true
            # last crash output (panics, missing-env, etc.)
            kubectl logs "$p" --previous --tail=12 2>/dev/null | sed 's/^/    crashlog| /' || true
          done
          echo "===== Vizceral / promviz endpoints (monitoring) ====="
          for s in vizceral promviz-front; do
            echo "$s: $(kubectl -n monitoring get svc $s -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)"
          done
          echo "===== viz pods + logs (diagnose empty-reply/OOM) ====="
          kubectl -n monitoring get pods -l 'app in (vizceral,promviz,promviz-front)' -o wide || true
          for d in promviz-front promviz vizceral; do
            echo "--- $d logs ---"
            kubectl -n monitoring logs deployment/$d --tail=15 2>&1 | sed 's/^/    /' || true
          done
          echo "===== LoadBalancer external IPs ====="
          kubectl get svc -A | grep -i loadbalancer || true
          echo ""
          echo "frontend-external (store):"
          kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}{"\n"}' || true
          echo "grafana (monitoring):"
          kubectl -n monitoring get svc grafana -o jsonpath='{.status.loadBalancer.ingress[0].ip}{"\n"}' || true
