name: Deploy Valkey creds + services (Tokyo, valkey branch)

# Creates/updates the valkey-credentials Secret (REDIS_ADDR — a
# StackExchange.Redis string for cartservice's C# client; and REDIS_URL —
# a rediss:// URL for the Go services' go-redis client) plus the
# valkey-ca-cert Secret, all from GitHub Secrets (VALKEY_ADDR /
# VALKEY_URL / VALKEY_CA_CERT — never hardcoded, repo is public). Applies
# cartservice / checkoutservice / frontend, pins their images to the
# built valkey-<sha> tags, rolls, and verifies the cart round-trip and
# the best-seller ranking end-to-end.
on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"
      cart_tag:
        description: "cartservice image tag (valkey-<sha>)"
        required: true
      checkout_tag:
        description: "checkoutservice image tag (valkey-<sha>)"
        required: true
      frontend_tag:
        description: "frontend image tag (valkey-<sha>)"
        required: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: apply valkey secrets + services, verify
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
          VALKEY_ADDR: ${{ secrets.VALKEY_ADDR }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          VALKEY_CA_CERT: ${{ secrets.VALKEY_CA_CERT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          echo "===== create/update valkey-credentials Secret (REDIS_ADDR + REDIS_URL) ====="
          kubectl create secret generic valkey-credentials \
            --from-literal=REDIS_ADDR="$VALKEY_ADDR" \
            --from-literal=REDIS_URL="$VALKEY_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "===== create/update valkey-ca-cert Secret ====="
          CA_FILE="${RUNNER_TEMP:-/tmp}/valkey-ca.pem"
          printf '%s' "$VALKEY_CA_CERT" > "$CA_FILE"
          kubectl create secret generic valkey-ca-cert \
            --from-file=ca.pem="$CA_FILE" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$CA_FILE"

          echo "===== apply manifests ====="
          kubectl apply -f kubernetes-manifests/cartservice.yaml
          kubectl apply -f kubernetes-manifests/checkoutservice.yaml
          kubectl apply -f kubernetes-manifests/frontend.yaml

          echo "===== pin images (manifests use placeholder image: fields) ====="
          kubectl set image deployment/cartservice     server=ghcr.io/ymori-aka/cartservice:${{ inputs.cart_tag }}
          kubectl set image deployment/checkoutservice server=ghcr.io/ymori-aka/checkoutservice:${{ inputs.checkout_tag }}
          kubectl set image deployment/frontend        server=ghcr.io/ymori-aka/frontend:${{ inputs.frontend_tag }}

          echo "===== roll all three ====="
          for d in cartservice checkoutservice frontend; do
            kubectl rollout restart deployment/$d
          done
          for d in cartservice checkoutservice frontend; do
            kubectl rollout status deployment/$d --timeout=4m
          done

          echo "===== service logs (valkey/ranking wiring) ====="
          kubectl logs deployment/checkoutservice --tail=15 2>&1 | grep -iE 'ranking|valkey|redis' || true
          kubectl logs deployment/frontend        --tail=15 2>&1 | grep -iE 'ranking|valkey|redis' || true

          echo "===== live verify: place an order, then check ranking ====="
          BASE="https://aka-store.tserof.net"
          CJ="${RUNNER_TEMP:-/tmp}/cj.txt"
          curl -sS -c "$CJ" -o /dev/null "$BASE/"
          curl -sS -b "$CJ" -c "$CJ" -o /dev/null -w "addToCart: %{http_code}\n" \
            -X POST "$BASE/cart" --data "product_id=AKMT007&quantity=2"
          curl -sS -b "$CJ" -c "$CJ" -o /dev/null -w "checkout: %{http_code}\n" \
            -X POST "$BASE/cart/checkout" \
            --data "email=valkey-test@example.com&street_address=1+Demo+St&zip_code=94105&city=SF&state=CA&country=United+States&credit_card_number=4111111111111111&credit_card_expiration_month=1&credit_card_expiration_year=2030&credit_card_cvv=672"
          sleep 3
          echo "--- /ranking page contains AKMT007? ---"
          curl -sS "$BASE/ranking" | grep -o "AKMT007" | head -1 \
            && echo "OK: best-seller ranking is live (Valkey sorted set round-trip works)" \
            || echo "WARN: AKMT007 not yet in ranking — check logs above"
