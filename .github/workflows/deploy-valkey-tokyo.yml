name: Deploy Valkey creds + cartservice (Tokyo, valkey branch)

# Creates/updates the valkey-credentials Secret (REDIS_ADDR — a full
# StackExchange.Redis connection string with TLS + auth) and the
# valkey-ca-cert Secret (the Aiven/Valkey CA cert) from GitHub Secrets
# (VALKEY_ADDR / VALKEY_CA_CERT — never hardcoded, repo is public),
# applies cartservice.yaml, and verifies cartservice can actually reach
# Managed Valkey end-to-end via a live checkout-lane exercise.
on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"
      image_tag:
        description: "cartservice image tag built by build-cartservice-valkey.yml (e.g. valkey-6f380bc)"
        required: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: apply valkey secrets + cartservice, verify
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
          VALKEY_ADDR: ${{ secrets.VALKEY_ADDR }}
          VALKEY_CA_CERT: ${{ secrets.VALKEY_CA_CERT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          echo "===== create/update valkey-credentials Secret ====="
          kubectl create secret generic valkey-credentials \
            --from-literal=REDIS_ADDR="$VALKEY_ADDR" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "===== create/update valkey-ca-cert Secret ====="
          CA_FILE="${RUNNER_TEMP:-/tmp}/valkey-ca.pem"
          printf '%s' "$VALKEY_CA_CERT" > "$CA_FILE"
          kubectl create secret generic valkey-ca-cert \
            --from-file=ca.pem="$CA_FILE" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$CA_FILE"

          echo "===== apply cartservice.yaml (removes redis-cart, wires valkey) ====="
          kubectl apply -f kubernetes-manifests/cartservice.yaml

          echo "===== pin to the built valkey image (cartservice.yaml's image: field is a placeholder) ====="
          kubectl set image deployment/cartservice server=ghcr.io/ymori-aka/cartservice:${{ inputs.image_tag }}

          echo "===== roll cartservice to pick up the new Secrets + image ====="
          kubectl rollout restart deployment/cartservice
          kubectl rollout status deployment/cartservice --timeout=3m

          echo "===== cartservice logs (connection errors?) ====="
          kubectl logs deployment/cartservice --tail=40 2>&1

          echo "===== live verify: add-to-cart + view-cart through the store ====="
          BASE="https://aka-store.tserof.net"
          COOKIEJAR="${RUNNER_TEMP:-/tmp}/cart-cookies.txt"
          curl -sS -c "$COOKIEJAR" -o /dev/null "$BASE/"
          curl -sS -b "$COOKIEJAR" -c "$COOKIEJAR" -o /dev/null -w "addToCart: %{http_code}\n" \
            -X POST "$BASE/cart" --data "product_id=AKMT001&quantity=1"
          curl -sS -b "$COOKIEJAR" "$BASE/cart" | grep -qi "AKMT001" \
            && echo "OK: item persisted in cart (Valkey round-trip works)" \
            || echo "WARN: item not found in cart response — check logs above"
