name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ymori-aka/frontend
  CURRENCY_IMAGE: ghcr.io/ymori-aka/currencyservice

jobs:
  # -------------------------------------------------------
  # Job 1a: Build and push frontend Docker image
  # -------------------------------------------------------
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 1b: Build and push currencyservice Docker image
  # -------------------------------------------------------
  build-currencyservice:
    name: Build Currency Service Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push currencyservice image
        uses: docker/build-push-action@v6
        with:
          context: ./src/currencyservice
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CURRENCY_IMAGE }}:sha-${{ github.sha }}
            ${{ env.CURRENCY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 2: Deploy to LKE
  # -------------------------------------------------------
  deploy:
    name: Deploy to LKE
    runs-on: self-hosted
    needs: [build-frontend, build-currencyservice]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update microservices to v0.10.5
        continue-on-error: true
        run: |
          REGISTRY="us-central1-docker.pkg.dev/google-samples/microservices-demo"
          VERSION="v0.10.5"
          kubectl set image deployment/adservice             server=${REGISTRY}/adservice:${VERSION}
          kubectl set image deployment/cartservice           server=${REGISTRY}/cartservice:${VERSION}
          kubectl set image deployment/checkoutservice       server=${REGISTRY}/checkoutservice:${VERSION}
          # currencyservice: use our custom build (live exchange rates)
          kubectl set image deployment/currencyservice server=${{ env.CURRENCY_IMAGE }}:sha-${{ github.sha }}
          kubectl set image deployment/emailservice          server=${REGISTRY}/emailservice:${VERSION}
          kubectl set image deployment/paymentservice        server=${REGISTRY}/paymentservice:${VERSION}
          kubectl set image deployment/recommendationservice server=${REGISTRY}/recommendationservice:${VERSION}
          kubectl set image deployment/shippingservice       server=${REGISTRY}/shippingservice:${VERSION}
          kubectl set image deployment/loadgenerator         server=${REGISTRY}/loadgenerator:${VERSION}
          # productcatalogservice is handled separately (ConfigMap update + restart below)
          kubectl set image deployment/productcatalogservice server=${REGISTRY}/productcatalogservice:${VERSION}

      - name: Update frontend deployment
        run: |
          IMAGE_TAG="ghcr.io/ymori-aka/frontend:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          kubectl apply -f kubernetes-manifests/frontend.yaml
          kubectl set image deployment/frontend server=${IMAGE_TAG}
          kubectl rollout status deployment/frontend --timeout=300s

      - name: Update product catalog ConfigMap
        run: |
          kubectl create configmap products-catalog \
            --from-file=products.json=./src/productcatalogservice/products.json \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout restart deployment/productcatalogservice
          kubectl rollout status deployment/productcatalogservice --timeout=180s

      - name: Seed admin-only products (AKMT028, AKMT029)
        run: |
          FRONTEND="http://$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          ADMIN_USER=$(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="ADMIN_USER")].value}')
          ADMIN_PASS=$(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="ADMIN_PASSWORD")].value}')
          AUTH="-u ${ADMIN_USER}:${ADMIN_PASS}"

          seed_product() {
            local ID=$1; local NAME_EN=$2; local NAME_JA=$3
            local PRICE=$4; local PICTURE=$5
            local DESC_EN=$6; local DESC_JA=$7

            # Always register (add action overwrites if ID already exists)
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" $AUTH \
              -F "action=add" \
              -F "new_id=${ID}" \
              -F "new_name_en=${NAME_EN}" \
              -F "new_name_ja=${NAME_JA}" \
              -F "new_price=${PRICE}" \
              -F "new_categories=apparel,t-shirts" \
              -F "new_picture=${PICTURE}" \
              -F "new_desc_en=${DESC_EN}" \
              -F "new_desc_ja=${DESC_JA}" \
              "${FRONTEND}/admin/inventory")
            echo "${ID}: ${HTTP}"
          }

          seed_product \
            "AKMT028" \
            "PEACE FOR ALL Tee / Akamai - White" \
            "PEACE FOR ALL Tシャツ/アカマイ　白" \
            "29.99" \
            "/static/img/products/custom/AKMT028.jpg" \
            "Over 25 years ago, Akamai laid the foundation for today's connected internet. This T-shirt is a tribute to the dawn of the internet era. The beige color references the iconic 'beige box' computers of that time. The heart on the chest symbolizes how the internet has connected people toward a better world. The code on the back is real — a nod to Linux and the open-source spirit powering the web. Through these shared languages, Akamai connects the world's leading brands with users everywhere, building a safer, more connected future." \
            "25年以上前、Akamaiは今日のインターネットが自在に使える時代の礎を築きました。このTシャツのデザインは、そんなインターネット黎明期へのオマージュです。カラーは、当時「ベージュの箱」と呼ばれたコンピューターのプラスチック製の筐体をイメージしました。胸もとのハートは、インターネットが人々をつなぎ、より良い世界へ導いてきたことを表現しています。Tシャツの背面にプリントされているのは本物のコードです。それは、インターネットを支えるオープンソースのしくみを象徴する基本ソフト Linux にも通じます。世界中で愛されるこれらの共通言語の力を借りて、Akamaiが、世界を導くブランドとその先のユーザーとを結びつけ、より安全で、よりつながる未来を共に築いていきたい ―― そんな想いを、この一枚に込めました。"

          seed_product \
            "AKMT029" \
            "PEACE FOR ALL Tee / Akamai - Black" \
            "PEACE FOR ALL Tシャツ/アカマイ　黒" \
            "29.99" \
            "/static/img/products/custom/AKMT029.webp" \
            "Every day, billions of people connect online — working, playing, learning, shopping, and sharing ideas. The 'texture' code featured in this design represents the common language behind every digital experience. For 25 years, Akamai has built a comfortable, secure internet to enrich lives around the world. We remain committed to making the world safer and more deeply connected." \
            "毎日、何十億もの人々が、オンラインで仕事、遊び、学び、ショッピング、アイデアの共有をしながら、つながっています。このデザインに使われている「texture」というコードは、デジタル体験の裏側にある共通言語を表現しています。Akamaiは 25 年にわたり、世界中の人々の人生をより豊かなものにするために、快適で安心なインターネット環境を築いてきました。これからも、世界をより安全に、より深く結びつける一役を担いたいと願っています。"

  # -------------------------------------------------------
  # Job 3: Build and deploy Spin apps to Akamai Functions
  # -------------------------------------------------------
  deploy-spin:
    name: Deploy Spin Apps to Akamai Functions
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Spin CLI and aka plugin
        run: |
          curl -fsSL https://developer.fermyon.com/downloads/install.sh | bash
          sudo mv spin /usr/local/bin/spin
          spin --version
          spin plugins update --yes
          spin plugins install aka --yes

      - name: Authenticate with Akamai Functions
        run: spin aka login --token ${{ secrets.SPIN_AKA_ACCESS_TOKEN }}

      - name: Deploy recommendation-service
        continue-on-error: true
        working-directory: src/spin-functions/recommendation-service
        run: |
          npm ci
          npm run build
          spin aka app link --app-name recommendation-service
          spin aka app deploy --no-confirm

      - name: Deploy product-intro-service
        continue-on-error: true
        working-directory: src/spin-functions/product-intro-service
        run: |
          npm ci
          npm run build
          spin aka app link --app-name product-intro-service
          spin aka app deploy --no-confirm

      - name: Deploy shopping-assistant-service
        continue-on-error: true
        working-directory: src/spin-functions/shopping-assistant-service
        run: |
          npm ci
          npm run build
          spin aka app link --app-name shopping-assistant-service
          spin aka app deploy --no-confirm
