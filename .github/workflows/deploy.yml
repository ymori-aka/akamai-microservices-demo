name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ymori-aka/frontend

jobs:
  # -------------------------------------------------------
  # Job 1: Build and push frontend Docker image
  # -------------------------------------------------------
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 2: Deploy to LKE
  # -------------------------------------------------------
  deploy:
    name: Deploy to LKE
    runs-on: self-hosted
    needs: build-frontend
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update frontend deployment
        run: |
          IMAGE_TAG="ghcr.io/ymori-aka/frontend:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          kubectl set image deployment/frontend server=${IMAGE_TAG}
          kubectl rollout status deployment/frontend --timeout=300s

      - name: Update product catalog ConfigMap
        run: |
          kubectl create configmap products-catalog \
            --from-file=products.json=./src/productcatalogservice/products.json \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout restart deployment/productcatalogservice
          kubectl rollout status deployment/productcatalogservice --timeout=180s

  # -------------------------------------------------------
  # Job 3: Build and deploy Spin apps to Akamai Functions
  # -------------------------------------------------------
  deploy-spin:
    name: Deploy Spin Apps to Akamai Functions
    runs-on: self-hosted
    needs: build-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy recommendation-service
        working-directory: src/spin-functions/recommendation-service
        run: |
          npm install
          npm run build
          spin aka app link --app-name recommendation-service
          spin aka app deploy --no-confirm

      - name: Deploy product-intro-service
        working-directory: src/spin-functions/product-intro-service
        run: |
          npm install
          npm run build
          spin aka app link --app-name product-intro-service
          spin aka app deploy --no-confirm
