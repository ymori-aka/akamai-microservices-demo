name: Build and Deploy

on:
  push:
    branches:
      - main
  # Allow manual triggering from the GitHub Actions UI (always deploys).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ymori-aka/frontend
  CURRENCY_IMAGE: ghcr.io/ymori-aka/currencyservice
  PRODUCTCATALOG_IMAGE: ghcr.io/ymori-aka/productcatalogservice
  CHECKOUT_IMAGE: ghcr.io/ymori-aka/checkoutservice
  CART_IMAGE: ghcr.io/ymori-aka/cartservice

jobs:
  # -------------------------------------------------------
  # Job 1a: Build and push frontend Docker image
  # -------------------------------------------------------
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 1b: Build and push currencyservice Docker image
  # -------------------------------------------------------
  build-currencyservice:
    name: Build Currency Service Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push currencyservice image
        uses: docker/build-push-action@v6
        with:
          context: ./src/currencyservice
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CURRENCY_IMAGE }}:sha-${{ github.sha }}
            ${{ env.CURRENCY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 1c: Build and push productcatalogservice Docker image
  # -------------------------------------------------------
  build-productcatalogservice:
    name: Build Product Catalog Service Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push productcatalogservice image
        uses: docker/build-push-action@v6
        with:
          context: ./src/productcatalogservice
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PRODUCTCATALOG_IMAGE }}:sha-${{ github.sha }}
            ${{ env.PRODUCTCATALOG_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 1d: Build and push checkoutservice Docker image
  # -------------------------------------------------------
  build-checkoutservice:
    name: Build Checkout Service Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push checkoutservice image
        uses: docker/build-push-action@v6
        with:
          context: ./src/checkoutservice
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CHECKOUT_IMAGE }}:sha-${{ github.sha }}
            ${{ env.CHECKOUT_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 1e: Build and push cartservice Docker image
  # (custom build — adds OpenTelemetry.Instrumentation.StackExchangeRedis
  # so cart Redis ops show up as spans in Tempo.)
  # -------------------------------------------------------
  build-cartservice:
    name: Build Cart Service Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push cartservice image
        uses: docker/build-push-action@v6
        with:
          # Dockerfile COPYs cartservice.csproj and protos/Cart.proto from
          # the context root; both live in src/cartservice/src.
          context: ./src/cartservice/src
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CART_IMAGE }}:sha-${{ github.sha }}
            ${{ env.CART_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 2: Deploy to LKE
  # -------------------------------------------------------
  deploy:
    name: Deploy to LKE
    runs-on: self-hosted
    needs: [build-frontend, build-currencyservice, build-productcatalogservice, build-checkoutservice, build-cartservice]
    # Only deploy when:
    #   - commit message contains [deploy]   (e.g. "fix something [deploy]")
    #   - OR the workflow is triggered manually from the Actions UI
    # On regular pushes without [deploy], the build jobs run but deploy
    # is skipped — saving 10-15 min per push.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[deploy]')
    permissions:
      contents: read
      packages: read
    env:
      ORDER_DB_DSN: ${{ secrets.ORDER_DB_DSN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Without this, kubectl on the self-hosted runner falls back to its
      # default context, which points at the decommissioned Osaka cluster
      # (DNS for *.jp-osa-1-gw.linodelke.net no longer resolves). Every
      # kubectl step in this job was silently failing as a result — builds
      # succeeded, nothing ever reached the Tokyo cluster.
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo-deploy.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: Create ghcr.io imagePullSecret
        continue-on-error: true
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=ymori-aka \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create frontend admin credentials Secret
        continue-on-error: true
        run: |
          kubectl create secret generic frontend-admin-secret \
            --from-literal=username=admin \
            --from-literal=password=${{ secrets.FRONTEND_ADMIN_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Pod Security Standards namespace labels
        continue-on-error: true
        run: |
          # Silences the Linode Cloud Manager "namespace without PSS
          # policy" warning by labeling default / istio-system here and
          # monitoring via its own namespace.yaml (applied later in the
          # monitoring stack step).
          kubectl apply -f kubernetes-manifests/namespaces.yaml

      - name: Install Istio service mesh (idempotent)
        continue-on-error: true
        run: |
          ISTIO_VERSION="1.22.3"
          ISTIOCTL="/tmp/bin/istioctl"
          mkdir -p "/tmp/bin"

          # Download istioctl only when the cached binary is missing or stale.
          if ! "${ISTIOCTL}" version --remote=false 2>/dev/null | grep -q "${ISTIO_VERSION}"; then
            echo "Downloading istioctl ${ISTIO_VERSION}..."
            curl -L https://istio.io/downloadIstio \
              | ISTIO_VERSION=${ISTIO_VERSION} TARGET_ARCH=x86_64 sh - 2>&1
            mv "istio-${ISTIO_VERSION}/bin/istioctl" "${ISTIOCTL}"
            rm -rf "istio-${ISTIO_VERSION}"
          fi

          # Clean up any stale/broken Validating + MutatingWebhookConfiguration
          # from a previous failed install. istioctl's server-side apply fails
          # if one exists with an invalid clientConfig (LKE has hit this).
          kubectl delete validatingwebhookconfiguration istio-validator-istio-system --ignore-not-found
          kubectl delete validatingwebhookconfiguration istiod-default-validator --ignore-not-found
          kubectl delete mutatingwebhookconfiguration istio-sidecar-injector --ignore-not-found
          kubectl delete mutatingwebhookconfiguration istio-revision-tag-default --ignore-not-found

          # Install / upgrade Istio — minimal profile = istiod only.
          # We don't use the Istio ingress gateway; traffic enters via the
          # existing Kubernetes LoadBalancer on the frontend service.
          "${ISTIOCTL}" install --set profile=minimal -y

          # Verify istiod actually came up; warn (don't fail) if not.
          kubectl -n istio-system rollout status deployment/istiod --timeout=180s || \
            echo "WARNING: istiod rollout did not complete in 180s"
          kubectl -n istio-system get pods -l app=istiod -o wide || true

          # Enable automatic Envoy sidecar injection in the app namespace.
          # Note: redis-cart and mongodb have sidecar.istio.io/inject: "false"
          # in their pod template annotations because LKE's managed API server
          # cannot reach the admission webhook (ClusterIP unreachable). Those
          # workloads are re-applied from YAML in subsequent steps instead.
          kubectl label namespace default istio-injection=enabled --overwrite

      - name: Apply redis-cart and MongoDB (no sidecar injection)
        continue-on-error: true
        run: |
          # Re-apply from YAML to pick up the sidecar.istio.io/inject: "false"
          # annotation added to prevent LKE webhook failures.
          kubectl apply -f kubernetes-manifests/cartservice.yaml
          kubectl apply -f kubernetes-manifests/mongodb.yaml
          kubectl rollout status deployment/redis-cart --timeout=120s || true

      - name: Remove obsolete RabbitMQ and queuemaster resources
        continue-on-error: true
        run: |
          # RabbitMQ + queuemaster were removed from the architecture
          # (Business KPIs come from postgres-exporter directly).
          # Clean up any leftover resources from previous deploys.
          kubectl delete statefulset rabbitmq -n default --ignore-not-found
          kubectl delete service rabbitmq -n default --ignore-not-found
          kubectl delete configmap rabbitmq-plugins -n default --ignore-not-found
          kubectl delete deployment queuemaster -n default --ignore-not-found
          kubectl delete service queuemaster -n default --ignore-not-found
          kubectl delete serviceaccount queuemaster -n default --ignore-not-found

      - name: Deploy k6 continuous load generator
        continue-on-error: true
        run: |
          # k6 streams HTTP metrics via remote_write into the existing
          # Prometheus (which now has --web.enable-remote-write-receiver
          # in the monitoring step). Runs constantly with 10 VUs across
          # browse / shop / checkout scenarios.
          kubectl apply -f kubernetes-manifests/k6.yaml
          # Force a restart so script ConfigMap changes land immediately;
          # without this kubectl apply on the ConfigMap is "configured"
          # but the running pod keeps the cached script.
          kubectl rollout restart deployment/k6 || true
          kubectl rollout status deployment/k6 --timeout=120s || true

      - name: Update microservices to v0.10.5
        continue-on-error: true
        run: |
          REGISTRY="us-central1-docker.pkg.dev/google-samples/microservices-demo"
          VERSION="v0.10.5"
          kubectl set image deployment/adservice             server=${REGISTRY}/adservice:${VERSION}
          # cartservice: use our custom build (OTel Redis instrumentation
          # for cart HMGET/HSET spans in Tempo). The container is named
          # `server` in the upstream manifest so we keep that.
          kubectl set image deployment/cartservice server=${{ env.CART_IMAGE }}:sha-${{ github.sha }}
          # checkoutservice: use our custom build (Postgres-backed orders)
          # currencyservice: use our custom build (live exchange rates)
          kubectl set image deployment/currencyservice server=${{ env.CURRENCY_IMAGE }}:sha-${{ github.sha }}
          kubectl set image deployment/emailservice          server=${REGISTRY}/emailservice:${VERSION}
          kubectl set image deployment/paymentservice        server=${REGISTRY}/paymentservice:${VERSION}
          kubectl set image deployment/recommendationservice server=${REGISTRY}/recommendationservice:${VERSION}
          kubectl set image deployment/shippingservice       server=${REGISTRY}/shippingservice:${VERSION}
          # Locust loadgenerator is retired — k6 (kubernetes-manifests/k6.yaml)
          # is the sole load generator now. Tear down any leftover resources
          # from a previous deploy.
          kubectl delete deployment loadgenerator --ignore-not-found
          kubectl delete configmap loadgenerator-locust --ignore-not-found
          kubectl delete serviceaccount loadgenerator --ignore-not-found
          # productcatalogservice: use our custom build (MongoDB-backed catalog)
          # Image is set in the dedicated step below.

      - name: Update frontend deployment
        # Don't let a frontend rollout timeout block downstream steps —
        # particularly the monitoring stack (postgres-exporter probe fix).
        continue-on-error: true
        run: |
          IMAGE_TAG="ghcr.io/ymori-aka/frontend:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          kubectl apply -f kubernetes-manifests/frontend.yaml
          kubectl set image deployment/frontend server=${IMAGE_TAG}
          kubectl rollout status deployment/frontend --timeout=300s || {
            echo "frontend rollout failed — dumping pod state for diagnostics"
            kubectl get pod -l app=frontend
            kubectl describe pod -l app=frontend | tail -40
            kubectl logs -l app=frontend --tail=30 --all-containers=true || true
          }

      - name: Deploy MongoDB (catalog persistence)
        continue-on-error: true
        run: |
          kubectl apply -f kubernetes-manifests/mongodb.yaml
          kubectl rollout status statefulset/mongodb --timeout=240s

      - name: Update productcatalogservice deployment (MongoDB-backed)
        id: pcs_rollout
        continue-on-error: true
        run: |
          IMAGE_TAG="${{ env.PRODUCTCATALOG_IMAGE }}:sha-${{ github.sha }}"
          kubectl apply -f kubernetes-manifests/productcatalogservice.yaml
          kubectl set image deployment/productcatalogservice server=${IMAGE_TAG}
          # Clear any stale rollout status from previous failed deploys
          kubectl rollout restart deployment/productcatalogservice
          kubectl rollout status deployment/productcatalogservice --timeout=300s

      - name: Apply orders DB credentials and schema (Linode Managed PG)
        if: env.ORDER_DB_DSN != ''
        continue-on-error: true
        run: |
          # K8s Secret with the connection string (default namespace for app,
          # monitoring namespace for postgres-exporter)
          kubectl create secret generic orders-db-credentials \
            --from-literal=DSN="${ORDER_DB_DSN}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic orders-db-credentials \
            --from-literal=DSN="${ORDER_DB_DSN}" \
            --dry-run=client -o yaml | kubectl apply -n monitoring -f -

          # ConfigMap with the schema SQL (re-applied each run; idempotent)
          kubectl create configmap orders-schema \
            --from-file=schema.sql=kubernetes-manifests/orders-schema.sql \
            --dry-run=client -o yaml | kubectl apply -f -

          # Run the migration Job (delete previous to allow re-run)
          kubectl delete job orders-schema-migrate --ignore-not-found
          kubectl apply -f kubernetes-manifests/orders-migrate-job.yaml
          kubectl wait --for=condition=complete --timeout=120s job/orders-schema-migrate || \
            kubectl logs job/orders-schema-migrate

      - name: Update checkoutservice deployment (Postgres-backed orders)
        continue-on-error: true
        run: |
          IMAGE_TAG="${{ env.CHECKOUT_IMAGE }}:sha-${{ github.sha }}"
          kubectl apply -f kubernetes-manifests/checkoutservice.yaml
          kubectl set image deployment/checkoutservice server=${IMAGE_TAG}
          kubectl rollout status deployment/checkoutservice --timeout=240s
          echo "--- checkoutservice logs (last 20 lines) ---"
          kubectl logs deployment/checkoutservice --tail=20 || true

      - name: Debug productcatalogservice if rollout failed
        if: steps.pcs_rollout.outcome == 'failure'
        continue-on-error: true
        run: |
          echo '=== pods ==='
          kubectl get pods -l app=productcatalogservice -o wide
          echo '=== describe (newest pod) ==='
          POD=$(kubectl get pods -l app=productcatalogservice --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}')
          kubectl describe pod ${POD} | tail -60
          echo '=== logs (newest pod, current) ==='
          kubectl logs ${POD} --tail=100 || true
          echo '=== logs (newest pod, previous) ==='
          kubectl logs ${POD} --previous --tail=100 || true
          echo '=== mongodb status ==='
          kubectl get pods -l app=mongodb
          kubectl logs -l app=mongodb --tail=20 || true
          # NOTE: do NOT `exit 1` here — this is a diagnostic-only step.
          # Failing it aborted the job before the monitoring stack deployed.

      - name: Apply Istio policies (mTLS + canary)
        continue-on-error: true
        run: |
          kubectl apply -f kubernetes-manifests/istio/mtls.yaml
          kubectl apply -f kubernetes-manifests/istio/canary.yaml

      - name: Apply HPA
        continue-on-error: true
        run: |
          kubectl apply -f kubernetes-manifests/hpa.yaml

      - name: Deploy monitoring stack
        continue-on-error: true
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          kubectl apply -f kubernetes-manifests/monitoring/namespace.yaml

          # Bearer-token Secret for the public OTLP HTTP receiver
          # (used by Akamai Functions Spin apps). The collector mounts
          # this via env var and rejects requests without a matching
          # Authorization: Bearer header.
          kubectl create secret generic otel-bearer-token \
            --from-literal=token="${{ secrets.OTEL_BEARER_TOKEN }}" \
            --dry-run=client -o yaml \
            | kubectl apply -n monitoring -f -

          kubectl apply -f kubernetes-manifests/monitoring/otel-collector.yaml
          # Force restart so the collector picks up the new bearer token
          # / config changes (apply alone won't restart if Deployment
          # spec is unchanged).
          kubectl -n monitoring rollout restart deployment/otel-collector || true
          kubectl apply -f kubernetes-manifests/monitoring/redis-exporter.yaml
          # Apply alert rule ConfigMap BEFORE Prometheus so the rules are
          # available the moment Prometheus restarts and re-reads its config.
          kubectl apply -f kubernetes-manifests/monitoring/prometheus-rules.yaml
          # Self-healer CronJob: auto-restarts aclp-collector when DBaaS
          # (Managed PostgreSQL) metrics go absent. Remediation companion to
          # the AclpDbaasMetricsMissing alert in prometheus-rules.yaml.
          kubectl apply -f kubernetes-manifests/monitoring/aclp-collector-healer.yaml
          kubectl apply -f kubernetes-manifests/monitoring/prometheus.yaml
          # Force Prometheus restart so config + rule changes take effect.
          kubectl -n monitoring rollout restart deployment/prometheus || true
          kubectl apply -f kubernetes-manifests/monitoring/loki.yaml
          kubectl apply -f kubernetes-manifests/monitoring/promtail.yaml
          kubectl apply -f kubernetes-manifests/monitoring/tempo.yaml

          # Audit-log ingester: Object Storage credentials Secret + CronJob.
          # Pulls Akamai Cloud Pulse audit logs from the akamai-audit-logs
          # bucket into Loki. Only deploy when the keys are present.
          if [ -n "${{ secrets.AUDIT_S3_ACCESS_KEY }}" ]; then
            kubectl create secret generic audit-s3-credentials \
              --from-literal=access_key="${{ secrets.AUDIT_S3_ACCESS_KEY }}" \
              --from-literal=secret_key="${{ secrets.AUDIT_S3_SECRET_KEY }}" \
              --dry-run=client -o yaml \
              | kubectl apply -n monitoring -f -
            kubectl apply -f kubernetes-manifests/monitoring/audit-log-ingester.yaml
          fi
          # admin-password is a placeholder in git (see grafana.yaml comment) —
          # substitute the real secret before apply so re-deploys don't reset
          # the admin password back to a hardcoded literal.
          sed "s|__GRAFANA_ADMIN_PASSWORD__|${{ secrets.GRAFANA_ADMIN_PASSWORD }}|g" \
            kubernetes-manifests/monitoring/grafana.yaml | kubectl apply -f -
          kubectl apply -f kubernetes-manifests/monitoring/grafana-dashboards.yaml
          kubectl apply -f kubernetes-manifests/monitoring/kiali.yaml
          kubectl apply -f kubernetes-manifests/monitoring/postgres-exporter.yaml
          # Always restart postgres-exporter to recover from any crash/connection loss
          kubectl -n monitoring rollout restart deployment/postgres-exporter
          kubectl -n monitoring rollout status deployment/postgres-exporter --timeout=180s || true

          # VERIFY that the custom metrics are actually flowing. The /metrics
          # endpoint returns 200 OK even when DB queries fail in v0.15.0, so
          # only grepping for our metric proves the SQL pipeline works.
          echo "===== postgres-exporter pod status ====="
          kubectl -n monitoring get pod -l app=postgres-exporter -o wide
          echo ""
          echo "===== Verifying orders_daily_order_count is being emitted ====="
          PG_EXP_POD=$(kubectl -n monitoring get pod -l app=postgres-exporter -o name | head -1)
          if [ -n "${PG_EXP_POD}" ]; then
            for i in 1 2 3 4 5; do
              if kubectl -n monitoring exec ${PG_EXP_POD} -- \
                 sh -c "wget -qO- http://localhost:9187/metrics | grep -qE '^orders_daily_order_count[ {]'"; then
                echo "✓ orders_daily_order_count metric present (attempt ${i})"
                kubectl -n monitoring exec ${PG_EXP_POD} -- \
                  sh -c "wget -qO- http://localhost:9187/metrics | grep -E '^orders_'" | head -10
                break
              fi
              echo "Attempt ${i}: metric not yet present, retrying in 10s..."
              sleep 10
              if [ ${i} -eq 5 ]; then
                echo "✗ FAILED: orders_daily_order_count missing after 50s"
                echo "===== postgres-exporter logs ====="
                kubectl -n monitoring logs ${PG_EXP_POD} --tail=50
              fi
            done
          fi

          # Restart Grafana so it picks up any datasource ConfigMap changes
          # (datasource provisioning is only loaded at pod startup).
          kubectl -n monitoring rollout restart deployment/grafana
          kubectl -n monitoring rollout status deployment/grafana --timeout=120s || true

          # Istio service mesh Grafana dashboards (official ones from
          # istio/istio release-1.22). Created as a separate ConfigMap so
          # the main grafana-dashboards ConfigMap stays under the 256 KiB
          # K8s limit. Grafana picks them up via the `istio` dashboard
          # provider configured in grafana.yaml.
          mkdir -p /tmp/istio-dashboards
          ISTIO_DB_BASE='https://raw.githubusercontent.com/istio/istio/release-1.22/manifests/addons/dashboards'
          for db in istio-mesh-dashboard istio-service-dashboard pilot-dashboard; do
            curl -fsSL "${ISTIO_DB_BASE}/${db}.json" \
              -o "/tmp/istio-dashboards/${db}.json" || true
          done
          kubectl -n monitoring create configmap grafana-istio-dashboards \
            --from-file=/tmp/istio-dashboards/ \
            --dry-run=client -o yaml | kubectl apply --server-side=true -f - || true

          # Akamai Cloud Pulse collector + its PAT Secret (optional — only
          # deployed when LINODE_PAT is present).
          if [ -n "${LINODE_PAT}" ]; then
            # Delete the existing Secret first to guarantee a fresh value
            # lands. `kubectl apply` with the same TOKEN content prints
            # "unchanged" and leaves the old (possibly stale) Secret in
            # place, even after a PAT rotation in GitHub Secrets.
            kubectl -n monitoring delete secret linode-pat --ignore-not-found
            kubectl -n monitoring create secret generic linode-pat \
              --from-literal=TOKEN="${LINODE_PAT}"

            # Sanity-check that the PAT actually works against the Cloud
            # Pulse JWT endpoint (this is the exact call aclp-collector
            # makes first). Logs HTTP code, never fails the step.
            echo -n "PAT JWT check: "
            curl -s -o /dev/null -w "HTTP %{http_code}\n" \
              -X POST -H "Authorization: Bearer ${LINODE_PAT}" \
              -H "Content-Type: application/json" \
              "https://api.linode.com/v4/monitor/services/dbaas/token" \
              -d '{"entity_ids":[470692]}'

            kubectl apply -f kubernetes-manifests/monitoring/aclp-collector.yaml
            # Force a fresh aclp-collector pod so it picks up any PAT or
            # config changes; otherwise "Deployment unchanged" leaves an
            # old pod running indefinitely.
            kubectl -n monitoring rollout restart deployment/aclp-collector
          else
            echo "LINODE_PAT not set — skipping aclp-collector deployment."
          fi

      - name: Diagnostics — aclp-collector status, Prometheus targets
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "1. aclp-collector pod status & logs"
          echo "=========================================="
          kubectl -n monitoring get pods -l app=aclp-collector -o wide || true
          kubectl -n monitoring logs -l app=aclp-collector --tail=30 || true

          echo ""
          echo "=========================================="
          echo "3. aclp-collector /metrics endpoint check"
          echo "=========================================="
          ACLP_POD=$(kubectl -n monitoring get pod -l app=aclp-collector -o name | head -1)
          if [ -n "${ACLP_POD}" ]; then
            kubectl -n monitoring exec ${ACLP_POD} -- /bin/sh -c \
              "wget -qO- http://localhost:9464/metrics 2>/dev/null | grep -E '^avg_(cpu|memory|disk)_usage' | head -10" \
              || echo "(no avg_* metrics yet — collector may still be polling)"
          fi

          echo ""
          echo "=========================================="
          echo "2. Prometheus targets — aclp-dbaas / postgres-exporter"
          echo "=========================================="
          PROM_POD=$(kubectl -n monitoring get pod -l app=prometheus -o name | head -1)
          if [ -n "${PROM_POD}" ]; then
            kubectl -n monitoring exec ${PROM_POD} -- wget -qO- http://localhost:9090/api/v1/targets 2>/dev/null \
              | tr ',' '\n' \
              | grep -E '"job":"(aclp-dbaas|postgres-exporter)"|"health":|"lastError":' \
              | head -30 \
              || echo "(no targets matched)"
          fi

          echo ""
          echo "=========================================="
          echo "3. Sample query: avg_cpu_usage{entity_id=470692}"
          echo "=========================================="
          if [ -n "${PROM_POD}" ]; then
            kubectl -n monitoring exec ${PROM_POD} -- \
              wget -qO- "http://localhost:9090/api/v1/query?query=avg_cpu_usage%7Bentity_id%3D%22470692%22%7D" 2>/dev/null \
              || echo "(query failed)"
          fi

      - name: Configure OTel for microservices
        continue-on-error: true
        run: |
          OTEL_ENDPOINT="http://otel-collector.monitoring.svc.cluster.local:4317"
          OTEL_HOST_PORT="otel-collector.monitoring.svc.cluster.local:4317"
          for svc in adservice cartservice checkoutservice emailservice paymentservice \
                     recommendationservice shippingservice productcatalogservice frontend; do
            kubectl set env deployment/${svc} \
              OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT} \
              OTEL_EXPORTER_OTLP_PROTOCOL=grpc \
              OTEL_SERVICE_NAME=${svc} 2>/dev/null || true
          done
          # Services that still gate tracing on the legacy ENABLE_TRACING=1
          # + COLLECTOR_SERVICE_ADDR pair (frontend & checkoutservice are
          # our custom Go forks; recommendation & email are upstream Python).
          # Without these env vars they ignore OTEL_EXPORTER_OTLP_ENDPOINT
          # and emit no spans — that's why Tempo was missing their traces.
          for svc in frontend checkoutservice productcatalogservice recommendationservice emailservice; do
            kubectl set env deployment/${svc} \
              ENABLE_TRACING=1 \
              COLLECTOR_SERVICE_ADDR=${OTEL_HOST_PORT} 2>/dev/null || true
          done

      - name: Seed admin-only products (AKMT028, AKMT029)
        run: |
          FRONTEND="http://$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          ADMIN_USER=$(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="ADMIN_USER")].value}')
          ADMIN_PASS=$(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="ADMIN_PASSWORD")].value}')
          AUTH="-u ${ADMIN_USER}:${ADMIN_PASS}"

          seed_product() {
            local ID=$1; local NAME_EN=$2; local NAME_JA=$3
            local PRICE=$4; local PICTURE=$5
            local DESC_EN=$6; local DESC_JA=$7

            # Always register (add action overwrites if ID already exists)
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" $AUTH \
              -F "action=add" \
              -F "new_id=${ID}" \
              -F "new_name_en=${NAME_EN}" \
              -F "new_name_ja=${NAME_JA}" \
              -F "new_price=${PRICE}" \
              -F "new_categories=apparel,t-shirts" \
              -F "new_picture=${PICTURE}" \
              -F "new_desc_en=${DESC_EN}" \
              -F "new_desc_ja=${DESC_JA}" \
              "${FRONTEND}/admin/inventory")
            echo "${ID}: ${HTTP}"
          }

          seed_product \
            "AKMT028" \
            "PEACE FOR ALL Tee / Akamai - White" \
            "PEACE FOR ALL Tシャツ/アカマイ　白" \
            "29.99" \
            "/static/img/products/custom/AKMT028.jpg" \
            "Over 25 years ago, Akamai laid the foundation for today's connected internet. This T-shirt is a tribute to the dawn of the internet era. The beige color references the iconic 'beige box' computers of that time. The heart on the chest symbolizes how the internet has connected people toward a better world. The code on the back is real — a nod to Linux and the open-source spirit powering the web. Through these shared languages, Akamai connects the world's leading brands with users everywhere, building a safer, more connected future." \
            "25年以上前、Akamaiは今日のインターネットが自在に使える時代の礎を築きました。このTシャツのデザインは、そんなインターネット黎明期へのオマージュです。カラーは、当時「ベージュの箱」と呼ばれたコンピューターのプラスチック製の筐体をイメージしました。胸もとのハートは、インターネットが人々をつなぎ、より良い世界へ導いてきたことを表現しています。Tシャツの背面にプリントされているのは本物のコードです。それは、インターネットを支えるオープンソースのしくみを象徴する基本ソフト Linux にも通じます。世界中で愛されるこれらの共通言語の力を借りて、Akamaiが、世界を導くブランドとその先のユーザーとを結びつけ、より安全で、よりつながる未来を共に築いていきたい ―― そんな想いを、この一枚に込めました。"

          seed_product \
            "AKMT029" \
            "PEACE FOR ALL Tee / Akamai - Black" \
            "PEACE FOR ALL Tシャツ/アカマイ　黒" \
            "29.99" \
            "/static/img/products/custom/AKMT029.webp" \
            "Every day, billions of people connect online — working, playing, learning, shopping, and sharing ideas. The 'texture' code featured in this design represents the common language behind every digital experience. For 25 years, Akamai has built a comfortable, secure internet to enrich lives around the world. We remain committed to making the world safer and more deeply connected." \
            "毎日、何十億もの人々が、オンラインで仕事、遊び、学び、ショッピング、アイデアの共有をしながら、つながっています。このデザインに使われている「texture」というコードは、デジタル体験の裏側にある共通言語を表現しています。Akamaiは 25 年にわたり、世界中の人々の人生をより豊かなものにするために、快適で安心なインターネット環境を築いてきました。これからも、世界をより安全に、より深く結びつける一役を担いたいと願っています。"

  # -------------------------------------------------------
  # Job 3: Build and deploy Spin apps to Akamai Functions
  # -------------------------------------------------------
  deploy-spin:
    name: Deploy Spin Apps to Akamai Functions
    runs-on: ubuntu-latest
    needs: build-frontend
    # Same gating as the LKE deploy: only on [deploy] in commit or manual trigger.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[deploy]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Spin CLI and aka plugin
        run: |
          curl -fsSL https://developer.fermyon.com/downloads/install.sh | bash
          sudo mv spin /usr/local/bin/spin
          spin --version
          spin plugins update
          spin plugins install aka -y

      - name: Authenticate with Akamai Functions
        run: spin aka login --token ${{ secrets.SPIN_AKA_ACCESS_TOKEN }}

      - name: Deploy recommendation-service
        continue-on-error: true
        working-directory: src/spin-functions/recommendation-service
        env:
          OTEL_ENDPOINT: ${{ secrets.OTEL_PUBLIC_ENDPOINT }}
          OTEL_BEARER_TOKEN: ${{ secrets.OTEL_BEARER_TOKEN }}
        run: |
          # Inject OTel config (see docs/spin-otel/SPEC.md §4.4)
          sed -i "s|__OTEL_ENDPOINT__|${OTEL_ENDPOINT}|g" src/otel.ts
          sed -i "s|__OTEL_BEARER_TOKEN__|${OTEL_BEARER_TOKEN}|g" src/otel.ts
          sed -i "s|__OTEL_SERVICE_VERSION__|${GITHUB_SHA::7}|g" src/otel.ts
          npm install
          npm run build
          spin aka app link --app-name recommendation-service
          spin aka app deploy --no-confirm

      - name: Deploy product-intro-service
        continue-on-error: true
        working-directory: src/spin-functions/product-intro-service
        env:
          OTEL_ENDPOINT: ${{ secrets.OTEL_PUBLIC_ENDPOINT }}
          OTEL_BEARER_TOKEN: ${{ secrets.OTEL_BEARER_TOKEN }}
        run: |
          sed -i "s|__OTEL_ENDPOINT__|${OTEL_ENDPOINT}|g" src/otel.ts
          sed -i "s|__OTEL_BEARER_TOKEN__|${OTEL_BEARER_TOKEN}|g" src/otel.ts
          sed -i "s|__OTEL_SERVICE_VERSION__|${GITHUB_SHA::7}|g" src/otel.ts
          npm install
          npm run build
          spin aka app link --app-name product-intro-service
          spin aka app deploy --no-confirm

      - name: Deploy shopping-assistant-service
        continue-on-error: true
        working-directory: src/spin-functions/shopping-assistant-service
        env:
          ZUPLO_API_KEY: ${{ secrets.ZUPLO_API_KEY }}
          OTEL_ENDPOINT: ${{ secrets.OTEL_PUBLIC_ENDPOINT }}
          OTEL_BEARER_TOKEN: ${{ secrets.OTEL_BEARER_TOKEN }}
        run: |
          # Inject the Zuplo API key + OTel config into placeholders before
          # building. Placeholders live in src/index.ts (__ZUPLO_API_KEY__)
          # and src/otel.ts (__OTEL_*__); never committed. sed runs only in
          # the CI workspace. See docs/spin-otel/SPEC.md §4.4.
          if [ -z "${ZUPLO_API_KEY}" ]; then
            echo "ERROR: ZUPLO_API_KEY GitHub Secret not set"
            exit 1
          fi
          sed -i "s|__ZUPLO_API_KEY__|${ZUPLO_API_KEY}|g" src/index.ts
          sed -i "s|__OTEL_ENDPOINT__|${OTEL_ENDPOINT}|g" src/otel.ts
          sed -i "s|__OTEL_BEARER_TOKEN__|${OTEL_BEARER_TOKEN}|g" src/otel.ts
          sed -i "s|__OTEL_SERVICE_VERSION__|${GITHUB_SHA::7}|g" src/otel.ts
          npm install
          npm run build
          spin aka app link --app-name shopping-assistant-service
          spin aka app deploy --no-confirm
