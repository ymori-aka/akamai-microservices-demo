name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ymori-aka/frontend
  CURRENCY_IMAGE: ghcr.io/ymori-aka/currencyservice
  PRODUCTCATALOG_IMAGE: ghcr.io/ymori-aka/productcatalogservice
  CHECKOUT_IMAGE: ghcr.io/ymori-aka/checkoutservice

jobs:
  # -------------------------------------------------------
  # Job 1a: Build and push frontend Docker image
  # -------------------------------------------------------
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 1b: Build and push currencyservice Docker image
  # -------------------------------------------------------
  build-currencyservice:
    name: Build Currency Service Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push currencyservice image
        uses: docker/build-push-action@v6
        with:
          context: ./src/currencyservice
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CURRENCY_IMAGE }}:sha-${{ github.sha }}
            ${{ env.CURRENCY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 1c: Build and push productcatalogservice Docker image
  # -------------------------------------------------------
  build-productcatalogservice:
    name: Build Product Catalog Service Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push productcatalogservice image
        uses: docker/build-push-action@v6
        with:
          context: ./src/productcatalogservice
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PRODUCTCATALOG_IMAGE }}:sha-${{ github.sha }}
            ${{ env.PRODUCTCATALOG_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 1d: Build and push checkoutservice Docker image
  # -------------------------------------------------------
  build-checkoutservice:
    name: Build Checkout Service Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push checkoutservice image
        uses: docker/build-push-action@v6
        with:
          context: ./src/checkoutservice
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CHECKOUT_IMAGE }}:sha-${{ github.sha }}
            ${{ env.CHECKOUT_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 2: Deploy to LKE
  # -------------------------------------------------------
  deploy:
    name: Deploy to LKE
    runs-on: self-hosted
    needs: [build-frontend, build-currencyservice, build-productcatalogservice, build-checkoutservice]
    permissions:
      contents: read
      packages: read
    env:
      ORDER_DB_DSN: ${{ secrets.ORDER_DB_DSN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Istio service mesh (idempotent)
        run: |
          ISTIO_VERSION="1.22.3"
          ISTIOCTL="${HOME}/.local/bin/istioctl"
          mkdir -p "${HOME}/.local/bin"

          # Download istioctl only when the cached binary is missing or stale.
          if ! "${ISTIOCTL}" version --remote=false 2>/dev/null | grep -q "${ISTIO_VERSION}"; then
            echo "Downloading istioctl ${ISTIO_VERSION}..."
            curl -L https://istio.io/downloadIstio \
              | ISTIO_VERSION=${ISTIO_VERSION} TARGET_ARCH=x86_64 sh -
            mv "istio-${ISTIO_VERSION}/bin/istioctl" "${ISTIOCTL}"
            rm -rf "istio-${ISTIO_VERSION}"
          fi

          # Install / upgrade Istio — minimal profile = istiod only.
          # We don't use the Istio ingress gateway; traffic enters via the
          # existing Kubernetes LoadBalancer on the frontend service.
          "${ISTIOCTL}" install --set profile=minimal -y

          # Enable automatic Envoy sidecar injection in the app namespace.
          kubectl label namespace default istio-injection=enabled --overwrite

          # Restart workloads that were already running without a sidecar so
          # they pick up the injected proxy on this deploy.
          # (Services updated later in the pipeline restart themselves anyway,
          # so we only need to cover the ones that CI doesn't otherwise touch.)
          kubectl rollout restart statefulset/mongodb || true
          kubectl rollout restart deployment/redis-cart || true

      - name: Update microservices to v0.10.5
        continue-on-error: true
        run: |
          REGISTRY="us-central1-docker.pkg.dev/google-samples/microservices-demo"
          VERSION="v0.10.5"
          kubectl set image deployment/adservice             server=${REGISTRY}/adservice:${VERSION}
          kubectl set image deployment/cartservice           server=${REGISTRY}/cartservice:${VERSION}
          # checkoutservice: use our custom build (Postgres-backed orders)
          # currencyservice: use our custom build (live exchange rates)
          kubectl set image deployment/currencyservice server=${{ env.CURRENCY_IMAGE }}:sha-${{ github.sha }}
          kubectl set image deployment/emailservice          server=${REGISTRY}/emailservice:${VERSION}
          kubectl set image deployment/paymentservice        server=${REGISTRY}/paymentservice:${VERSION}
          kubectl set image deployment/recommendationservice server=${REGISTRY}/recommendationservice:${VERSION}
          kubectl set image deployment/shippingservice       server=${REGISTRY}/shippingservice:${VERSION}
          # Apply our loadgenerator overlay first (mounts a ConfigMap-
          # backed locustfile with AKMT* product IDs), then pin the
          # container image. The loadgenerator container is named
          # `main`, not `server` like the other deployments.
          # subPath-mounted ConfigMaps are not auto-refreshed in-place
          # by the kubelet, so a content change in the ConfigMap will
          # not reach the running pod until it's recreated — force a
          # restart unconditionally so locustfile updates land.
          kubectl apply -f kubernetes-manifests/loadgenerator.yaml
          kubectl set image deployment/loadgenerator main=${REGISTRY}/loadgenerator:${VERSION}
          kubectl rollout restart deployment/loadgenerator
          # productcatalogservice: use our custom build (MongoDB-backed catalog)
          # Image is set in the dedicated step below.

      - name: Update frontend deployment
        run: |
          IMAGE_TAG="ghcr.io/ymori-aka/frontend:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          kubectl apply -f kubernetes-manifests/frontend.yaml
          kubectl set image deployment/frontend server=${IMAGE_TAG}
          kubectl rollout status deployment/frontend --timeout=300s

      - name: Deploy MongoDB (catalog persistence)
        run: |
          kubectl apply -f kubernetes-manifests/mongodb.yaml
          kubectl rollout status statefulset/mongodb --timeout=240s

      - name: Update productcatalogservice deployment (MongoDB-backed)
        id: pcs_rollout
        continue-on-error: true
        run: |
          IMAGE_TAG="${{ env.PRODUCTCATALOG_IMAGE }}:sha-${{ github.sha }}"
          kubectl apply -f kubernetes-manifests/productcatalogservice.yaml
          kubectl set image deployment/productcatalogservice server=${IMAGE_TAG}
          # Clear any stale rollout status from previous failed deploys
          kubectl rollout restart deployment/productcatalogservice
          kubectl rollout status deployment/productcatalogservice --timeout=300s

      - name: Apply orders DB credentials and schema (Linode Managed PG)
        if: env.ORDER_DB_DSN != ''
        run: |
          # K8s Secret with the connection string
          kubectl create secret generic orders-db-credentials \
            --from-literal=DSN="${ORDER_DB_DSN}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # ConfigMap with the schema SQL (re-applied each run; idempotent)
          kubectl create configmap orders-schema \
            --from-file=schema.sql=kubernetes-manifests/orders-schema.sql \
            --dry-run=client -o yaml | kubectl apply -f -

          # Run the migration Job (delete previous to allow re-run)
          kubectl delete job orders-schema-migrate --ignore-not-found
          kubectl apply -f kubernetes-manifests/orders-migrate-job.yaml
          kubectl wait --for=condition=complete --timeout=120s job/orders-schema-migrate || \
            kubectl logs job/orders-schema-migrate

      - name: Update checkoutservice deployment (Postgres-backed orders)
        run: |
          IMAGE_TAG="${{ env.CHECKOUT_IMAGE }}:sha-${{ github.sha }}"
          kubectl apply -f kubernetes-manifests/checkoutservice.yaml
          kubectl set image deployment/checkoutservice server=${IMAGE_TAG}
          kubectl rollout status deployment/checkoutservice --timeout=240s

      - name: Debug productcatalogservice if rollout failed
        if: steps.pcs_rollout.outcome == 'failure'
        run: |
          echo '=== pods ==='
          kubectl get pods -l app=productcatalogservice -o wide
          echo '=== describe (newest pod) ==='
          POD=$(kubectl get pods -l app=productcatalogservice --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}')
          kubectl describe pod ${POD} | tail -60
          echo '=== logs (newest pod, current) ==='
          kubectl logs ${POD} --tail=100 || true
          echo '=== logs (newest pod, previous) ==='
          kubectl logs ${POD} --previous --tail=100 || true
          echo '=== mongodb status ==='
          kubectl get pods -l app=mongodb
          kubectl logs -l app=mongodb --tail=20 || true
          exit 1

      - name: Apply Istio policies (mTLS + canary)
        run: |
          kubectl apply -f kubernetes-manifests/istio/mtls.yaml
          kubectl apply -f kubernetes-manifests/istio/canary.yaml

      - name: Apply HPA
        run: |
          kubectl apply -f kubernetes-manifests/hpa.yaml

      - name: Deploy monitoring stack
        continue-on-error: true
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          kubectl apply -f kubernetes-manifests/monitoring/namespace.yaml
          kubectl apply -f kubernetes-manifests/monitoring/otel-collector.yaml
          kubectl apply -f kubernetes-manifests/monitoring/redis-exporter.yaml
          kubectl apply -f kubernetes-manifests/monitoring/prometheus.yaml
          kubectl apply -f kubernetes-manifests/monitoring/loki.yaml
          kubectl apply -f kubernetes-manifests/monitoring/promtail.yaml
          kubectl apply -f kubernetes-manifests/monitoring/tempo.yaml
          kubectl apply -f kubernetes-manifests/monitoring/grafana.yaml
          kubectl apply -f kubernetes-manifests/monitoring/grafana-dashboards.yaml
          kubectl apply -f kubernetes-manifests/monitoring/kiali.yaml

          # Istio service mesh Grafana dashboards (official ones from
          # istio/istio release-1.22). Created as a separate ConfigMap so
          # the main grafana-dashboards ConfigMap stays under the 256 KiB
          # K8s limit. Grafana picks them up via the `istio` dashboard
          # provider configured in grafana.yaml.
          mkdir -p /tmp/istio-dashboards
          ISTIO_DB_BASE='https://raw.githubusercontent.com/istio/istio/release-1.22/manifests/addons/dashboards'
          for db in istio-mesh-dashboard istio-service-dashboard pilot-dashboard; do
            curl -fsSL "${ISTIO_DB_BASE}/${db}.json" \
              -o "/tmp/istio-dashboards/${db}.json"
          done
          kubectl -n monitoring create configmap grafana-istio-dashboards \
            --from-file=/tmp/istio-dashboards/ \
            --dry-run=client -o yaml | kubectl apply --server-side=true -f -

          # Akamai Cloud Pulse collector + its PAT Secret (optional — only
          # deployed when LINODE_PAT is present).
          if [ -n "${LINODE_PAT}" ]; then
            kubectl -n monitoring create secret generic linode-pat \
              --from-literal=TOKEN="${LINODE_PAT}" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f kubernetes-manifests/monitoring/aclp-collector.yaml
          else
            echo "LINODE_PAT not set — skipping aclp-collector deployment."
          fi

      - name: Configure OTel for microservices
        continue-on-error: true
        run: |
          OTEL_ENDPOINT="http://otel-collector.monitoring.svc.cluster.local:4317"
          OTEL_HOST_PORT="otel-collector.monitoring.svc.cluster.local:4317"
          for svc in adservice cartservice checkoutservice emailservice paymentservice \
                     recommendationservice shippingservice productcatalogservice frontend; do
            kubectl set env deployment/${svc} \
              OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT} \
              OTEL_EXPORTER_OTLP_PROTOCOL=grpc \
              OTEL_SERVICE_NAME=${svc} 2>/dev/null || true
          done
          # Python services (recommendation, email) require these to actually emit OTLP traces
          for svc in recommendationservice emailservice; do
            kubectl set env deployment/${svc} \
              ENABLE_TRACING=1 \
              COLLECTOR_SERVICE_ADDR=${OTEL_HOST_PORT} 2>/dev/null || true
          done

      - name: Seed admin-only products (AKMT028, AKMT029)
        run: |
          FRONTEND="http://$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          ADMIN_USER=$(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="ADMIN_USER")].value}')
          ADMIN_PASS=$(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="ADMIN_PASSWORD")].value}')
          AUTH="-u ${ADMIN_USER}:${ADMIN_PASS}"

          seed_product() {
            local ID=$1; local NAME_EN=$2; local NAME_JA=$3
            local PRICE=$4; local PICTURE=$5
            local DESC_EN=$6; local DESC_JA=$7

            # Always register (add action overwrites if ID already exists)
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" $AUTH \
              -F "action=add" \
              -F "new_id=${ID}" \
              -F "new_name_en=${NAME_EN}" \
              -F "new_name_ja=${NAME_JA}" \
              -F "new_price=${PRICE}" \
              -F "new_categories=apparel,t-shirts" \
              -F "new_picture=${PICTURE}" \
              -F "new_desc_en=${DESC_EN}" \
              -F "new_desc_ja=${DESC_JA}" \
              "${FRONTEND}/admin/inventory")
            echo "${ID}: ${HTTP}"
          }

          seed_product \
            "AKMT028" \
            "PEACE FOR ALL Tee / Akamai - White" \
            "PEACE FOR ALL Tシャツ/アカマイ　白" \
            "29.99" \
            "/static/img/products/custom/AKMT028.jpg" \
            "Over 25 years ago, Akamai laid the foundation for today's connected internet. This T-shirt is a tribute to the dawn of the internet era. The beige color references the iconic 'beige box' computers of that time. The heart on the chest symbolizes how the internet has connected people toward a better world. The code on the back is real — a nod to Linux and the open-source spirit powering the web. Through these shared languages, Akamai connects the world's leading brands with users everywhere, building a safer, more connected future." \
            "25年以上前、Akamaiは今日のインターネットが自在に使える時代の礎を築きました。このTシャツのデザインは、そんなインターネット黎明期へのオマージュです。カラーは、当時「ベージュの箱」と呼ばれたコンピューターのプラスチック製の筐体をイメージしました。胸もとのハートは、インターネットが人々をつなぎ、より良い世界へ導いてきたことを表現しています。Tシャツの背面にプリントされているのは本物のコードです。それは、インターネットを支えるオープンソースのしくみを象徴する基本ソフト Linux にも通じます。世界中で愛されるこれらの共通言語の力を借りて、Akamaiが、世界を導くブランドとその先のユーザーとを結びつけ、より安全で、よりつながる未来を共に築いていきたい ―― そんな想いを、この一枚に込めました。"

          seed_product \
            "AKMT029" \
            "PEACE FOR ALL Tee / Akamai - Black" \
            "PEACE FOR ALL Tシャツ/アカマイ　黒" \
            "29.99" \
            "/static/img/products/custom/AKMT029.webp" \
            "Every day, billions of people connect online — working, playing, learning, shopping, and sharing ideas. The 'texture' code featured in this design represents the common language behind every digital experience. For 25 years, Akamai has built a comfortable, secure internet to enrich lives around the world. We remain committed to making the world safer and more deeply connected." \
            "毎日、何十億もの人々が、オンラインで仕事、遊び、学び、ショッピング、アイデアの共有をしながら、つながっています。このデザインに使われている「texture」というコードは、デジタル体験の裏側にある共通言語を表現しています。Akamaiは 25 年にわたり、世界中の人々の人生をより豊かなものにするために、快適で安心なインターネット環境を築いてきました。これからも、世界をより安全に、より深く結びつける一役を担いたいと願っています。"

  # -------------------------------------------------------
  # Job 3: Build and deploy Spin apps to Akamai Functions
  # -------------------------------------------------------
  deploy-spin:
    name: Deploy Spin Apps to Akamai Functions
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Spin CLI and aka plugin
        run: |
          curl -fsSL https://developer.fermyon.com/downloads/install.sh | bash
          sudo mv spin /usr/local/bin/spin
          spin --version
          spin plugins update
          spin plugins install aka -y

      - name: Authenticate with Akamai Functions
        run: spin aka login --token ${{ secrets.SPIN_AKA_ACCESS_TOKEN }}

      - name: Deploy recommendation-service
        continue-on-error: true
        working-directory: src/spin-functions/recommendation-service
        run: |
          npm install
          npm run build
          spin aka app link --app-name recommendation-service
          spin aka app deploy --no-confirm

      - name: Deploy product-intro-service
        continue-on-error: true
        working-directory: src/spin-functions/product-intro-service
        run: |
          npm install
          npm run build
          spin aka app link --app-name product-intro-service
          spin aka app deploy --no-confirm

      - name: Deploy shopping-assistant-service
        continue-on-error: true
        working-directory: src/spin-functions/shopping-assistant-service
        run: |
          npm install
          npm run build
          spin aka app link --app-name shopping-assistant-service
          spin aka app deploy --no-confirm
