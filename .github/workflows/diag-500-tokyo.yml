name: Diagnose frontend 500 (Tokyo)

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: Describe the stuck currencyservice pod (exact pull error)
        run: |
          set +e
          POD=$(kubectl get pod -l app=currencyservice -o name | head -1)
          echo "pod: $POD"
          kubectl describe "$POD" | sed -n '/Events:/,$p'
          echo "===== imagePullSecrets on default SA ====="
          kubectl get sa default -o jsonpath='{.imagePullSecrets}'
          echo
          echo "===== ghcr-secret present? ====="
          kubectl get secret ghcr-secret -o name 2>&1
          echo "===== currencyservice deployment image ====="
          kubectl get deploy currencyservice -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
