name: Diagnose frontend 500 (Tokyo)

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: Compare ghcr-secret access across private packages (cartservice vs currencyservice)
        run: |
          set +e
          AUTH=$(kubectl get secret ghcr-secret -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["auths"]["ghcr.io"]["auth"])')
          USERPASS=$(echo "$AUTH" | base64 -d)
          for repo in cartservice currencyservice checkoutservice frontend productcatalogservice; do
            TOKRESP=$(curl -sS -u "$USERPASS" "https://ghcr.io/token?service=ghcr.io&scope=repository:ymori-aka/$repo:pull")
            TOKEN=$(echo "$TOKRESP" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("token",""))')
            if [ -z "$TOKEN" ]; then
              echo "$repo: TOKEN EXCHANGE FAILED -> $TOKRESP"
              continue
            fi
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/ymori-aka/$repo/tags/list")
            echo "$repo: tags/list HTTP $CODE"
          done
