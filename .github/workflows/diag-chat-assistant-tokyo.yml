name: Diagnose shopping assistant chat (Tokyo, read-only)

# The Online Boutique's chat widget (POST /bot) is hanging / erroring.
# READ-ONLY: shows the frontend's current SHOPPING_ASSISTANT_* env, then
# probes the configured backend directly from the runner. Changes nothing.
on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: frontend assistant/kong env
        run: |
          echo "===== deploy/frontend: ASSISTANT / KONG env ====="
          kubectl set env deploy/frontend --list 2>/dev/null | grep -iE 'ASSISTANT|KONG' | sed 's/^/  /' || echo "  (none set)"
          echo ""
          echo "===== deploy/frontend image + rollout status ====="
          kubectl get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' | sed 's/^/  image: /'
          kubectl rollout status deployment/frontend --timeout=5s 2>&1 | sed 's/^/  /' || true

      - name: probe the configured backend directly
        run: |
          ADDR=$(kubectl set env deploy/frontend --list 2>/dev/null | grep -i '^SHOPPING_ASSISTANT_SERVICE_ADDR=' | cut -d= -f2-)
          echo "SHOPPING_ASSISTANT_SERVICE_ADDR=$ADDR"
          if [ -z "$ADDR" ]; then
            echo "(env not set — handler falls back to in-cluster shoppingassistantservice:80)"
            exit 0
          fi
          case "$ADDR" in
            http*) BASE="$ADDR" ;;
            *) BASE="http://$ADDR" ;;
          esac
          echo "===== GET \$BASE/api/whereami ====="
          curl -s -m 15 -w '\n[HTTP %{http_code}] [%{time_total}s]\n' "$BASE/api/whereami" | sed 's/^/  /' || true
          echo "===== POST \$BASE/api/chat (benign) ====="
          curl -s -m 25 -m 25 -X POST "$BASE/api/chat" -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"hello"}]}' \
            -w '\n[HTTP %{http_code}] [%{time_total}s]\n' | sed 's/^/  /' || true

      - name: probe /bot via the live external frontend
        run: |
          FE=$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          echo "frontend-external IP: $FE"
          echo "===== POST http://\$FE/bot ====="
          curl -s -m 30 -X POST "http://$FE/bot" -H "Content-Type: application/json" \
            -d '{"message":"hi","history":[]}' \
            -w '\n[HTTP %{http_code}] [%{time_total}s]\n' | sed 's/^/  /' || true

      - name: recent frontend logs (chat/bot/assistant related)
        run: |
          kubectl logs deployment/frontend --tail=200 2>&1 \
            | grep -iE "bot|assistant|shopping|chatbot|zuplo|kong|timeout|deadline|refused|error" \
            | tail -40 | sed 's/^/  /' || true
