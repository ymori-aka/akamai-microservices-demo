name: Check frontend image + rollout (Tokyo, read-only)
on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        required: true
        default: "610031"
jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"
      - name: image + pods + rollout
        run: |
          echo "=== deploy image ==="
          kubectl get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          echo "=== pods ==="
          kubectl get pods -l app=frontend -o wide
          echo "=== rollout history ==="
          kubectl rollout history deployment/frontend
          echo "=== rollout status (5s) ==="
          kubectl rollout status deployment/frontend --timeout=5s 2>&1 || true
