name: Diag Grafana anonymous Tempo access (read-only)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: anon vs admin proxy to tempo/loki
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          U=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-user}' | base64 -d)
          P=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-password}' | base64 -d)
          G="http://grafana.monitoring.svc.cluster.local:3000"
          run() { kubectl -n monitoring run gq-$RANDOM --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null; }

          FE=$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          for i in $(seq 1 10); do curl -s -o /dev/null -m5 "http://$FE/"; done
          sleep 25
          NOW=$(date +%s); AGO=$((NOW-1800)); NOWMS=$((NOW*1000)); AGOMS=$((AGO*1000))
          TID=$(run "curl -s 'http://tempo.monitoring.svc.cluster.local:3200/api/search?q=%7B%7D&start=${AGO}&end=${NOW}&limit=1'" | tr ',' '\n' | grep -m1 traceID | sed -E 's/.*"traceID":"([a-f0-9]+)".*/\1/')
          echo "traceID=$TID (len ${#TID})"

          SEARCH="api/search?q=%7B%7D&start=${AGO}&end=${NOW}&limit=2"
          echo ""
          echo "=== TEMPO /api/search ==="
          echo -n "  anon : "; run "curl -s -o /dev/null -w '%{http_code}' '$G/api/datasources/proxy/uid/tempo-uid/$SEARCH'"
          echo ""; echo -n "  admin: "; run "curl -s -o /dev/null -w '%{http_code}' -u '$U:$P' '$G/api/datasources/proxy/uid/tempo-uid/$SEARCH'"; echo ""
          echo "=== TEMPO /api/traces/{id} ==="
          echo -n "  anon : "; run "curl -s -o /dev/null -w '%{http_code}' '$G/api/datasources/proxy/uid/tempo-uid/api/traces/$TID'"
          echo ""; echo -n "  admin: "; run "curl -s -o /dev/null -w '%{http_code}' -u '$U:$P' '$G/api/datasources/proxy/uid/tempo-uid/api/traces/$TID'"; echo ""
          echo "=== LOKI labels (control: anon known-good elsewhere) ==="
          echo -n "  anon : "; run "curl -s -o /dev/null -w '%{http_code}' '$G/api/datasources/proxy/uid/P8E80F9AEF21F6940/loki/api/v1/labels'"
          echo ""; echo -n "  admin: "; run "curl -s -o /dev/null -w '%{http_code}' -u '$U:$P' '$G/api/datasources/proxy/uid/P8E80F9AEF21F6940/loki/api/v1/labels'"; echo ""
          echo "=== PROMETHEUS query (control) ==="
          echo -n "  anon : "; run "curl -s -o /dev/null -w '%{http_code}' '$G/api/datasources/proxy/uid/PBFA97CFB590B2093/api/v1/query?query=up'"; echo ""

          echo ""
          echo "=== anon org / role (whoami) ==="
          run "curl -s '$G/api/user' "; echo ""
          run "curl -s '$G/api/org'"; echo ""
          echo "=== is Tempo reachable from grafana pod at all (direct, no proxy)? ==="
          run "curl -s -o /dev/null -w '%{http_code}' 'http://tempo.monitoring.svc.cluster.local:3200/ready'"; echo ""
