name: Diag Grafana dashboards loaded (read-only)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: provisioning errors + dashboard + internal link present
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          U=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-user}' | base64 -d)
          P=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-password}' | base64 -d)
          G="http://grafana.monitoring.svc.cluster.local:3000"
          run() { kubectl -n monitoring run gl-$RANDOM --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null; }

          echo "===== grafana provisioning / dashboard load errors ====="
          kubectl -n monitoring logs deploy/grafana --tail=300 2>/dev/null | grep -iE 'provision|dashboard|invalid|failed|error|parse' | tail -25

          echo ""
          echo "===== dashboards present (search) ====="
          run "curl -s -u '$U:$P' '$G/api/search?type=dash-db'" | tr '}' '\n' | grep -oE '"title":"[^"]*"|"uid":"[^"]*"' | paste - - | head -20

          echo ""
          echo "===== find dashboard containing 'Frontend Traces' + show its trace link ====="
          for UID in $(run "curl -s -u '$U:$P' '$G/api/search?type=dash-db'" | tr ',' '\n' | grep -oE '"uid":"[^"]+"' | sed -E 's/.*:"//; s/"//'); do
            D=$(run "curl -s -u '$U:$P' '$G/api/dashboards/uid/$UID'")
            if echo "$D" | grep -q 'Frontend Traces'; then
              echo "  dashboard uid=$UID has Frontend Traces"
              echo "$D" | grep -oE '"internal":\{[^}]*\{[^}]*\}[^}]*\}' | head -1
              echo "$D" | grep -oE '"queryType":"traceId"' | head -1
              break
            fi
          done
