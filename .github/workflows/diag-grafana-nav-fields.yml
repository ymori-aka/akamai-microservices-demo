name: Diag Grafana anon nav + traces table fields (read-only)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: anon explore nav + traces table field names
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          U=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-user}' | base64 -d)
          P=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-password}' | base64 -d)
          G="http://grafana.monitoring.svc.cluster.local:3000"
          run() { kubectl -n monitoring run gn-$RANDOM --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null; }

          echo "===== ANON bootdata: orgRole / viewersCanEdit / Explore in nav? ====="
          H=$(run "curl -s '$G/'")
          echo "  orgRole:";        echo "$H" | grep -oE '\"orgRole\":\"[A-Za-z]+\"' | head -2
          echo "  viewersCanEdit:"; echo "$H" | grep -oE '\"viewersCanEdit\":(true|false)' | head -1
          echo "  Explore in nav:"; echo "$H" | grep -oiE '\"(text|id)\":\"explore\"' | head -2
          echo "  (if Explore absent in nav => viewers still cannot Explore)"

          echo ""
          echo "===== traces table FIELD names (narrow recent window) ====="
          NOWMS=$(( $(date +%s) * 1000 )); AGOMS=$(( ($(date +%s)-600) * 1000 ))
          BODY='{"queries":[{"refId":"A","datasource":{"type":"tempo","uid":"tempo-uid"},"queryType":"traceql","query":"{ resource.service.name = \"frontend\" }","tableType":"traces","limit":5,"spss":3}],"from":"'"$AGOMS"'","to":"'"$NOWMS"'"}'
          RESP=$(run "curl -s -u '$U:$P' -H 'Content-Type: application/json' -X POST '$G/api/ds/query' -d '$BODY'")
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); f=d['results']['A']['frames'][0]; print('FIELDS:',[x['name'] for x in f['schema']['fields']])" 2>/dev/null || { echo "  parse failed; raw head:"; echo "$RESP" | head -c 400; }
