name: Diag Grafana cluster + ObjectStorage (read-only)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: Which cluster does the DEFAULT kubectl point at? (monitoring/Grafana home)
        run: |
          set +e
          echo "===== current-context ====="
          kubectl config current-context
          echo "===== nodes (names embed lke<clusterId>, region in labels) ====="
          kubectl get nodes -o wide 2>/dev/null
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"  region="}{.metadata.labels.topology\.kubernetes\.io/region}{"\n"}{end}' 2>/dev/null
          echo ""
          echo "===== Grafana svc in this (default) cluster ====="
          kubectl -n monitoring get svc -l app=grafana -o wide 2>/dev/null
          kubectl -n monitoring get svc grafana -o jsonpath='EXTERNAL={.status.loadBalancer.ingress[0].ip}{.status.loadBalancer.ingress[0].hostname} PORTS={.spec.ports[*].port}{"\n"}' 2>/dev/null
          echo "===== all monitoring LoadBalancer svc external IPs (which IPs are THIS cluster) ====="
          kubectl -n monitoring get svc -o wide 2>/dev/null | grep -iE 'LoadBalancer|NAME'

      - name: Does the TOKYO cluster (${{ inputs.tokyo_cluster_id }}) have its own Grafana?
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC" 2>/dev/null
          echo "===== Tokyo cluster nodes ====="
          KUBECONFIG="$KC" kubectl get nodes -o wide 2>/dev/null | head
          echo "===== Tokyo: monitoring ns + Grafana? ====="
          KUBECONFIG="$KC" kubectl get ns 2>/dev/null | grep -iE 'monitoring|NAME'
          KUBECONFIG="$KC" kubectl -n monitoring get svc 2>/dev/null | grep -iE 'grafana|prometheus|LoadBalancer|NAME'

      - name: Linode account — list LKE clusters (id/label/region) + Object Storage buckets
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          echo "===== LKE clusters ====="
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters" \
            | python3 -c 'import sys,json;[print("  id=%-8s label=%-28s region=%s k8s=%s"%(c["id"],c["label"],c["region"],c.get("k8s_version"))) for c in json.load(sys.stdin)["data"]]' 2>/dev/null
          echo "===== Object Storage buckets (region + label) ====="
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/object-storage/buckets" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin).get("data",[]);print("  (none)") if not d else [print("  region=%-10s label=%-30s size=%s objs=%s"%(b.get("region") or b.get("cluster"),b["label"],b.get("size"),b.get("objects"))) for b in d]' 2>/dev/null

      - name: ObjectStorage Cloud Pulse — is the metrics API authorized now?
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          echo "Probing Cloud Pulse (ACLP) service availability for this token/account."
          for svc in dbaas nodebalancer objectstorage; do
            echo "----- service_type=$svc : /monitor/services/$svc/metric-definitions -----"
            curl -s -o /tmp/r.json -w "  HTTP %{http_code}\n" \
              -H "Authorization: Bearer $LINODE_PAT" \
              "https://api.linode.com/v4/monitor/services/$svc/metric-definitions"
            head -c 240 /tmp/r.json 2>/dev/null; echo ""
          done

      - name: Current aclp-collector config — objectstorage block state + obj metrics
        run: |
          set +e
          echo "===== live ConfigMap: is objectstorage enabled or commented? ====="
          kubectl -n monitoring get configmap aclp-collector-config -o jsonpath='{.data.config\.yaml}' 2>/dev/null \
            | grep -nE 'objectstorage|obj_bucket|entity_regions|DISABLED' | head
          echo "===== running collector image ====="
          kubectl -n monitoring get deploy aclp-collector -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}' 2>/dev/null
          echo "===== obj_* metrics present in Prometheus? ====="
          PROM=$(kubectl -n monitoring get pod -l app=prometheus -o name | head -1)
          for q in 'count(obj_bucket_size)' 'count(obj_bucket_num_objects)'; do
            V=$(kubectl -n monitoring exec "$PROM" -- wget -qO- "http://localhost:9090/api/v1/query?query=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")" 2>/dev/null | python3 -c 'import sys,json;r=json.load(sys.stdin)["data"]["result"];print(r[0]["value"][1] if r else "NONE")' 2>/dev/null)
            echo "  $q = $V"
          done
          echo "===== recent aclp logs mentioning objectstorage ====="
          kubectl -n monitoring logs deployment/aclp-collector --tail=120 2>/dev/null | grep -iE 'objectstorage|obj_|unknown field|cannot|invalid' | tail -20
