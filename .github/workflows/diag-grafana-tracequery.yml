name: Diag Grafana ds/query trace lookup (read-only)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"
      trace_id:
        description: "short trace id from panel"
        required: true
        default: "ec81808a29526b4abe02fc738d10994"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: POST /api/ds/query with queryType traceql vs traceId
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          U=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-user}' | base64 -d)
          P=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-password}' | base64 -d)
          G="http://grafana.monitoring.svc.cluster.local:3000"
          TID="${{ inputs.trace_id }}"
          PAD=$(printf '%032s' "$TID" | tr ' ' '0')
          run() { kubectl -n monitoring run gd-$RANDOM --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null; }
          NOWMS=$(( $(date +%s) * 1000 )); AGOMS=$(( ($(date +%s)-3600) * 1000 ))

          test_q() {
            local QT="$1"; local ID="$2"
            local BODY="{\"queries\":[{\"refId\":\"A\",\"datasource\":{\"type\":\"tempo\",\"uid\":\"tempo-uid\"},\"queryType\":\"${QT}\",\"query\":\"${ID}\"}],\"from\":\"${AGOMS}\",\"to\":\"${NOWMS}\"}"
            echo "----- queryType=$QT id=$ID (len ${#ID}) -----"
            run "curl -s -w '\nHTTP %{http_code}\n' -u '$U:$P' -H 'Content-Type: application/json' -X POST '$G/api/ds/query' -d '$BODY'" \
              | sed -E 's/(.{400}).*/\1/'
            echo ""
          }
          test_q traceql "$TID"
          test_q traceql "$PAD"
          test_q traceId "$TID"
          test_q traceId "$PAD"
