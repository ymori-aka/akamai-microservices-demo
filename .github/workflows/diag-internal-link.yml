name: Diag internal trace link present (read-only)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: check served dashboards for internal trace link
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          U=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-user}' | base64 -d)
          P=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-password}' | base64 -d)
          G="http://grafana.monitoring.svc.cluster.local:3000"
          run() { kubectl -n monitoring run li-$RANDOM --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null; }
          for UID in akamai-microservices akamai-home akamai-infrastructure service-graph; do
            D=$(run "curl -s -u '$U:$P' '$G/api/dashboards/uid/$UID'")
            echo "=== $UID : Frontend Traces? $(echo "$D" | grep -c 'Frontend Traces') ; internal traceId links: $(echo "$D" | grep -oE '\"queryType\":\"traceId\"' | wc -l) ; old left= links: $(echo "$D" | grep -oE '/explore\?orgId=1&left=' | wc -l)"
          done
