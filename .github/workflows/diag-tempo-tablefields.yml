name: Diag Tempo traces table field names (read-only)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: ds/query the frontend traces table, dump field names
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"
          U=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-user}' | base64 -d)
          P=$(kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-password}' | base64 -d)
          G="http://grafana.monitoring.svc.cluster.local:3000"
          run() { kubectl -n monitoring run gf-$RANDOM --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null; }
          NOWMS=$(( $(date +%s) * 1000 )); AGOMS=$(( ($(date +%s)-3600) * 1000 ))
          BODY='{"queries":[{"refId":"A","datasource":{"type":"tempo","uid":"tempo-uid"},"queryType":"traceql","query":"{ resource.service.name = \"frontend\" }","tableType":"traces","limit":5,"spss":3}],"from":"'"$AGOMS"'","to":"'"$NOWMS"'"}'
          echo "===== field names + a sample row of the traces table ====="
          run "curl -s -u '$U:$P' -H 'Content-Type: application/json' -X POST '$G/api/ds/query' -d '$BODY'" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); f=d['results']['A']['frames'][0]; print('FIELDS:',[x['name'] for x in f['schema']['fields']]); print('ROW0:', [ (v[0] if v else None) for v in f['data']['values'] ])" 2>/dev/null || echo "(parse failed; raw head:)"
          run "curl -s -u '$U:$P' -H 'Content-Type: application/json' -X POST '$G/api/ds/query' -d '$BODY'" | head -c 500
