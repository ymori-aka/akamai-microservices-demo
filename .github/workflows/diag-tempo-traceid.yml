name: Diag Tempo trace-by-ID (read-only)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: search then GET trace by id
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          FE=$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          for i in $(seq 1 15); do curl -s -o /dev/null -m5 "http://$FE/"; curl -s -o /dev/null -m5 "http://$FE/product/OLJCESPC7Z"; done
          echo "waiting 40s..."; sleep 40

          run() { kubectl -n monitoring run tq-$RANDOM --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null; }
          B="http://tempo.monitoring.svc.cluster.local:3200"
          NOW=$(date +%s); AGO=$((NOW-3600))

          echo "===== TraceQL search ====="
          SR=$(run "curl -s '$B/api/search?q=%7B%7D&start=${AGO}&end=${NOW}&limit=5'")
          echo "$SR" | head -c 500; echo ""
          TID=$(echo "$SR" | tr ',' '\n' | grep -m1 traceID | sed -E 's/.*"traceID":"([a-f0-9]+)".*/\1/')
          echo "picked traceID=$TID"

          echo ""
          echo "===== GET /api/traces/$TID ====="
          if [ -n "$TID" ]; then
            BODY=$(run "curl -s -w 'HTTPCODE=%{http_code};BYTES=%{size_download}' '$B/api/traces/$TID'")
            echo "$BODY" | grep -oE 'HTTPCODE=[0-9]+;BYTES=[0-9]+'
            echo "  span objects (count of spanId):  $(echo "$BODY" | grep -oE '"spanId"' | wc -l)"
            echo "  span names    (count of name):   $(echo "$BODY" | grep -oE '"name":' | wc -l)"
            echo "  service.name values present:"
            echo "$BODY" | grep -oE '"stringValue":"[a-z-]+service"|"stringValue":"frontend"' | sort -u | sed 's/^/      /' | head
            echo "  --- first 600 bytes of trace body ---"
            echo "$BODY" | sed 's/HTTPCODE=.*//' | head -c 600; echo ""
            echo "  --- also try v1 trace endpoint (?start&end) ---"
            run "curl -s -w '\nHTTPv2=%{http_code}\n' '$B/api/v2/traces/$TID?start=${AGO}&end=${NOW}'" | tail -2
          fi

          echo ""
          echo "===== Tempo config: query_frontend / trace_by_id / max ====="
          kubectl -n monitoring get configmap tempo-config -o jsonpath='{.data.tempo\.yaml}' 2>/dev/null \
            | grep -iE 'query_frontend|trace_by_id|querier|max_duration|duration_slo|hedge|concurrent|complete_block_timeout|blocklist_poll|backend|wal|local' | head -30

          echo ""
          echo "===== Tempo recent errors ====="
          kubectl -n monitoring logs deploy/tempo --tail=150 2>/dev/null | grep -iE 'error|no such|not found|failed|trace|context deadline|panic' | tail -20

          echo ""
          echo "===== Grafana Tempo datasource block ====="
          kubectl -n monitoring get configmap grafana-datasources -o jsonpath='{.data.datasources\.yaml}' 2>/dev/null | sed -n '/Tempo/,/^      - name:/p' | head -45
