name: Diag Tokyo traces/spans (read-only)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  diag:
    runs-on: self-hosted
    steps:
      - name: Tracing instrumentation on every app + collector + Tempo
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          echo "===== all app deployments (default ns) ====="
          kubectl get deploy -o name 2>/dev/null

          echo ""
          echo "===== tracing env per app (ENABLE_TRACING / COLLECTOR_SERVICE_ADDR / OTEL_*) ====="
          for d in $(kubectl get deploy -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            ENV=$(kubectl set env deployment/$d --list 2>/dev/null | grep -iE 'ENABLE_TRACING|COLLECTOR_SERVICE_ADDR|OTEL_EXPORTER|OTEL_SERVICE|OTEL_TRACES|DISABLE_TRACING|JAEGER')
            if [ -n "$ENV" ]; then
              echo "  [$d]"
              echo "$ENV" | sed 's/^/      /'
            else
              echo "  [$d]  (no tracing env)"
            fi
          done

          echo ""
          echo "===== generate traffic to frontend to produce traces ====="
          FE=$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          [ -z "$FE" ] && FE=$(kubectl get svc frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          echo "frontend external IP=$FE"
          if [ -n "$FE" ]; then
            for i in $(seq 1 15); do curl -s -o /dev/null -m 5 "http://$FE/"; curl -s -o /dev/null -m 5 "http://$FE/product/OLJCESPC7Z"; done
            echo "sent 30 requests"
          fi
          echo "waiting 25s for span pipeline..."
          sleep 25

          echo ""
          echo "===== otel-collector :8888 span counters (accepted/refused/sent/failed) ====="
          COL=$(kubectl -n monitoring get pod -l app=otel-collector -o name 2>/dev/null | head -1)
          kubectl -n monitoring exec "$COL" -- wget -qO- http://localhost:8888/metrics 2>/dev/null \
            | grep -E 'otelcol_receiver_accepted_spans|otelcol_receiver_refused_spans|otelcol_exporter_sent_spans|otelcol_exporter_send_failed_spans' | grep -v '#'
          echo ""
          echo "===== otel-collector traces pipeline (receivers/exporters) ====="
          kubectl -n monitoring get configmap otel-collector-config -o jsonpath='{.data.config\.yaml}' 2>/dev/null \
            | python3 -c 'import sys; t=sys.stdin.read(); i=t.find("traces:"); print(t[i:i+400] if i>=0 else "(no traces pipeline section found inline)")'

          echo ""
          echo "===== Tempo: service.name values (which services have traces) ====="
          kubectl -n monitoring exec "$COL" -- wget -qO- "http://tempo.monitoring.svc.cluster.local:3200/api/search/tag/service.name/values" 2>/dev/null | head -c 600; echo ""

          echo ""
          echo "===== Prometheus: span metrics presence ====="
          PROM=$(kubectl -n monitoring get pod -l app=prometheus -o name | head -1)
          for q in 'count(otelcol_receiver_accepted_spans_total)' 'count(traces_spanmetrics_calls_total)' 'count(traces_service_graph_request_total)'; do
            V=$(kubectl -n monitoring exec "$PROM" -- wget -qO- "http://localhost:9090/api/v1/query?query=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")" 2>/dev/null | python3 -c 'import sys,json;r=json.load(sys.stdin)["data"]["result"];print(r[0]["value"][1] if r else "NONE")' 2>/dev/null)
            echo "  $q = $V"
          done

      - name: App startup/trace-export logs (are apps exporting? errors?)
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          export KUBECONFIG="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          for d in frontend productcatalogservice checkoutservice cartservice currencyservice recommendationservice adservice shippingservice paymentservice emailservice; do
            kubectl get deploy/$d >/dev/null 2>&1 || continue
            echo "===== $d (trace/otel/export/collector/55678/4317) ====="
            kubectl logs deployment/$d --tail=200 2>&1 \
              | grep -iE 'trac|otel|export|collector|opencensus|55678|4317|span|exporter' | tail -6 | sed 's/^/   /'
          done
