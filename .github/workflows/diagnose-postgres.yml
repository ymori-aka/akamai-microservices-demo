name: Diagnose postgres-exporter

# Run on demand to get a full picture of postgres-exporter health
# without going through the slow Build+Deploy pipeline.
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Dump postgres-exporter state
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Pod status, events, describe
        continue-on-error: true
        run: |
          set +e
          echo "===== Pod list ====="
          kubectl -n monitoring get pod -l app=postgres-exporter -o wide --show-labels
          echo ""
          echo "===== Events (last 50, sorted by time) ====="
          kubectl -n monitoring get events --sort-by=.lastTimestamp 2>/dev/null \
            | grep -i postgres | tail -50
          echo ""
          echo "===== Describe pod ====="
          POD=$(kubectl -n monitoring get pod -l app=postgres-exporter -o name | head -1)
          if [ -n "$POD" ]; then
            kubectl -n monitoring describe "$POD"
          else
            echo "(no postgres-exporter pod found)"
          fi

      - name: Probe diagnostics (manual liveness check)
        continue-on-error: true
        run: |
          set +e
          POD=$(kubectl -n monitoring get pod -l app=postgres-exporter -o name | head -1)
          if [ -z "$POD" ]; then echo "no pod"; exit 0; fi

          echo "===== HTTP /metrics raw, first 100 lines ====="
          kubectl -n monitoring exec "$POD" -- \
            sh -c "wget -qO- http://localhost:9187/metrics 2>&1" | head -100

          echo ""
          echo "===== grep for orders_ metrics ====="
          kubectl -n monitoring exec "$POD" -- \
            sh -c "wget -qO- http://localhost:9187/metrics 2>&1 | grep -E '^orders_' || echo 'NO orders_* METRICS FOUND'"

          echo ""
          echo "===== Probe pattern test (the one in the manifest) ====="
          kubectl -n monitoring exec "$POD" -- \
            sh -c "wget -qO- http://localhost:9187/metrics 2>&1 | grep -qE '^orders_daily_order_count[ {]' && echo 'PROBE MATCH OK' || echo 'PROBE WOULD FAIL'"

      - name: Container logs (current + previous)
        continue-on-error: true
        run: |
          set +e
          POD=$(kubectl -n monitoring get pod -l app=postgres-exporter -o name | head -1)
          if [ -z "$POD" ]; then exit 0; fi

          echo "===== logs (current container, last 100 lines) ====="
          kubectl -n monitoring logs "$POD" --tail=100

          echo ""
          echo "===== logs (previous container, last 100 lines) ====="
          kubectl -n monitoring logs "$POD" --previous --tail=100 2>&1 \
            || echo "(no previous container — pod has not restarted)"

      - name: Alert rules loaded in Prometheus
        continue-on-error: true
        run: |
          set +e
          PROM=$(kubectl -n monitoring get pod -l app=prometheus -o name | head -1)
          if [ -z "$PROM" ]; then exit 0; fi
          echo "===== Alert rules currently loaded ====="
          kubectl -n monitoring exec "$PROM" -- \
            wget -qO- http://localhost:9090/api/v1/rules 2>/dev/null \
            | python3 -c "import json,sys; d=json.load(sys.stdin)
for g in d.get('data',{}).get('groups',[]):
  print(f\"GROUP: {g['name']} (file: {g.get('file','?')})\")
  for r in g.get('rules',[]):
    print(f\"  - {r.get('type','?')}: {r.get('name','?')} [state={r.get('state','?')}]\")
" 2>&1 | head -30

      - name: Prometheus target health
        continue-on-error: true
        run: |
          set +e
          PROM=$(kubectl -n monitoring get pod -l app=prometheus -o name | head -1)
          if [ -z "$PROM" ]; then echo "no prometheus pod"; exit 0; fi

          echo "===== Prometheus target status for postgres-exporter ====="
          kubectl -n monitoring exec "$PROM" -- \
            wget -qO- "http://localhost:9090/api/v1/targets?state=active" 2>/dev/null \
            | tr ',' '\n' | grep -E 'postgres|orders_daily|orders_today' | head -30

          echo ""
          echo "===== Sample query for orders_daily_order_count ====="
          kubectl -n monitoring exec "$PROM" -- \
            wget -qO- "http://localhost:9090/api/v1/query?query=orders_daily_order_count" 2>/dev/null

          echo ""
          echo "===== Sample query: scrape_samples_scraped for postgres-exporter ====="
          kubectl -n monitoring exec "$PROM" -- \
            wget -qO- "http://localhost:9090/api/v1/query?query=scrape_samples_scraped%7Bjob%3D%22postgres-exporter%22%7D" 2>/dev/null

      - name: Deployment + ConfigMap effective state
        continue-on-error: true
        run: |
          set +e
          echo "===== Deployment spec (probes + args) ====="
          kubectl -n monitoring get deployment/postgres-exporter -o yaml \
            | sed -n '/spec:/,/status:/p' \
            | head -80

          echo ""
          echo "===== ConfigMap queries.yaml ====="
          kubectl -n monitoring get cm postgres-exporter-queries -o jsonpath='{.data.queries\.yaml}'
          echo ""

          echo ""
          echo "===== Secret DSN (key existence only — no value printed) ====="
          kubectl -n monitoring get secret orders-db-credentials -o json \
            | jq -r '.data | keys[]' 2>/dev/null || echo "(secret not found?)"
