name: Diagnose stuck rollouts (frontend webhook + kong crash)
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: A) istiod + webhook reachability
        run: |
          set +e
          echo "===== istiod pods ====="
          kubectl -n istio-system get pods -l app=istiod -o wide
          echo "===== istiod endpoints (webhook backend) ====="
          kubectl -n istio-system get endpoints istiod -o wide
          echo "===== sidecar-injector webhook config ====="
          kubectl get mutatingwebhookconfiguration istio-sidecar-injector \
            -o jsonpath='{range .webhooks[*]}{.name}{"  failurePolicy="}{.failurePolicy}{"  timeout="}{.timeoutSeconds}{"\n"}{end}' 2>/dev/null
          kubectl get mutatingwebhookconfiguration istio-revision-tag-default \
            -o jsonpath='{range .webhooks[*]}{.name}{"  failurePolicy="}{.failurePolicy}{"  timeout="}{.timeoutSeconds}{"\n"}{end}' 2>/dev/null

      - name: B) frontend rollout — why new pods are not created
        run: |
          set +e
          echo "===== deployment ====="
          kubectl get deploy frontend -o wide
          echo "===== replicasets ====="
          kubectl get rs -l app=frontend -o wide
          echo "===== ALL frontend pods (incl pending) ====="
          kubectl get pods -l app=frontend -o wide
          echo "===== describe newest RS (events tell us webhook rejection) ====="
          NEWRS=$(kubectl get rs -l app=frontend --sort-by=.metadata.creationTimestamp -o name | tail -1)
          echo "newest rs: $NEWRS"
          kubectl describe "$NEWRS" | tail -40
          echo "===== recent events in default ns ====="
          kubectl get events --sort-by=.lastTimestamp 2>/dev/null | grep -iE 'frontend|webhook|inject|FailedCreate' | tail -30

      - name: C) kong crash root cause
        run: |
          set +e
          echo "===== kong pods ====="
          kubectl -n kong get pods -o wide
          for P in $(kubectl -n kong get pods -l app.kubernetes.io/name=kong -o name 2>/dev/null); do
            echo "===== describe $P (tail) ====="
            kubectl -n kong describe "$P" | tail -30
            echo "===== CURRENT logs $P ====="
            kubectl -n kong logs "$P" --all-containers=true --tail=60 2>&1 | tail -60
            echo "===== PREVIOUS logs $P (the crash) ====="
            kubectl -n kong logs "$P" --all-containers=true --previous --tail=60 2>&1 | tail -60
          done
          echo "===== the ConfigMap kong is loading ====="
          kubectl -n kong get configmap kong-dbless-config -o jsonpath='{.data.kong\.yaml}'
          echo ""
