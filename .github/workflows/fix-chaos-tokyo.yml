name: Fix Chaos Mesh - cleanup + live verify (Tokyo)

# Clears stale/lingering chaos experiments (incl. pod-kill objects stuck in
# "Injected") for a clean demo slate, then proves the engine works by applying
# a 40s NetworkChaos delay on adservice and watching it inject -> recover.
on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: cleanup stale chaos + live inject/recover test
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          echo "===== BEFORE: chaos CRs in default ====="
          kubectl -n default get podchaos,networkchaos,stresschaos 2>&1

          echo "===== cleanup (clean demo slate) ====="
          # NOTE: chaos CRs carry the chaos-mesh.org finalizer; if the target
          # pod is already gone (pod-kill) the controller may never finish
          # recovery and a plain `kubectl delete` (which waits) hangs forever.
          # So: delete without waiting, then strip finalizers off anything
          # still stuck in Terminating.
          for k in podchaos networkchaos stresschaos; do
            kubectl -n default delete $k --all --wait=false 2>&1
          done
          sleep 10
          for k in podchaos networkchaos stresschaos; do
            for n in $(kubectl -n default get $k -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              echo "  stripping finalizers: $k/$n"
              kubectl -n default patch $k "$n" --type=merge -p '{"metadata":{"finalizers":[]}}' 2>&1
            done
          done
          sleep 5

          echo "===== target pods (frontend / productcatalog ready?) ====="
          kubectl -n default get pod -l app=productcatalogservice -o wide 2>&1
          echo "===== LIVE TEST: NetworkChaos delay 90s on productcatalogservice ====="
          python3 -c "import json;open('/tmp/nc.json','w').write(json.dumps({'apiVersion':'chaos-mesh.org/v1alpha1','kind':'NetworkChaos','metadata':{'name':'verify-pcs','namespace':'default'},'spec':{'action':'delay','mode':'all','selector':{'namespaces':['default'],'labelSelectors':{'app':'productcatalogservice'}},'delay':{'latency':'200ms','jitter':'50ms'},'duration':'90s'}}))"
          kubectl apply -f /tmp/nc.json 2>&1
          INJECTED=no
          for i in $(seq 1 18); do
            sleep 8
            C=$(kubectl -n default get networkchaos verify-pcs -o jsonpath='{range .status.conditions[*]}{.type}={.status} {end}' 2>/dev/null)
            echo "  t+$((i*8))s  $C"
            echo "$C" | grep -q 'AllInjected=True' && INJECTED=yes
            echo "$C" | grep -q 'AllRecovered=True' && { echo "  -> RECOVERED"; break; }
          done
          echo "  RESULT: injected=$INJECTED  (engine OK if injected=yes then recovered)"

          echo "===== cleanup live test ====="
          kubectl -n default delete networkchaos verify-pcs --wait=false --ignore-not-found 2>&1
          sleep 5
          kubectl -n default patch networkchaos verify-pcs --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null

          echo "===== AFTER: chaos CRs in default (clean) ====="
          kubectl -n default get podchaos,networkchaos,stresschaos 2>&1
          echo "===== chaos-mesh components (still healthy?) ====="
          kubectl -n chaos-mesh get pods --no-headers 2>/dev/null | awk '{print $1, $3, "restarts="$4}'
