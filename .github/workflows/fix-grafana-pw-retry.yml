name: Fix Grafana - retry password rotation (clean value, no trailing newline)

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: patch password cleanly, restart, verify real admin access
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
          NEW_PW: ${{ secrets.GRAFANA_NEW_ADMIN_PW }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          echo "NEW_PW length (should be 24, no newline): ${#NEW_PW}"

          B64=$(printf '%s' "$NEW_PW" | base64 | tr -d '\n')
          kubectl -n monitoring patch secret grafana-secret --type=merge -p "{\"data\":{\"admin-password\":\"${B64}\"}}"

          kubectl -n monitoring rollout restart deploy/grafana
          kubectl -n monitoring rollout status deploy/grafana --timeout=180s
          GRAFANA_IP=$(kubectl -n monitoring get svc grafana -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "grafana IP: $GRAFANA_IP"

          echo "===== confirm secret decodes to exactly the intended password ====="
          kubectl -n monitoring get secret grafana-secret -o jsonpath='{.data.admin-password}' | base64 -d | wc -c

          echo "===== verify real authenticated admin (/api/user, not anonymous) ====="
          for i in $(seq 1 15); do
            RESP=$(curl -sS -u "admin:${NEW_PW}" "http://${GRAFANA_IP}:3000/api/user")
            echo "  attempt $i: $RESP"
            echo "$RESP" | grep -q '"login":"admin"' && { echo "  -> REAL ADMIN LOGIN CONFIRMED"; break; }
            sleep 6
          done

          echo ""
          echo "===== create + delete throwaway datasource (proves real RBAC) ====="
          curl -sS -u "admin:${NEW_PW}" -X POST "http://${GRAFANA_IP}:3000/api/datasources" \
            -H 'Content-Type: application/json' \
            -d '{"name":"rbac-final-check","type":"testdata","access":"proxy"}' -w '\nHTTP_CODE=%{http_code}\n'
          UID3=$(curl -sS -u "admin:${NEW_PW}" "http://${GRAFANA_IP}:3000/api/datasources" | python3 -c "import sys,json; ds=json.load(sys.stdin); m=[d['uid'] for d in ds if d['name']=='rbac-final-check']; print(m[0] if m else '')")
          echo "uid: $UID3"
          if [ -n "$UID3" ]; then
            curl -sS -u "admin:${NEW_PW}" -X DELETE "http://${GRAFANA_IP}:3000/api/datasources/uid/${UID3}" -w '\nHTTP_CODE=%{http_code}\n'
          fi

          echo ""
          echo "===== final datasource list ====="
          curl -sS -u "admin:${NEW_PW}" "http://${GRAFANA_IP}:3000/api/datasources" | python3 -c "import sys,json; ds=json.load(sys.stdin); print('count:', len(ds)); [print(' -', d['name'], d['type']) for d in ds]"
