name: Fix Grafana security (rotate admin password + purge _phx_* datasources, Tokyo)

# Grafana (172.237.3.209:3000, ns monitoring) had a 5-character admin
# password and ~50 suspicious `_phx_*` postgres datasources auto-created
# (likely via a compromised admin session/API token — anonymous access is
# Viewer-only and cannot create datasources, so it is not the vector).
# This rotates the admin password to a strong secret.GRAFANA_NEW_ADMIN_PW
# value and deletes every datasource whose name starts with `_phx_`.
on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: rotate password + purge phx datasources
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
          NEW_PW: ${{ secrets.GRAFANA_NEW_ADMIN_PW }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          export KUBECONFIG="$KC"

          if [ -z "$NEW_PW" ]; then
            echo "ERROR: secrets.GRAFANA_NEW_ADMIN_PW not set"; exit 1
          fi

          echo "===== patch grafana-secret admin-password ====="
          B64=$(printf '%s' "$NEW_PW" | base64)
          kubectl -n monitoring patch secret grafana-secret --type=merge -p "{\"data\":{\"admin-password\":\"${B64}\"}}"

          echo "===== restart grafana, wait for rollout ====="
          kubectl -n monitoring rollout restart deploy/grafana
          kubectl -n monitoring rollout status deploy/grafana --timeout=180s

          GRAFANA_IP=$(kubectl -n monitoring get svc grafana -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "grafana IP: $GRAFANA_IP"

          echo "===== verify new password works ====="
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:${NEW_PW}" "http://${GRAFANA_IP}:3000/api/org")
            echo "  attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done

          echo "===== list + delete _phx_* datasources ====="
          curl -fsS -u "admin:${NEW_PW}" "http://${GRAFANA_IP}:3000/api/datasources" > /tmp/ds.json
          TOTAL_BEFORE=$(python3 -c "import json;print(len(json.load(open('/tmp/ds.json'))))")
          echo "total datasources before: $TOTAL_BEFORE"
          python3 -c "
import json
ds = json.load(open('/tmp/ds.json'))
uids = [d['uid'] for d in ds if d['name'].startswith('_phx_')]
print('\n'.join(uids))
" > /tmp/phx_uids.txt
          echo "phx datasources to delete: $(wc -l < /tmp/phx_uids.txt)"
          while read -r UID_; do
            [ -z "$UID_" ] && continue
            curl -s -o /dev/null -w '.' -u "admin:${NEW_PW}" -X DELETE "http://${GRAFANA_IP}:3000/api/datasources/uid/${UID_}"
          done < /tmp/phx_uids.txt
          echo ""

          echo "===== verify final state ====="
          curl -fsS -u "admin:${NEW_PW}" "http://${GRAFANA_IP}:3000/api/datasources" > /tmp/ds_after.json
          TOTAL_AFTER=$(python3 -c "import json;print(len(json.load(open('/tmp/ds_after.json'))))")
          PHX_AFTER=$(python3 -c "import json;print(len([d for d in json.load(open('/tmp/ds_after.json')) if d['name'].startswith('_phx_')]))")
          echo "total datasources after: $TOTAL_AFTER (phx remaining: $PHX_AFTER)"
          python3 -c "
import json
for d in json.load(open('/tmp/ds_after.json')):
    print(' -', d['name'], d['type'])
"
