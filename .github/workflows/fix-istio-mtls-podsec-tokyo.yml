name: Fix Istio mTLS/PodSecurity conflict (Tokyo)
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"
      - name: Remove STRICT mTLS PeerAuthentication (restores external LB traffic)
        run: |
          kubectl delete peerauthentication default-mtls -n default --ignore-not-found
      - name: Remove legacy istio-injection label (ambient mode doesn't need it; it's what's triggering istio-init and colliding with PodSecurity baseline)
        run: |
          kubectl label namespace default istio-injection- --overwrite
          kubectl get ns default -o jsonpath='{.metadata.labels}'; echo
      - name: Force frontend rollout to pick up the fixed image now that pod creation is unblocked
        run: |
          kubectl rollout restart deployment/frontend
          kubectl rollout status deployment/frontend --timeout=180s || {
            kubectl get pod -l app=frontend
            kubectl describe pod -l app=frontend | tail -60
          }
      - name: Verify from inside cluster
        run: |
          sleep 5
          kubectl get pods -l app=frontend -o wide
          POD_IP=$(kubectl get pods -l app=frontend -o jsonpath='{.items[0].status.podIP}')
          kubectl run curltest-$RANDOM --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet --command -- \
            curl -s -o /dev/null -m 8 -w "in-cluster to pod:8080 -> [HTTP %{http_code}]\n" "http://${POD_IP}:8080/" || true
      - name: Verify external
        run: |
          curl -sk -o /dev/null -m 15 -w "external https://tserof.net/ -> [HTTP %{http_code}]\n" "https://tserof.net/"
          curl -s -m 15 "https://tserof.net/product-meta/AKMT001" | head -c 400; echo
