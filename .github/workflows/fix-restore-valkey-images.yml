name: Restore valkey-branch images (Tokyo)

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  restore:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: Check whether Redis vs Valkey env vars are present (spec drift check)
        run: |
          set +e
          echo "===== frontend REDIS_URL ====="
          kubectl set env deployment/frontend --list 2>/dev/null | grep -i REDIS
          echo "===== cartservice REDIS_ADDR ====="
          kubectl set env deployment/cartservice --list 2>/dev/null | grep -i REDIS
          echo "===== checkoutservice REDIS_URL ====="
          kubectl set env deployment/checkoutservice --list 2>/dev/null | grep -i REDIS
          echo "===== redis-cart deployment present? (should be ABSENT on valkey) ====="
          kubectl get deploy redis-cart 2>&1
