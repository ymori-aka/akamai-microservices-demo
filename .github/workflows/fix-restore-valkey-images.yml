name: Restore valkey-branch manifests + images (Tokyo)

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  restore:
    runs-on: self-hosted
    steps:
      - name: Checkout (full history, for valkey branch access)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: Apply valkey-branch manifests for frontend/cartservice/checkoutservice
        run: |
          set -e
          git fetch origin valkey
          git show origin/valkey:kubernetes-manifests/frontend.yaml > /tmp/frontend-valkey.yaml
          git show origin/valkey:kubernetes-manifests/cartservice.yaml > /tmp/cartservice-valkey.yaml
          git show origin/valkey:kubernetes-manifests/checkoutservice.yaml > /tmp/checkoutservice-valkey.yaml
          kubectl apply -f /tmp/frontend-valkey.yaml
          kubectl apply -f /tmp/cartservice-valkey.yaml
          kubectl apply -f /tmp/checkoutservice-valkey.yaml

      - name: Re-pin valkey image tags (apply may have reset :image to manifest placeholder)
        run: |
          set -e
          kubectl set image deployment/frontend server=ghcr.io/ymori-aka/frontend:valkey-6865404
          kubectl set image deployment/checkoutservice server=ghcr.io/ymori-aka/checkoutservice:valkey-6865404
          kubectl set image deployment/cartservice server=ghcr.io/ymori-aka/cartservice:valkey-6148192
          kubectl rollout status deployment/frontend --timeout=180s
          kubectl rollout status deployment/checkoutservice --timeout=180s
          kubectl rollout status deployment/cartservice --timeout=180s

      - name: Remove redis-cart (valkey branch replaces it entirely)
        run: |
          set +e
          kubectl delete deployment redis-cart
          kubectl delete service redis-cart

      - name: Verify env + images
        run: |
          set +e
          echo "===== frontend REDIS_URL ====="
          kubectl set env deployment/frontend --list 2>/dev/null | grep -i REDIS
          echo "===== cartservice REDIS_ADDR ====="
          kubectl set env deployment/cartservice --list 2>/dev/null | grep -i REDIS
          echo "===== checkoutservice REDIS_URL ====="
          kubectl set env deployment/checkoutservice --list 2>/dev/null | grep -i REDIS
          echo "===== images ====="
          kubectl get deploy frontend cartservice checkoutservice -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'
          echo "===== cartservice logs (TLS/connect check) ====="
          kubectl logs deployment/cartservice --tail=40
