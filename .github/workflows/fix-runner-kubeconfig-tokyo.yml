name: Fix runner default kubeconfig -> Tokyo

# self-hosted runner の既定 kubeconfig (~/.kube/config) が、削除済みの Osaka
# クラスタ(598466 / *.jp-osa-1-gw.linodelke.net)を指したまま残っている。
# このため KUBECONFIG を明示していない 20 本以上のワークフローが
# "no such host" で失敗する(2026-09-18 に diagnose-rollouts で踏んだ)。
#
# Tokyo(610031) の kubeconfig を取得して既定に置き換える。既存ファイルは
# タイムスタンプ付きで退避するので、戻したいときはそれをコピーする。
# 冪等なので何度実行してもよい。

on:
  workflow_dispatch:
    inputs:
      tokyo_cluster_id: { default: "610031", required: true }

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: replace default kubeconfig
        env: { LINODE_PAT: "${{ secrets.LINODE_PAT }}" }
        run: |
          set -e
          echo "===== BEFORE: 既定 kubeconfig が指す先 ====="
          kubectl config current-context 2>/dev/null || echo "(context 取得不可)"
          kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}{"\n"}' 2>/dev/null || true

          mkdir -p "$HOME/.kube"
          if [ -f "$HOME/.kube/config" ]; then
            cp "$HOME/.kube/config" "$HOME/.kube/config.bak.$(date +%Y%m%d-%H%M%S)"
            echo "既存 config を退避しました"
          fi

          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' \
            > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          echo "===== AFTER ====="
          kubectl config current-context
          kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}{"\n"}'
          echo "===== 到達確認(Tokyo のノードが出れば成功) ====="
          kubectl get nodes -o wide
