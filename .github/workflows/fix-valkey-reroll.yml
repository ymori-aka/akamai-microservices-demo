name: Fix - unblock istio + reroll checkout/frontend to valkey image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "valkey image tag (valkey-<sha>)"
        required: true
jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: unblock istio, pin images, reroll, verify
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set +e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/610031/kubeconfig" | python3 -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['kubeconfig']).decode())" > "$KC"
          export KUBECONFIG="$KC"

          echo "===== why are new pods Pending? (describe one) ====="
          POD=$(kubectl get pods -l app=frontend -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.phase}{"\n"}{end}' | awk '$2=="Pending"{print $1}' | head -1)
          [ -n "$POD" ] && kubectl describe pod "$POD" 2>&1 | grep -A6 "Events:" | tail -8

          echo "===== unblock istio sidecar-injector (failurePolicy=Ignore) ====="
          for WH in istio-sidecar-injector istio-revision-tag-default; do
            N=$(kubectl get mutatingwebhookconfiguration "$WH" -o jsonpath='{.webhooks}' 2>/dev/null | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))' 2>/dev/null)
            [ -z "$N" ] && continue
            P=""; for i in $(seq 0 $((N-1))); do P="$P{\"op\":\"replace\",\"path\":\"/webhooks/$i/failurePolicy\",\"value\":\"Ignore\"},"; done
            kubectl patch mutatingwebhookconfiguration "$WH" --type=json -p "[${P%,}]" 2>&1
          done

          echo "===== pin images + reroll ====="
          kubectl set image deployment/checkoutservice server=ghcr.io/ymori-aka/checkoutservice:${{ inputs.tag }}
          kubectl set image deployment/frontend        server=ghcr.io/ymori-aka/frontend:${{ inputs.tag }}
          kubectl rollout restart deployment/checkoutservice deployment/frontend
          kubectl rollout status deployment/checkoutservice --timeout=5m
          kubectl rollout status deployment/frontend --timeout=5m

          echo "===== newest pod images + fresh logs ====="
          for D in checkoutservice frontend; do
            P=$(kubectl get pods -l app=$D --field-selector=status.phase=Running --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}')
            echo "$D newest: $P image=$(kubectl get pod $P -o jsonpath='{.spec.containers[0].image}')"
            kubectl logs "$P" --tail=30 2>&1 | grep -iE "ranking|x509|enabled" | tail -4
          done

          echo "===== live: place order, check ranking ====="
          BASE="https://aka-store.tserof.net"; CJ="${RUNNER_TEMP:-/tmp}/cj.txt"
          curl -sS -c "$CJ" -o /dev/null "$BASE/"
          curl -sS -b "$CJ" -c "$CJ" -o /dev/null -w "add: %{http_code}\n" -X POST "$BASE/cart" --data "product_id=AKMT012&quantity=4"
          curl -sS -b "$CJ" -c "$CJ" -o /dev/null -w "checkout: %{http_code}\n" -X POST "$BASE/cart/checkout" --data "email=vk@example.com&street_address=1+Demo&zip_code=94105&city=SF&state=CA&country=United+States&credit_card_number=4111111111111111&credit_card_expiration_month=1&credit_card_expiration_year=2030&credit_card_cvv=672"
          sleep 3
          echo "ranking rows:"; curl -sS "$BASE/ranking" | grep -oE "AKMT[0-9]+" | head -8
