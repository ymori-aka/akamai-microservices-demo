name: recycle-nodes-tokyo
on: { workflow_dispatch: { inputs: { tokyo_cluster_id: { default: "610031", required: true } } } }
jobs:
  c:
    runs-on: self-hosted
    steps:
      - name: recycle LKE node pool
        env: { LINODE_PAT: "${{ secrets.LINODE_PAT }}" }
        run: |
          set +e
          CID=610031
          echo "=== pools ==="
          curl -s -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/$CID/pools" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin).get("data",[]); [print("poolId=%s count=%s type=%s nodes=%s"%(p["id"],p.get("count"),p.get("type"),[n["id"] for n in p.get("nodes",[])])) for p in d]'
          POOL=$(curl -s -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/$CID/pools" | python3 -c 'import sys,json; print(json.load(sys.stdin)["data"][0]["id"])')
          echo "recycling pool $POOL ..."
          curl -s -o /dev/null -w "POOL RECYCLE HTTP %{http_code}\n" -X POST -H "Authorization: Bearer $LINODE_PAT" "https://api.linode.com/v4/lke/clusters/$CID/pools/$POOL/recycle"
          echo "(recycle is async; nodes roll over ~10-15min)"
