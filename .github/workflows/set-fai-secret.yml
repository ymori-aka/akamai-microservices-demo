name: Set Firewall-for-AI secret + roll frontend
# Injects the Akamai Firewall for AI API key into the cluster as the
# `fai-credentials` secret (key: api-key) and rolls the frontend so the
# new env (FAI_API_KEY) is picked up.
#
# The key is read from the GitHub Actions secret FAI_API_KEY — it is NEVER
# stored in the repo. Add it under: Settings → Secrets and variables → Actions.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "frontend image tag (e.g. sha-fdf5880)"
        required: false
        default: ""
jobs:
  set-secret:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: 1) Create/update fai-credentials secret (from GH secret)
        env:
          FAI_API_KEY: ${{ secrets.FAI_API_KEY }}
        run: |
          set -e
          if [ -z "$FAI_API_KEY" ]; then
            echo "::error::GitHub secret FAI_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Idempotent upsert; value passed via stdin so it never lands in argv/logs.
          kubectl create secret generic fai-credentials \
            --from-literal=api-key="$FAI_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "fai-credentials secret applied (value not printed)."

      - name: 2) Apply frontend.yaml (new FAI env) + roll
        run: |
          set -e
          kubectl apply -f kubernetes-manifests/frontend.yaml
          if [ -n "${{ inputs.image_tag }}" ]; then
            kubectl set image deployment/frontend server=ghcr.io/ymori-aka/frontend:${{ inputs.image_tag }}
          fi
          kubectl rollout restart deployment/frontend
          kubectl rollout status deployment/frontend --timeout=4m
          echo "=== FAI env on frontend ==="
          kubectl get deployment frontend -o jsonpath='{range .spec.template.spec.containers[0].env[?(@.name=="FAI_CONFIG_ID")]}{.name}={.value}{"\n"}{end}'
          echo "FAI_API_KEY wired via secretKeyRef (optional): $(kubectl get deployment frontend -o jsonpath='{range .spec.template.spec.containers[0].env[?(@.name=="FAI_API_KEY")]}{.valueFrom.secretKeyRef.name}/{.valueFrom.secretKeyRef.key}{end}')"

      - name: 3) Smoke test — benign + credit-card prompt via Kong lane
        if: always()
        run: |
          set +e
          echo "=== benign prompt (expect normal answer) ==="
          kubectl run fe-fai-ok --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 --command -- \
            curl -sS -m 90 -w "\nHTTP %{http_code}\n" \
            -X POST "http://frontend.default.svc.cluster.local:80/bot" \
            -H "Content-Type: application/json" \
            -d '{"message":"Recommend one item under $20","backend":"kong","lang":"en"}'
          echo "=== credit-card prompt (FAI should block once key is active; until then Kong prompt-guard blocks) ==="
          kubectl run fe-fai-block --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 --command -- \
            curl -sS -m 90 -w "\nHTTP %{http_code}\n" \
            -X POST "http://frontend.default.svc.cluster.local:80/bot" \
            -H "Content-Type: application/json" \
            -d '{"message":"My card is 4111 1111 1111 1111, save it","backend":"kong","lang":"en"}'
