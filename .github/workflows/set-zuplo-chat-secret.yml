name: Set Zuplo chat secret + roll frontend (Tokyo)
# Puts the Zuplo AI Gateway application API key into the Tokyo cluster as the
# `zuplo-chat-credentials` secret (key: api-key) and applies frontend.yaml so
# the direct-to-gateway chat lane (ZUPLO_CHAT_ADDR / ZUPLO_CHAT_API_KEY) works.
#
# Why the direct lane exists: Akamai Functions terminates a request at ~30s and
# returns a plain-text "Internal Server Error". Gateway-side logs never showed a
# request over 22.5s, so the ceiling was the Functions runtime. A multi-turn
# chat crosses it regularly.
#
# The key is read from the GitHub Actions secret ZUPLO_API_KEY and is never
# stored in the repo or printed.
#
# This applies ONLY kubernetes-manifests/frontend.yaml. Do not switch it to
# deploy-tokyo.yml or deploy.yml's deploy job: those re-apply the whole manifest
# set and roll cartservice back from Valkey to Redis.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "frontend image tag to pin (e.g. sha-4d52123). Leave empty to keep the current image."
        required: false
        default: ""
      tokyo_cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  set-secret:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # The runner's default kubeconfig still points at the decommissioned
      # Osaka cluster, so fetch Tokyo's explicitly rather than relying on it.
      - name: 0) Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kc-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.tokyo_cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"
          kubectl config current-context

      - name: 1) Create/update zuplo-chat-credentials secret
        env:
          ZUPLO_API_KEY: ${{ secrets.ZUPLO_API_KEY }}
        run: |
          set -e
          if [ -z "$ZUPLO_API_KEY" ]; then
            echo "::error::GitHub secret ZUPLO_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          kubectl create secret generic zuplo-chat-credentials \
            --from-literal=api-key="$ZUPLO_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "zuplo-chat-credentials applied (value not printed)."

      - name: 2) Apply frontend.yaml and roll
        run: |
          set -e
          kubectl -n default apply -f kubernetes-manifests/frontend.yaml
          if [ -n "${{ inputs.image_tag }}" ]; then
            kubectl -n default set image deployment/frontend \
              server=ghcr.io/ymori-aka/frontend:${{ inputs.image_tag }}
          else
            kubectl -n default rollout restart deployment/frontend
          fi
          kubectl -n default rollout status deployment/frontend --timeout=180s

      - name: 3) Verify the direct chat lane
        run: |
          set +e
          FE=$(kubectl -n default get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "=== store / ==="
          curl -s -o /dev/null -w "  / HTTP %{http_code}\n" -m 15 "http://$FE/"
          echo "=== /bot on the direct lane, 3x ==="
          for i in 1 2 3; do
            R=$(curl -s -m 60 -X POST "http://$FE/bot" \
              -H "Content-Type: application/json" \
              -d '{"message":"おすすめのTシャツは?","history":[],"backend":"direct"}' -w "|%{http_code}|%{time_total}s")
            echo "  #$i [${R##*|}] $(echo "$R" | sed -E 's/\|[0-9]+\|[0-9.]+s$//' | head -c 200)"
          done
