name: Setup DNS - tserof.net (Linode Domains)

# Creates the Linode-managed DNS zone for tserof.net (if it doesn't exist
# yet) and points the apex + www A records at the Tokyo store's
# NodeBalancer IP. This does NOT touch domain registration or the
# registrar's nameserver settings — those must be pointed at
# ns1.linode.com..ns5.linode.com by the domain owner separately.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to create/manage in Linode DNS"
        required: true
        default: "tserof.net"
      target_ip:
        description: "IP the A records should point to"
        required: true
        default: "172.237.1.139"

jobs:
  setup-dns:
    runs-on: self-hosted
    steps:
      - name: create zone (if missing) + A records
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          DOMAIN="${{ inputs.domain }}"
          IP="${{ inputs.target_ip }}"
          AUTH="Authorization: Bearer $LINODE_PAT"

          echo "===== check if zone already exists ====="
          EXISTING=$(curl -fsS -H "$AUTH" "https://api.linode.com/v4/domains?page_size=200" | python3 -c "import sys,json; d=json.load(sys.stdin); m=[z['id'] for z in d['data'] if z['domain']=='$DOMAIN']; print(m[0] if m else '')")

          if [ -n "$EXISTING" ]; then
            DOMAIN_ID="$EXISTING"
            echo "zone already exists, id=$DOMAIN_ID"
          else
            echo "===== creating zone ====="
            RESP=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              "https://api.linode.com/v4/domains" \
              -d "{\"domain\":\"$DOMAIN\",\"type\":\"master\",\"soa_email\":\"admin@$DOMAIN\"}")
            echo "$RESP"
            DOMAIN_ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
            echo "created zone id=$DOMAIN_ID"
          fi

          echo "===== existing records ====="
          curl -fsS -H "$AUTH" "https://api.linode.com/v4/domains/$DOMAIN_ID/records?page_size=200" | python3 -m json.tool

          upsert_a() {
            NAME="$1"   # "" for apex, "www" for www
            EXISTING_REC=$(curl -fsS -H "$AUTH" "https://api.linode.com/v4/domains/$DOMAIN_ID/records?page_size=200" | python3 -c "import sys,json; d=json.load(sys.stdin); m=[str(r['id']) for r in d['data'] if r['type']=='A' and r['name']=='$NAME']; print(m[0] if m else '')")
            if [ -n "$EXISTING_REC" ]; then
              echo "updating A record name='$NAME' -> $IP (id=$EXISTING_REC)"
              curl -fsS -X PUT -H "$AUTH" -H "Content-Type: application/json" \
                "https://api.linode.com/v4/domains/$DOMAIN_ID/records/$EXISTING_REC" \
                -d "{\"type\":\"A\",\"name\":\"$NAME\",\"target\":\"$IP\",\"ttl_sec\":300}"
            else
              echo "creating A record name='$NAME' -> $IP"
              curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                "https://api.linode.com/v4/domains/$DOMAIN_ID/records" \
                -d "{\"type\":\"A\",\"name\":\"$NAME\",\"target\":\"$IP\",\"ttl_sec\":300}"
            fi
            echo ""
          }

          upsert_a ""
          upsert_a "www"

          echo "===== final record list ====="
          curl -fsS -H "$AUTH" "https://api.linode.com/v4/domains/$DOMAIN_ID/records?page_size=200" | python3 -m json.tool

          echo ""
          echo "===== NS delegation needed at registrar ====="
          echo "Point $DOMAIN nameservers to:"
          echo "  ns1.linode.com"
          echo "  ns2.linode.com"
          echo "  ns3.linode.com"
          echo "  ns4.linode.com"
          echo "  ns5.linode.com"
