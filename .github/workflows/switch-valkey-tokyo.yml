name: Switch Valkey endpoint (Tokyo)

# Repoints cartservice / checkoutservice / frontend at whatever the
# VALKEY_URL / VALKEY_ADDR GitHub Secrets currently hold, by recreating the
# in-cluster `valkey-credentials` Secret and restarting the three consumers.
#
# Deliberately does NOT apply manifests or touch image tags — the running
# Tokyo cluster is on the `valkey` branch build, and applying `main`'s
# manifests would roll it back to the Redis configuration.

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  switch:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: Recreate valkey-credentials Secret from GitHub Secrets
        run: |
          set -e
          kubectl create secret generic valkey-credentials \
            --from-literal=REDIS_ADDR='${{ secrets.VALKEY_ADDR }}' \
            --from-literal=REDIS_URL='${{ secrets.VALKEY_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "valkey-credentials updated (values not printed)"

      - name: Restart the three Valkey consumers
        run: |
          set -e
          for d in cartservice checkoutservice frontend; do
            kubectl rollout restart deployment/$d
          done
          for d in cartservice checkoutservice frontend; do
            kubectl rollout status deployment/$d --timeout=240s
          done

      - name: Verify (host only, credentials masked)
        run: |
          set +e
          echo "===== host the pods now point at ====="
          kubectl get secret valkey-credentials -o jsonpath='{.data.REDIS_URL}' \
            | base64 -d | sed -E 's#//[^@]+@#//***:***@#'
          echo
          echo "===== images still on the valkey build? ====="
          kubectl get deploy frontend cartservice checkoutservice \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'
          echo "===== cartservice logs (connection errors?) ====="
          kubectl logs deployment/cartservice --tail=30 2>&1 | grep -iE "error|exception|connect|timeout|redis|valkey" | tail -10
