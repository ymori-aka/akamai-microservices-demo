name: Test Kong AI proxy (OpenAI chat → Gemma)
on: { workflow_dispatch: {} }
jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: POST /v1/chat/completions through Kong
        run: |
          set +e
          kubectl -n kong run kong-aitest --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 --command -- \
            curl -sS -m 90 -w "\nHTTP %{http_code} in %{time_total}s\n" \
            -X POST "http://kong-kong-proxy.kong.svc.cluster.local/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{"model":"google_gemma-4-26B-A4B-it-Q4_K_M.gguf","messages":[{"role":"user","content":"Say hello in 5 words."}],"max_tokens":64,"temperature":0.2}'
