name: Tokyo debug (read-only)

# One-shot, READ-ONLY diagnostics against the Tokyo cluster from the
# self-hosted runner (local kubectl can't reach the API from the admin
# machine due to a path-MTU issue on the VPN). Changes NOTHING in-cluster.
on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Tokyo LKE cluster id"
        required: true
        default: "610031"

jobs:
  debug:
    runs-on: self-hosted
    steps:
      - name: Fetch Tokyo kubeconfig
        env:
          LINODE_PAT: ${{ secrets.LINODE_PAT }}
        run: |
          set -e
          KC="${RUNNER_TEMP:-/tmp}/kubeconfig-tyo.yaml"
          curl -fsS -H "Authorization: Bearer $LINODE_PAT" \
            "https://api.linode.com/v4/lke/clusters/${{ inputs.cluster_id }}/kubeconfig" \
            | python3 -c 'import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)["kubeconfig"]).decode())' > "$KC"
          chmod 600 "$KC"
          echo "KUBECONFIG=$KC" >> "$GITHUB_ENV"

      - name: FULL Grafana data audit (metrics + logs + traces)
        continue-on-error: true
        run: |
          q() {
            kubectl -n monitoring run dbgq-$RANDOM --image=curlimages/curl:8.10.1 \
              --restart=Never --rm -i --quiet --command -- sh -c \
              "curl -s 'http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=$1'" 2>/dev/null \
              | python3 -c 'import sys,json;r=json.load(sys.stdin)["data"]["result"];print(r[0]["value"][1] if r else "0")' 2>/dev/null
          }
          loki() {
            kubectl -n monitoring run dbgl-$RANDOM --image=curlimages/curl:8.10.1 \
              --restart=Never --rm -i --quiet --command -- sh -c "curl -s \"$1\"" 2>/dev/null
          }
          echo "===== PROMETHEUS metric presence (series count; 0 = MISSING) ====="
          printf "  %-34s %s\n" "app spanmetrics (calls)"        "$(q 'count(traces_spanmetrics_calls_total)')"
          printf "  %-34s %s\n" "service-graph edges"            "$(q 'count(traces_service_graph_request_total)')"
          printf "  %-34s %s\n" "istio_requests_total (Kiali)"   "$(q 'count(istio_requests_total)')"
          printf "  %-34s %s\n" "k6_http_reqs_total"             "$(q 'count(k6_http_reqs_total)')"
          printf "  %-34s %s\n" "KPI orders_today_order_count"   "$(q 'orders_today_order_count')"
          printf "  %-34s %s\n" "KPI orders_daily_order_count"   "$(q 'orders_daily_order_count')"
          printf "  %-34s %s\n" "CloudPulse dbaas avg_cpu_usage" "$(q 'count(avg_cpu_usage)')"
          printf "  %-34s %s\n" "CloudPulse nb_ingress_rate"     "$(q 'count(nb_ingress_traffic_rate)')"
          printf "  %-34s %s\n" "CloudPulse obj_bucket_size"     "$(q 'count(obj_bucket_size)')"
          printf "  %-34s %s\n" "node-exporter node_cpu"         "$(q 'count(node_cpu_seconds_total)')"
          printf "  %-34s %s\n" "kube-state kube_pod_info"       "$(q 'count(kube_pod_info)')"
          printf "  %-34s %s\n" "cadvisor container_cpu"         "$(q 'count(container_cpu_usage_seconds_total)')"
          printf "  %-34s %s\n" "redis_up"                       "$(q 'count(redis_up)')"
          printf "  %-34s %s\n" "otelcol_receiver_accepted_spans" "$(q 'count(otelcol_receiver_accepted_spans_total)')"
          printf "  %-34s %s\n" "boutique_* (otel app metrics)"  "$(q 'count(group by (__name__)({__name__=~\"boutique_.%2B\"}))')"
          echo "===== Prometheus 'job' label values (scrape sources) ====="
          loki "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/label/job/values" | python3 -c 'import sys,json;print("  "+", ".join(json.load(sys.stdin).get("data",[])))' 2>/dev/null || true
          echo "===== Prometheus 'service_name'/'exported_job' values (incl Spin?) ====="
          for lbl in service_name exported_job service exported_service_name; do
            V=$(loki "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/label/$lbl/values" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("data",[]);print(", ".join(d[:40]))' 2>/dev/null)
            [ -n "$V" ] && echo "  $lbl: $V"
          done
          echo "===== LOKI label values (log streams present) ====="
          for lbl in job app namespace service_name container exporter; do
            V=$(loki "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/label/$lbl/values" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("data",[]);print(", ".join(d[:40]))' 2>/dev/null)
            [ -n "$V" ] && echo "  $lbl: $V"
          done
          echo "===== LOKI: any Spin logs? (recommendation/product-intro/shopping-assistant) ====="
          loki 'http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/query_range?query=%7Bexporter%3D%22OTLP%22%7D&limit=3' | python3 -c 'import sys,json;d=json.load(sys.stdin);res=d.get("data",{}).get("result",[]);print("  OTLP log streams:",len(res));[print("   ",s.get("stream",{})) for s in res[:3]]' 2>/dev/null || echo "  (no OTLP logs / query failed)"
          echo "===== TEMPO service.name values ====="
          loki "http://tempo.monitoring.svc.cluster.local:3200/api/search/tag/service.name/values" | python3 -c 'import sys,json;print("  "+", ".join(sorted(json.load(sys.stdin).get("tagValues",[]))))' 2>/dev/null || echo "  (tempo query failed)"

      - name: aclp-collector (Cloud Pulse) diagnosis
        continue-on-error: true
        run: |
          echo "===== aclp-collector pod ====="
          kubectl -n monitoring get pods -l app=aclp-collector -o wide || true
          echo "===== aclp-collector logs ====="
          kubectl -n monitoring logs deployment/aclp-collector --tail=100 2>&1 | grep -iE "error|fail|panic|invalid|unknown field|401|403|scope|unauthor|cannot|objectstorage|nodebalancer|dbaas|Everything is ready|start|config" | tail -30 | sed 's/^/  /' || true
          echo "===== :9464 metric sample ====="
          P=$(kubectl -n monitoring get pod -l app=aclp-collector -o name 2>/dev/null | head -1)
          [ -n "$P" ] && kubectl -n monitoring exec "$P" -- sh -c 'wget -qO- http://localhost:9464/metrics 2>/dev/null | grep -iE "obj_bucket|avg_cpu|nb_ingress" | head -12' 2>/dev/null | sed 's/^/  /' || echo "  (no metrics)"
          echo "===== postgres-exporter present? (Business KPI) ====="
          kubectl -n monitoring get deploy postgres-exporter -o wide 2>&1 | sed 's/^/  /' || echo "  (postgres-exporter NOT deployed)"
          echo "===== k6 load pod ====="
          kubectl get deploy k6 -o wide 2>&1 | sed 's/^/  /' || echo "  (k6 NOT deployed)"
          echo "===== metric presence in Prometheus (k6 / KPI / aclp dbaas+nb) ====="
          PROM=$(kubectl -n monitoring get pod -l app=prometheus -o name 2>/dev/null | head -1)
          for q in 'count(k6_http_reqs_total)' 'orders_today_order_count' 'orders_daily_order_count' 'count(avg_cpu_usage)' 'count(nb_ingress_traffic_rate)'; do
            V=$(kubectl -n monitoring exec "$PROM" -- wget -qO- "http://localhost:9090/api/v1/query?query=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")" 2>/dev/null | python3 -c 'import sys,json;r=json.load(sys.stdin)["data"]["result"];print(r[0]["value"][1] if r else "NONE")' 2>/dev/null)
            echo "  $q = $V"
          done

      - name: Orders DB / checkout 422 diagnosis
        continue-on-error: true
        run: |
          echo "===== orders-db-credentials secret present? + DSN host ====="
          kubectl get secret orders-db-credentials -o jsonpath='{.data.DSN}' 2>/dev/null | base64 -d 2>/dev/null | sed -E 's#//([^:]+):[^@]+@#//\1:***@#' | sed 's/^/  DSN=/' || echo "  (no secret)"
          echo "===== ORDER_DB_DSN actually on checkout/frontend pods ====="
          for d in checkoutservice frontend; do
            echo "  --- $d ---"
            kubectl set env deployment/$d --list 2>/dev/null | grep -iE "ORDER_DB|DSN" | sed -E 's#//([^:]+):[^@]+@#//\1:***@#; s/^/    /' || echo "    (ORDER_DB_DSN not set)"
          done
          echo "===== checkoutservice logs (DB / order errors) ====="
          kubectl logs deployment/checkoutservice --tail=60 2>&1 | grep -iE "order|db|postgres|dsn|sql|connect|tls|ssl|error|fail|panic|refused|placeorder|422|denied" | tail -20 | sed 's/^/  /' || true
          echo "===== frontend logs (checkout 422) ====="
          kubectl logs deployment/frontend --tail=80 2>&1 | grep -iE "checkout|placeorder|order|422|error|payment|card|grpc" | tail -15 | sed 's/^/  /' || true

      - name: CNI / mesh-readiness probe (for Istio ambient feasibility)
        continue-on-error: true
        run: |
          echo "===== kube-system networking components ====="
          kubectl -n kube-system get ds,deploy -o wide 2>&1 | grep -iE "cilium|calico|flannel|kube-proxy|weave|router|cni|NAME" | sed 's/^/  /' || true
          echo "===== nodes (kubelet/k8s version) ====="
          kubectl get nodes -o wide 2>&1 | sed 's/^/  /' || true
          echo "===== existing istio/kiali (should be none) ====="
          kubectl get ns 2>&1 | grep -iE "istio|kiali" | sed 's/^/  /' || echo "  (no istio/kiali namespaces)"

      - name: Istio (ambient) request metrics for Kiali
        continue-on-error: true
        run: |
          run_curl() {
            kubectl -n monitoring run dbg-$RANDOM --image=curlimages/curl:8.10.1 \
              --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null
          }
          echo "===== istio_requests_total source_workload -> destination_service ====="
          run_curl 'curl -s "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=sum%20by%20(source_workload,destination_service_name)(istio_requests_total)"' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);r=d.get("data",{}).get("result",[]);[print("  %-26s -> %-26s = %s"%(m["metric"].get("source_workload","?"),m["metric"].get("destination_service_name","?"),m["value"][1])) for m in r] or print("  (no istio_requests_total yet)")'
          echo "===== istio_tcp (ztunnel L4) present? ====="
          run_curl 'curl -s "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=count(istio_tcp_connections_opened_total)"' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);r=d.get("data",{}).get("result",[]);print("  series:",r[0]["value"][1] if r else 0)'

      - name: Service-graph metrics present in Prometheus
        continue-on-error: true
        run: |
          # Run an in-cluster curl pod to hit Prometheus + Tempo APIs.
          run_curl() {
            kubectl -n monitoring run dbg-$RANDOM --image=curlimages/curl:8.10.1 \
              --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null
          }
          echo "===== all traces_service_graph client->server pairs ====="
          run_curl 'curl -s "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=sum%20by%20(client,server)(traces_service_graph_request_total)"' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);[print("  %-26s -> %-26s = %s"%(r["metric"].get("client","?"),r["metric"].get("server","?"),r["value"][1])) for r in d.get("data",{}).get("result",[])] or print("  (none)")'
          echo "===== service.name values Tempo has actually seen (last 1h) ====="
          run_curl 'curl -s "http://tempo.monitoring.svc.cluster.local:3200/api/search/tag/service.name/values"' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print("  "+", ".join(sorted(d.get("tagValues",[]))) or "  (none)")' 2>/dev/null || echo "  (tempo tag query failed)"
          echo "===== span counts by service (Tempo metrics_generator span metrics) ====="
          run_curl 'curl -s "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=sum%20by%20(service)(traces_spanmetrics_calls_total)"' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);[print("  %-30s = %s"%(r["metric"].get("service","?"),r["value"][1])) for r in d.get("data",{}).get("result",[])] or print("  (none)")' 2>/dev/null || true

      - name: Tempo service.name coverage + one trace span tree
        continue-on-error: true
        run: |
          run_curl() {
            kubectl -n monitoring run dbg-$RANDOM --image=curlimages/curl:8.10.1 \
              --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null
          }
          echo "===== service.name values Tempo has seen (post-fix) ====="
          run_curl 'curl -s "http://tempo.monitoring.svc.cluster.local:3200/api/search/tag/service.name/values"' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print("  "+", ".join(sorted(d.get("tagValues",[]))))' 2>/dev/null || echo "  (failed)"
          echo "===== find a checkoutservice trace, list services + span kinds in it ====="
          # If frontend AND checkoutservice appear in the SAME trace => context
          # propagated end-to-end (the 'user' edge is then a service_graphs
          # virtual-node artifact). If the checkout trace contains ONLY
          # checkoutservice => propagation is broken (separate traces).
          TID=$(run_curl 'curl -s "http://tempo.monitoring.svc.cluster.local:3200/api/search?q=%7B%20.service.name%3D%22checkoutservice%22%20%7D&limit=5"' \
            | grep -oE '"traceID":"[a-f0-9]+"' | head -1 | sed -E 's/.*:"//; s/"//')
          echo "  traceID=$TID"
          if [ -n "$TID" ]; then
            TR=$(run_curl "curl -s 'http://tempo.monitoring.svc.cluster.local:3200/api/traces/$TID'")
            echo "  services present in this trace:"
            echo "$TR" | grep -oE '"stringValue":"(frontend|[a-z]+service|redis[a-z-]*)"' | sed -E 's/.*:"//; s/"//' | sort | uniq -c | sed 's/^/    /'
            echo "  span kinds in this trace (2=server,3=client):"
            echo "$TR" | grep -oE '"kind":[0-9]+' | sort | uniq -c | sed 's/^/    /'
            echo "  root spans (no parentSpanId) count:"
            echo "$TR" | grep -oc '"spanId"' | sed 's/^/    total spans: /'
            echo "$TR" | grep -oc '"parentSpanId"' | sed 's/^/    spans WITH parent: /'
          fi

      - name: collector internal span counters + app startup logs
        continue-on-error: true
        run: |
          run_curl() {
            kubectl -n monitoring run dbg-$RANDOM --image=curlimages/curl:8.10.1 \
              --restart=Never --rm -i --quiet --command -- sh -c "$1" 2>/dev/null
          }
          echo "===== collector :8888 span counters by receiver/exporter ====="
          run_curl 'curl -s http://otel-collector.monitoring.svc.cluster.local:8888/metrics' \
            | grep -iE "receiver_accepted_spans|receiver_refused_spans|exporter_sent_spans|exporter_send_failed_spans|receiver_accepted_metric" \
            | grep -v "^#" | sed 's/^/  /' || echo "  (could not read :8888)"
          echo "===== frontend STARTUP logs (tracing init decision) ====="
          kubectl logs deployment/frontend --tail=400 2>&1 | grep -iE "trac|exporter|collector|otel|sampler|telemetry|init|stats|55678|4317" | head -15 | sed 's/^/  /' || true
          echo "===== productcatalog STARTUP logs ====="
          kubectl logs deployment/productcatalogservice --tail=400 2>&1 | grep -iE "trac|exporter|collector|otel|mongo|loaded|seed|55678|4317|product" | head -15 | sed 's/^/  /' || true

      - name: otel-collector receiver/exporter activity
        continue-on-error: true
        run: |
          echo "===== collector logs (opencensus / refused / export errors) ====="
          kubectl -n monitoring logs deployment/otel-collector --tail=200 2>&1 \
            | grep -iE "opencensus|refused|error|warn|tempo|started|receiver" | tail -40 | sed 's/^/  /' || true

      - name: tracing env actually set on each app
        continue-on-error: true
        run: |
          for d in frontend cartservice currencyservice productcatalogservice checkoutservice adservice; do
            echo "--- $d ---"
            kubectl set env deployment/$d --list 2>/dev/null | grep -iE "ENABLE_TRACING|COLLECTOR_SERVICE_ADDR|OTEL_EXPORTER|OTEL_SERVICE" | sed 's/^/    /' || true
          done

      - name: app trace-export logs (are Go apps exporting? errors?)
        continue-on-error: true
        run: |
          for d in frontend productcatalogservice checkoutservice; do
            echo "===== $d logs (trace/export/collector) ====="
            kubectl logs deployment/$d --tail=120 2>&1 \
              | grep -iE "trace|export|collector|opencensus|55678|otel|span|error|refused|fail" | tail -15 | sed 's/^/  /' || true
          done
