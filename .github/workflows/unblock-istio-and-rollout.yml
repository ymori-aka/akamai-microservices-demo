name: Unblock istio injector + roll frontend (Kong env)
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "frontend image tag (e.g. sha-fdf5880)"
        required: true
        default: "sha-fdf5880"
jobs:
  unblock:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: 0) Make sidecar-injector non-blocking (failurePolicy=Ignore)
        run: |
          set +e
          # ROOT CAUSE: apiserver -> istiod:443 /inject times out ("context
          # deadline exceeded"). With failurePolicy=Fail this blocks ALL new
          # pod creation in the mesh. The cluster already runs sidecar-less
          # (frontend pods are 1/1), so injection is not required. Flip to
          # Ignore so pod creation succeeds; injection is skipped on timeout.
          for WH in istio-sidecar-injector istio-revision-tag-default; do
            COUNT=$(kubectl get mutatingwebhookconfiguration "$WH" -o jsonpath='{.webhooks}' 2>/dev/null | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))' 2>/dev/null)
            echo "$WH has $COUNT webhooks"
            if [ -n "$COUNT" ]; then
              PATCH="["
              for i in $(seq 0 $((COUNT-1))); do
                [ "$i" -gt 0 ] && PATCH="$PATCH,"
                PATCH="$PATCH{\"op\":\"replace\",\"path\":\"/webhooks/$i/failurePolicy\",\"value\":\"Ignore\"}"
              done
              PATCH="$PATCH]"
              kubectl patch mutatingwebhookconfiguration "$WH" --type=json -p "$PATCH"
            fi
          done

      - name: 1) Apply frontend.yaml (new env) + roll to ${{ inputs.image_tag }}
        run: |
          set +e
          # apply picks up SHOPPING_ASSISTANT_KONG_ADDR (Kong in-cluster URL).
          kubectl apply -f kubernetes-manifests/frontend.yaml
          kubectl set image deployment/frontend server=ghcr.io/ymori-aka/frontend:${{ inputs.image_tag }}
          kubectl rollout restart deployment/frontend
          kubectl rollout status deployment/frontend --timeout=4m
          echo "=== frontend pods + images ==="
          kubectl get pods -l app=frontend -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\t"}{.spec.containers[0].image}{"\n"}{end}'
          echo "=== KONG addr env ==="
          kubectl get deployment frontend -o jsonpath='{range .spec.template.spec.containers[0].env[?(@.name=="SHOPPING_ASSISTANT_KONG_ADDR")]}{.name}={.value}{"\n"}{end}'

      - name: 2) Verify toggle markup + Kong chat path end-to-end
        if: always()
        run: |
          set +e
          echo "ready/replicas + image:"
          kubectl get deployment frontend -o jsonpath='{.status.readyReplicas}/{.status.replicas}  {.spec.template.spec.containers[0].image}{"\n"}'
          echo "=== probing /assistant for chat-backend toggle ==="
          kubectl run fe-curl --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 \
            --command -- curl -s "http://frontend.default.svc.cluster.local:80/assistant" \
            | grep -ioE 'chat-backend|Kong AI Gateway|kong_enabled' | sort -u || echo "(toggle markup NOT found)"
          echo "=== POST /bot with backend=kong (frontend -> Kong -> Gemma) ==="
          kubectl run fe-botcurl --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 --command -- \
            curl -sS -m 90 -w "\nHTTP %{http_code} in %{time_total}s\n" \
            -X POST "http://frontend.default.svc.cluster.local:80/bot" \
            -H "Content-Type: application/json" \
            -d '{"message":"Recommend one item under $20","backend":"kong","lang":"en"}'
