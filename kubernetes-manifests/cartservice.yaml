# `valkey` branch: cart storage is Akamai Managed Valkey (Aiven-hosted)
# instead of the in-cluster redis-cart Deployment used on `main`. The
# redis-cart Deployment/Service have been removed here; REDIS_ADDR now
# comes from a Secret (full StackExchange.Redis connection string with
# TLS + auth) and a CA cert is mounted for TLS verification (see
# Startup.cs and deploy-valkey-tokyo.yml).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      serviceAccountName: cartservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: cartservice
        ports:
        - containerPort: 7070
        env:
        # Full StackExchange.Redis connection string for Akamai Managed
        # Valkey (Aiven), e.g. "host:port,ssl=true,user=akmadmin,password=...".
        # Contains a password, so it comes from a Secret rather than a
        # plain value — created by deploy-valkey-tokyo.yml from the GitHub
        # Secret VALKEY_ADDR.
        - name: REDIS_ADDR
          valueFrom:
            secretKeyRef:
              name: valkey-credentials
              key: REDIS_ADDR
        # Path to the mounted CA cert (see volumes below) used to verify
        # Valkey's TLS chain in-process (see Startup.cs) — the runtime
        # image has no shell/update-ca-certificates to install it into the
        # OS trust store.
        - name: REDIS_CA_CERT_PATH
          value: "/etc/valkey-ca/ca.pem"
        volumeMounts:
        - name: valkey-ca-cert
          mountPath: /etc/valkey-ca
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          initialDelaySeconds: 15
          grpc:
            port: 7070
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 10
          grpc:
            port: 7070
      volumes:
      - name: valkey-ca-cert
        secret:
          secretName: valkey-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  type: ClusterIP
  selector:
    app: cartservice
  ports:
  - name: grpc
    port: 7070
    targetPort: 7070
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cartservice
