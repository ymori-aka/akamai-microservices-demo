apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
  labels:
    app: checkoutservice
spec:
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      labels:
        app: checkoutservice
    spec:
      serviceAccountName: checkoutservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: checkoutservice
          ports:
          - containerPort: 5050
          readinessProbe:
            grpc:
              port: 5050
          livenessProbe:
            grpc:
              port: 5050
          env:
          - name: PORT
            value: "5050"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "productcatalogservice:3550"
          - name: SHIPPING_SERVICE_ADDR
            value: "shippingservice:50051"
          - name: PAYMENT_SERVICE_ADDR
            value: "paymentservice:50051"
          - name: EMAIL_SERVICE_ADDR
            value: "emailservice:5000"
          - name: CURRENCY_SERVICE_ADDR
            value: "currencyservice:7000"
          - name: CART_SERVICE_ADDR
            value: "cartservice:7070"
          - name: ORDER_DB_DSN
            valueFrom:
              secretKeyRef:
                name: orders-db-credentials
                key: DSN
                optional: true
          # valkey branch: best-seller ranking sorted set. REDIS_URL is a
          # rediss:// URL for Akamai Managed Valkey (go-redis format, distinct
          # from cartservice's StackExchange.Redis string). optional=true so
          # checkout keeps working if the secret is absent.
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: valkey-credentials
                key: REDIS_URL
                optional: true
          - name: REDIS_CA_CERT_PATH
            value: "/etc/valkey-ca/ca.pem"
          volumeMounts:
          - name: valkey-ca-cert
            mountPath: /etc/valkey-ca
            readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
      volumes:
      - name: valkey-ca-cert
        secret:
          secretName: valkey-ca-cert
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
  labels:
    app: checkoutservice
spec:
  type: ClusterIP
  selector:
    app: checkoutservice
  ports:
  - name: grpc
    port: 5050
    targetPort: 5050
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkoutservice
