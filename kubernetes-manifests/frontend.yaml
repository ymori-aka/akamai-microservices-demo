apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: stable   # Istio DestinationRule subset selector
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: frontend
          ports:
          - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-readiness-probe"
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-liveness-probe"
          env:
          - name: PORT
            value: "8080"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "productcatalogservice:3550"
          - name: CURRENCY_SERVICE_ADDR
            value: "currencyservice:7000"
          - name: CART_SERVICE_ADDR
            value: "cartservice:7070"
          - name: RECOMMENDATION_SERVICE_ADDR
            value: "recommendationservice:8080"
          - name: SHIPPING_SERVICE_ADDR
            value: "shippingservice:50051"
          - name: CHECKOUT_SERVICE_ADDR
            value: "checkoutservice:5050"
          - name: AD_SERVICE_ADDR
            value: "adservice:9555"
          - name: SHOPPING_ASSISTANT_SERVICE_ADDR
            value: "https://82aa5f47-2d62-42f0-b54d-146b51bf5904.fwf.app"
          # Kong AI Gateway endpoint (in-cluster ClusterIP). Non-empty makes Kong
          # the DEFAULT chat backend (UI radio + handler default).
          # DISABLED 2026-06-08: the Kong AI route is broken ("no Route matched
          # with those values") which broke the default chat. Unset => chat
          # defaults to the working Zuplo / Akamai Functions lane
          # (SHOPPING_ASSISTANT_SERVICE_ADDR). Re-enable once the Kong ai-proxy
          # route is restored (deploy-kong.yml / kong-plugins.yml).
          # - name: SHOPPING_ASSISTANT_KONG_ADDR
          #   value: "http://kong-kong-proxy.kong.svc.cluster.local"
          # Akamai Firewall for AI (FAI) — screens the user prompt in front of
          # Kong on the "kong" chat lane. FAI_API_KEY comes from the
          # fai-credentials secret; optional=true so the frontend still rolls
          # out before the secret exists. While unset, faiScreen() is a no-op
          # (allow). Create the secret with:
          #   kubectl create secret generic fai-credentials \
          #     --from-literal=api-key=<KEY>
          - name: FAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: fai-credentials
                key: api-key
                optional: true
          - name: FAI_CONFIG_ID
            value: "1787"
          - name: FAI_APP_ID
            value: "akamai-store-chat"
          # Fail-open by default: if FAI errors (e.g. an inactive key → 401),
          # the chat still works. Set "true" to block on FAI errors instead.
          - name: FAI_FAIL_CLOSED
            value: "false"
          - name: ENV_PLATFORM
            value: "akamai"
          - name: ADMIN_USER
            valueFrom:
              secretKeyRef:
                name: frontend-admin-secret
                key: username
          - name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: frontend-admin-secret
                key: password
          - name: ENABLE_PROFILER
            value: "0"
          - name: ORDER_DB_DSN
            valueFrom:
              secretKeyRef:
                name: orders-db-credentials
                key: DSN
                optional: true
          # IMAGE_BASE_URL intentionally UNSET so product images are served
          # same-origin from the frontend container (/static/img/products/...)
          # through the NodeBalancer — this makes the store the image origin
          # for Akamai Image & Video Manager (IVM). Re-enable (point at the
          # Object Storage bucket) to go back to direct-from-bucket delivery.
          # - name: IMAGE_BASE_URL
          #   value: "https://akamai-boutique-img.jp-osa-1.linodeobjects.com"
          # - name: CYMBAL_BRANDING
          #   value: "true"
          # - name: ENABLE_ASSISTANT
          #   value: "true"
          # - name: FRONTEND_MESSAGE
          #   value: "Replace this with a message you want to display on all pages."
          # As part of an optional Google Cloud demo, you can run an optional microservice called the "packaging service".
          # - name: PACKAGING_SERVICE_URL
          #   value: "" # This value would look like "http://123.123.123"
          # valkey branch: read side of the best-seller ranking. REDIS_URL is
          # a rediss:// URL for Akamai Managed Valkey; when absent the ranking
          # section/page is simply omitted (optional=true).
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: valkey-credentials
                key: REDIS_URL
                optional: true
          - name: REDIS_CA_CERT_PATH
            value: "/etc/valkey-ca/ca.pem"
          volumeMounts:
          - name: valkey-ca-cert
            mountPath: /etc/valkey-ca
            readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
      - name: valkey-ca-cert
        secret:
          secretName: valkey-ca-cert
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  labels:
    app: frontend
  annotations:
    # Terminate TLS at the Linode NodeBalancer using the tserof-tls Secret
    # (fullchain + key from Let's Encrypt, issued via manual DNS-01 against
    # the Linode-managed tserof.net zone). The NB decrypts and forwards
    # plaintext HTTP to the frontend pods on 8080, same as port 80.
    service.beta.kubernetes.io/linode-loadbalancer-port-443: '{"tls-secret-name": "tserof-tls", "protocol": "https"}'
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: https
    port: 443
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
