# k6 — continuous load generator with Prometheus remote_write output.
#
# This is the ONLY load source actively running in the cluster.
# (loadgenerator.yaml deploys a Locust pod but it has not been kept
# healthy on this LKE setup; k6 replaces it.)
#
# Architecture:
#   k6 (10 VUs constant, 3 scenarios) -> frontend:80
#                                         |
#                                         v
#                                  microservices -> RabbitMQ
#       \-> remote_write -> prometheus:9090 -> Grafana (k6_* metrics)
#
# Sidecar injection disabled — LKE managed control plane cannot reach
# the Istio admission webhook for ClusterIP services.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: default
data:
  scenario.js: |
    // k6 scenarios for Akamai Store continuous load.
    //
    // Exercises every "demo-worthy" path in the app so all Grafana
    // panels stay populated:
    //
    //   browse    — / + /product/:id          (MongoDB reads, frontend RPS)
    //   shop      — /setCurrency + /cart      (currency svc, Redis writes)
    //   checkout  — full order placement      (payment, shipping, RabbitMQ,
    //                                          Postgres orders insert)
    //   chat      — /bot LLM chat             (Akamai Functions + LLM VM)
    //   orders    — /orders, /assistant       (light page traffic, Postgres reads)
    //
    // Product IDs AKMT001–AKMT027 are public; AKMT028/AKMT029 are admin-only
    // (seeded after deploy) and produce 404 on /product/:id for normal users
    // so we exclude them. The 8 currencies match the supported-currency
    // list compiled into currencyservice.
    import http from 'k6/http';
    import { check, sleep, group } from 'k6';
    import { Counter } from 'k6/metrics';
    import { randomIntBetween, randomItem } from 'https://jslib.k6.io/k6-utils/1.4.0/index.js';

    const FRONTEND = __ENV.FRONTEND_URL || 'http://frontend:80';

    const PRODUCTS = Array.from({ length: 27 }, (_, i) => `AKMT${String(i + 1).padStart(3, '0')}`);
    const CURRENCIES = ['USD', 'EUR', 'JPY', 'GBP', 'CAD', 'TRY', 'KRW', 'CNY'];
    const COUNTRIES = ['United States', 'Japan', 'United Kingdom', 'Germany', 'Canada'];
    const CHAT_PROMPTS = [
      'What gadgets do you have for hiking?',
      'I need a gift under $50 for a coffee lover.',
      'Show me electronics in stock.',
      'Recommend something for an outdoor camping trip.',
      'What headphones do you sell?',
      'I want to buy a watch — what do you recommend?',
    ];

    // Custom counter for end-to-end checkout success — easy to plot
    // alongside RabbitMQ queue depth.
    export const checkouts = new Counter('akamai_checkouts_total');
    export const chats = new Counter('akamai_chats_total');

    export const options = {
      scenarios: {
        browse: {
          executor: 'constant-vus',
          vus: 4,
          duration: '24h',
          exec: 'browse',
          tags: { scenario: 'browse' },
        },
        shop: {
          executor: 'constant-vus',
          vus: 3,
          duration: '24h',
          exec: 'shop',
          tags: { scenario: 'shop' },
          startTime: '5s',
        },
        checkout: {
          executor: 'constant-vus',
          vus: 3,
          duration: '24h',
          exec: 'checkout',
          tags: { scenario: 'checkout' },
          startTime: '10s',
        },
        chat: {
          // LLM is the most expensive backend — keep it light.
          executor: 'constant-vus',
          vus: 1,
          duration: '24h',
          exec: 'chat',
          tags: { scenario: 'chat' },
          startTime: '20s',
        },
        orders: {
          executor: 'constant-vus',
          vus: 1,
          duration: '24h',
          exec: 'orders',
          tags: { scenario: 'orders' },
          startTime: '15s',
        },
      },
      thresholds: {
        // Demo generator, not a smoke test — tolerate transient errors.
        'http_req_failed': ['rate<0.15'],
      },
      summaryTrendStats: ['avg', 'min', 'med', 'max', 'p(90)', 'p(95)', 'p(99)'],
    };

    // Per-VU session cookie jar so each user looks like a distinct browser.
    // (k6 maintains the cookie jar automatically per VU.)

    // ---- Scenarios -----------------------------------------------------

    export function browse() {
      group('home', () => {
        const r = http.get(`${FRONTEND}/`, { tags: { name: 'GET /' } });
        check(r, { 'home 200': (res) => res.status === 200 });
      });
      sleep(randomIntBetween(1, 3));

      group('product', () => {
        const p = randomItem(PRODUCTS);
        const r = http.get(`${FRONTEND}/product/${p}`, { tags: { name: 'GET /product/:id' } });
        check(r, { 'product 200': (res) => res.status === 200 });
      });
      sleep(randomIntBetween(1, 2));
    }

    export function shop() {
      // Visit home first so the session-id cookie is established and
      // cart writes attach to a stable user.
      http.get(`${FRONTEND}/`, { tags: { name: 'GET /' } });
      sleep(1);

      group('setCurrency', () => {
        http.post(
          `${FRONTEND}/setCurrency`,
          { currency_code: randomItem(CURRENCIES) },
          { tags: { name: 'POST /setCurrency' } },
        );
      });

      group('addToCart', () => {
        const p = randomItem(PRODUCTS);
        http.get(`${FRONTEND}/product/${p}`);
        const r = http.post(
          `${FRONTEND}/cart`,
          { product_id: p, quantity: String(randomIntBetween(1, 5)) },
          { tags: { name: 'POST /cart' } },
        );
        check(r, { 'addToCart ok': (res) => res.status === 200 || res.status === 302 });
      });

      group('viewCart', () => {
        const r = http.get(`${FRONTEND}/cart`, { tags: { name: 'GET /cart' } });
        check(r, { 'cart 200': (res) => res.status === 200 });
      });
      sleep(randomIntBetween(1, 3));
    }

    export function checkout() {
      // Build a small cart then place an order. Each successful checkout:
      //   - charges via paymentservice
      //   - books shipping via shippingservice
      //   - writes a row to orders DB (Linode Managed PG)
      //   - publishes an "order.placed" event to RabbitMQ (drained by queuemaster)
      http.get(`${FRONTEND}/`);

      const itemCount = randomIntBetween(1, 3);
      for (let i = 0; i < itemCount; i++) {
        const p = randomItem(PRODUCTS);
        http.get(`${FRONTEND}/product/${p}`);
        http.post(`${FRONTEND}/cart`, {
          product_id: p,
          quantity: String(randomIntBetween(1, 3)),
        });
      }

      const year = new Date().getFullYear() + 1;
      const r = http.post(
        `${FRONTEND}/cart/checkout`,
        {
          email: `k6-${__VU}-${__ITER}@example.com`,
          street_address: '123 Demo Street',
          zip_code: '94105',
          city: 'San Francisco',
          state: 'CA',
          country: randomItem(COUNTRIES),
          // Classic Visa test number — paymentservice rejects Visa Electron
          // BINs (4026/4508/4844/4913/4917) so we hardcode this safe one.
          credit_card_number: '4111111111111111',
          credit_card_expiration_month: '1',
          credit_card_expiration_year: String(year),
          credit_card_cvv: '672',
        },
        { tags: { name: 'POST /cart/checkout' } },
      );

      if (check(r, { 'checkout 200': (res) => res.status === 200 })) {
        checkouts.add(1);
      }
      sleep(randomIntBetween(2, 5));
    }

    export function chat() {
      // /bot expects {"message":"...","history":[...]} JSON. Most LLM calls
      // take a few seconds so this scenario naturally rate-limits itself.
      const body = JSON.stringify({
        message: randomItem(CHAT_PROMPTS),
        history: [],
      });
      const r = http.post(`${FRONTEND}/bot`, body, {
        headers: { 'Content-Type': 'application/json' },
        tags: { name: 'POST /bot' },
        timeout: '60s',
      });
      if (check(r, { 'chat 200': (res) => res.status === 200 })) {
        chats.add(1);
      }
      sleep(randomIntBetween(5, 15));
    }

    export function orders() {
      // Light traffic on read-only pages: assistant landing + order history.
      // Touches the Postgres orders table on /orders.
      http.get(`${FRONTEND}/assistant`, { tags: { name: 'GET /assistant' } });
      sleep(randomIntBetween(2, 5));
      http.get(`${FRONTEND}/orders`, { tags: { name: 'GET /orders' } });
      sleep(randomIntBetween(5, 10));
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6
  labels:
    app: k6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k6
  template:
    metadata:
      labels:
        app: k6
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: k6
      restartPolicy: Always
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      initContainers:
        # Wait for frontend so k6 doesn't start hammering 5xx errors
        # while microservices are still rolling.
        - name: wait-frontend
          image: busybox:1.36
          command:
            - /bin/sh
            - -exc
            - |
              for i in $(seq 1 30); do
                wget -q --timeout=3 -O - http://frontend:80/_healthz >/dev/null && exit 0
                sleep 5
              done
              echo "frontend never came up"; exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
      containers:
        - name: k6
          image: grafana/k6:0.51.0
          # `k6 run` blocks on duration: 24h in scenarios, so the pod
          # stays alive for the full day; Kubernetes will replace it
          # daily on its own via the rolling restart annotation below
          # (or whenever the ConfigMap changes).
          args:
            - run
            - --out
            - experimental-prometheus-rw
            - --tag
            - testid=akamai-store-continuous
            - /scripts/scenario.js
          env:
            - name: FRONTEND_URL
              value: "http://frontend:80"
            # remote_write endpoint exposed by Prometheus when started
            # with --web.enable-remote-write-receiver.
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: "p(95),p(99),min,max,avg"
            # Optionally export trend metrics as native histograms for
            # higher-resolution latency queries in Grafana.
            - name: K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM
              value: "true"
            - name: K6_NO_SUMMARY
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: script
          configMap:
            name: k6-script
