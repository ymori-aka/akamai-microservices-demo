# Kong Gateway (OSS, dbless) Helm values for the LKE cluster.
#
# Phase 1 goals:
#   - Bring Kong up isolated in the `kong` namespace.
#   - Internal-only (ClusterIP) so production traffic is unaffected.
#   - Declarative config sourced from the kong-dbless-config ConfigMap
#     (currently empty; Phase 2 adds the ai-proxy route/plugin).
#
# Why OSS Kong (not Konnect) at this stage: lets us validate the data plane
# and AI plugins without provisioning a Konnect control plane first. Konnect
# can be added later by adding cluster_control_plane env + cert/key.

# Use the chart's default Kong image so we don't pin to a tag that may not
# exist on hub (the previous "3.8" pin can resolve to "not found").
# image: {}

# dbless mode
env:
  database: "off"
  # NOTE: do NOT set declarative_config here. When dblessConfig.config is used,
  # the chart renders its own ConfigMap, mounts it at /kong/declarative/kong.yaml
  # and sets KONG_DECLARATIVE_CONFIG automatically. Setting it manually while the
  # external ConfigMap failed to mount caused: "kong.yaml: No such file or directory".
  # Bundled plugins include ai-proxy / ai-prompt-guard / ai-rate-limiting-advanced
  # since Kong 3.6. Explicit "bundled" keeps defaults; add more here as needed.
  plugins: bundled

# Inline declarative config (chart-managed ConfigMap + mount). Phase 1 = empty
# stub so Kong starts cleanly. Phase 2 adds services/routes/ai-proxy plugin here.
dblessConfig:
  # NOTE: chart expects this as a STRING (the literal kong.yaml content), not a
  # YAML map — passing a map fails helm templating with
  # "wrong type for value; expected string; got map".
  config: |
    _format_version: "3.0"

ingressController:
  enabled: false  # no IC for now; we drive routes via declarative config

proxy:
  enabled: true
  type: ClusterIP        # internal only in Phase 1
  http:
    enabled: true
    servicePort: 80
    containerPort: 8000
  tls:
    enabled: false

admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001
    containerPort: 8001

manager:    { enabled: false }
portal:     { enabled: false }
status:     { enabled: true }
serviceMonitor: { enabled: false }

resources:
  requests: { cpu: "50m",  memory: "256Mi" }
  limits:   { cpu: "1",    memory: "1Gi"   }

# Pod security: satisfy restricted PSS if enforced.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
