# Kong Gateway (OSS, dbless) Helm values for the LKE cluster.
#
# Phase 1 goals:
#   - Bring Kong up isolated in the `kong` namespace.
#   - Internal-only (ClusterIP) so production traffic is unaffected.
#   - Declarative config sourced from the kong-dbless-config ConfigMap
#     (currently empty; Phase 2 adds the ai-proxy route/plugin).
#
# Why OSS Kong (not Konnect) at this stage: lets us validate the data plane
# and AI plugins without provisioning a Konnect control plane first. Konnect
# can be added later by adding cluster_control_plane env + cert/key.

# Use the chart's default Kong image so we don't pin to a tag that may not
# exist on hub (the previous "3.8" pin can resolve to "not found").
# image: {}

# dbless mode
env:
  database: "off"
  # NOTE: do NOT set declarative_config here. When dblessConfig.config is used,
  # the chart renders its own ConfigMap, mounts it at /kong/declarative/kong.yaml
  # and sets KONG_DECLARATIVE_CONFIG automatically. Setting it manually while the
  # external ConfigMap failed to mount caused: "kong.yaml: No such file or directory".
  # Bundled plugins include ai-proxy / ai-prompt-guard / ai-rate-limiting-advanced
  # since Kong 3.6. Explicit "bundled" keeps defaults; add more here as needed.
  plugins: bundled

# Inline declarative config (chart-managed ConfigMap + mount). Phase 1 = empty
# stub so Kong starts cleanly. Phase 2 adds services/routes/ai-proxy plugin here.
dblessConfig:
  # NOTE: chart expects this as a STRING (the literal kong.yaml content), not a
  # YAML map — passing a map fails helm templating with
  # "wrong type for value; expected string; got map".
  #
  # Phase 2: one service/route fronting the self-hosted Gemma LLM
  # (172.238.48.187:8000, OpenAI-compatible llama.cpp server, same backend the
  # Spin/Zuplo path uses). The ai-proxy plugin makes the route speak the OpenAI
  # chat API and forwards to the upstream. provider=openai + upstream_url lets us
  # point at a self-hosted OpenAI-compatible endpoint instead of api.openai.com.
  # No auth block: the llama.cpp server requires no API key.
  config: |
    _format_version: "3.0"
    services:
      - name: gemma-llm
        url: http://172.238.48.187:8000
        routes:
          - name: openai-chat
            paths:
              - /v1/chat/completions
            strip_path: false
            methods:
              - POST
            plugins:
              # Phase 3a: AI Firewall. Inspect the user prompt and reject
              # (HTTP 400) anything that looks like a credit-card / PII leak or
              # a prompt-injection ("ignore previous instructions") attempt
              # BEFORE it reaches the LLM. deny_patterns are PCRE regexes; only
              # `user` role messages are checked (match_all_roles=false) so the
              # catalog system prompt never trips a rule.
              - name: ai-prompt-guard
                config:
                  match_all_roles: false
                  allow_all_conversation_history: true
                  deny_patterns:
                    # 13-16 digit card numbers (optionally space/dash grouped)
                    - "[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{1,4}"
                    # US SSN
                    - "[0-9]{3}-[0-9]{2}-[0-9]{4}"
                    # Prompt-injection / jailbreak phrasings
                    - "(?i)ignore (all |any )?(previous|prior|above) (instructions|prompts|rules)"
                    - "(?i)disregard (the |all )?(previous|prior|above|system)"
                    - "(?i)reveal (your |the )?(system )?prompt"
              # Phase 3b: abuse protection. OSS Kong only offers request-based
              # rate limiting (token-based ai-rate-limiting-advanced is an
              # Enterprise plugin, not present in this image). 30 req/min per
              # client IP, counted node-local (dbless can't use the cluster
              # policy). Returns HTTP 429 once exceeded.
              - name: rate-limiting
                config:
                  minute: 30
                  policy: local
                  limit_by: ip
                  error_message: "AI gateway rate limit exceeded — slow down."
        plugins:
          - name: ai-proxy
            config:
              route_type: "llm/v1/chat"
              model:
                provider: openai
                name: google_gemma-4-26B-A4B-it-Q4_K_M.gguf
                options:
                  upstream_url: http://172.238.48.187:8000/v1/chat/completions

ingressController:
  enabled: false  # no IC for now; we drive routes via declarative config

proxy:
  enabled: true
  type: ClusterIP        # internal only in Phase 1
  http:
    enabled: true
    servicePort: 80
    containerPort: 8000
  tls:
    enabled: false

admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001
    containerPort: 8001

manager:    { enabled: false }
portal:     { enabled: false }
status:     { enabled: true }
serviceMonitor: { enabled: false }

resources:
  requests: { cpu: "50m",  memory: "256Mi" }
  limits:   { cpu: "1",    memory: "1Gi"   }

# Phase 1 uses an EMPTY declarative config. Kong's default readiness probe
# (/status/ready) intentionally reports NOT ready when there are no
# services/routes ("no configuration available"), which would pin the pod at
# 0/1 forever. Point readiness at /status (always 200 once Kong is up) so the
# empty stub becomes Ready. Phase 2 adds real routes; can revert to
# /status/ready then if we want strict proxy-readiness gating.
readinessProbe:
  httpGet:
    path: /status
    port: status
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Pod security: satisfy restricted PSS if enforced.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
