apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  labels:
    app: loadgenerator
spec:
  selector:
    matchLabels:
      app: loadgenerator
  replicas: 1
  template:
    metadata:
      labels:
        app: loadgenerator
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: loadgenerator
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - command:
        - /bin/sh
        - -exc
        - |
          MAX_RETRIES=12
          RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Pinging frontend: ${FRONTEND_ADDR}..."
            STATUSCODE=$(wget --server-response http://${FRONTEND_ADDR} 2>&1 | awk '/^  HTTP/{print $2}')
            if [ $STATUSCODE -eq 200 ]; then
                echo "Frontend is reachable."
                exit 0
            fi
            echo "Error: Could not reach frontend - Status code: ${STATUSCODE}"
            sleep $RETRY_INTERVAL
          done
          echo "Failed to reach frontend after $MAX_RETRIES attempts."
          exit 1
        name: frontend-check
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: busybox:latest
        env:
        - name: FRONTEND_ADDR
          value: "frontend:80"
      containers:
      - name: main
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: loadgenerator
        env:
        - name: FRONTEND_ADDR
          value: "frontend:80"
        # Constant baseline load:
        #   15 simulated users + 3/s spawn = full ramp in ~5s
        #   tight wait_time (1-3s) keeps Prometheus rates non-zero
        #   higher checkout weight ensures RabbitMQ events flow continuously
        - name: USERS
          value: "15"
        - name: RATE
          value: "3"
        # Replace the image's bundled locustfile (which targets the
        # upstream Google sample product IDs and 404s against the
        # Akamai-themed catalog) with one that uses our AKMT* SKUs.
        volumeMounts:
        - name: locust
          mountPath: /loadgen/locustfile.py
          subPath: locustfile.py
          readOnly: true
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: locust
        configMap:
          name: loadgenerator-locust
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgenerator-locust
  labels:
    app: loadgenerator
data:
  locustfile.py: |
    # Akamai-themed locust scenarios. Product IDs are AKMT001..AKMT029
    # and match the MongoDB-backed productcatalogservice.
    import datetime
    import random
    from locust import HttpUser, TaskSet, between
    from faker import Faker

    fake = Faker()

    products = [f"AKMT{n:03d}" for n in range(1, 30)]
    currencies = ["EUR", "USD", "JPY", "CAD", "GBP", "TRY", "KRW", "CNY"]

    def index(l):
        l.client.get("/")

    def setCurrency(l):
        l.client.post("/setCurrency", {"currency_code": random.choice(currencies)})

    def browseProduct(l):
        l.client.get("/product/" + random.choice(products))

    def viewCart(l):
        l.client.get("/cart")

    def addToCart(l):
        product = random.choice(products)
        l.client.get("/product/" + product)
        l.client.post("/cart", {
            "product_id": product,
            "quantity": random.randint(1, 10),
        })

    def empty_cart(l):
        l.client.post("/cart/empty")

    def checkout(l):
        addToCart(l)
        current_year = datetime.datetime.now().year + 1
        l.client.post("/cart/checkout", {
            "email": fake.email(),
            "street_address": fake.street_address(),
            "zip_code": fake.zipcode()[:5],
            "city": fake.city(),
            "state": fake.state_abbr(),
            "country": "United States",
            # Classic Visa test number (Luhn-valid, not Visa Electron).
            # Faker's card_type="visa" can return Electron BINs
            # (4026 / 4508 / 4844 / 4913 / 4917) which paymentservice
            # rejects as "we cannot process visa_electron credit cards".
            "credit_card_number": "4111111111111111",
            "credit_card_expiration_month": "1",
            "credit_card_expiration_year": str(current_year),
            "credit_card_cvv": "672",
        })

    class UserBehavior(TaskSet):
        def on_start(self):
            index(self)

        # Weights tuned for steady metrics:
        #   - browseProduct dominant (catalogue traffic, mongodb queries)
        #   - addToCart frequent (Redis writes)
        #   - checkout weight bumped to 3 so RabbitMQ events flow at ~3-6/min
        #     per simulated user instead of trickle
        tasks = {
            index: 2,
            setCurrency: 1,
            browseProduct: 8,
            addToCart: 4,
            viewCart: 3,
            checkout: 3,
        }

    class WebsiteUser(HttpUser):
        tasks = [UserBehavior]
        # Tight wait_time = constant throughput. With 15 users at 1-3s
        # wait, expect ~5-15 req/s across the cluster — enough to keep
        # all Prometheus rate(...) panels populated.
        wait_time = between(1, 3)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgenerator
