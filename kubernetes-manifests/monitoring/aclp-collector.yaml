---
# Akamai Cloud Pulse Collector (aclp-collector)
# Pulls metrics from Akamai's monitoring API and re-exposes them as a
# Prometheus scrape endpoint. Currently collecting: dbaas, nodebalancer.
#
# Auth: requires a Linode Personal Access Token stored in the K8s Secret
# `linode-pat` (key=TOKEN). CI creates this Secret from the LINODE_PAT
# GitHub Secret.
#
# IMPORTANT — use a NON-EXPIRING, least-privilege token to avoid the
# recurring "PostgreSQL/NodeBalancer panels go blank" incident, which was
# caused by the PAT expiring -> 401 Unauthorized from Cloud Pulse.
# Current token (id 70533131, label "aclp-collector-permanent"):
#   scopes: databases:read_only monitor:read_only nodebalancers:read_only
#           object_storage:read_only
#   expiry: 2999-12-31 (effectively never)
# Detection: Prometheus alert AclpDbaasMetricsMissing (prometheus-rules.yaml).
# Recovery: refresh LINODE_PAT GitHub Secret, run fix-aclp-collector.yml.
#
# NodeBalancer metrics: ENABLED (Akamai confirmed access 2026-05-17).

apiVersion: v1
kind: ConfigMap
metadata:
  name: aclp-collector-config
  namespace: monitoring
data:
  config.yaml: |
    # OpenTelemetry Collector config (Akamai distribution adds the
    # `aclp` receiver). Polls every 5 minutes; export everything as
    # Prometheus metrics on :9464/metrics.
    receivers:
      akamaicloudpulsereceiver:
        PAT: ${env:LINODE_API_TOKEN}
        polling_interval: 5m
        services:
          - service_type: dbaas
            # Linode Managed PostgreSQL clusters:
            #   470692 = MicroserviceDB    (jp-osa, legacy/parallel)
            #   481207 = MicroserviceDB-tyo (jp-tyo-3, migration ④)
            entity_ids: [470692, 481207]
            agg_function: avg
            metric_names:
              - cpu_usage
              - memory_usage
              - disk_usage
              - read_iops
              - write_iops

          - service_type: nodebalancer
            # NLBs: jp-osa: 2154313, 2170616, 2187125; jp-tyo-3: 2154174;
            # standalone WP-OSA1: 2001057.
            # All traffic-rate metrics only support agg_function=sum.
            entity_ids: [2001057, 2154174, 2154313, 2170616, 2187125]
            agg_function: sum
            metric_names:
              - nb_ingress_traffic_rate
              - nb_egress_traffic_rate
              - nb_ingress_tcp_traffic_rate
              - nb_egress_tcp_traffic_rate
              - nb_ingress_udp_traffic_rate
              - nb_egress_udp_traffic_rate
              - nb_total_active_sessions
              - nb_active_tcp_sessions
              - nb_active_udp_sessions
              - nb_new_sessions_per_second
              - nb_new_tcp_sessions_per_second
              - nb_new_udp_sessions_per_second
              - nb_total_active_backends
              - nb_active_tcp_backends
              - nb_active_udp_backends

          # objectstorage: jp-tyo-3 (E3) supports Object Storage Cloud Pulse
          # (jp-osa E1 does not). entity_regions/group_by is the correct schema
          # per Akamai docs; the 1.6.0-docker image (below) accepts it (the old
          # ':latest' build rejected the keys). Scoped to jp-tyo-3 so the
          # unsupported jp-osa region can't error the receiver.
          - service_type: objectstorage
            entity_regions: ["jp-tyo-3"]
            agg_function: sum
            group_by: ["entity_id"]
            metric_names:
              - obj_bucket_size
              - obj_bucket_num_objects
              - obj_bytes_uploaded
              - obj_bytes_downloaded
              - obj_egress_throughput
              - obj_ingress_throughput
              - obj_ttfb_average
              - obj_requests_num
              - obj_requests_get
              - obj_requests_put
              - obj_requests_delete
              - obj_responses_2xx
              - obj_responses_4xx
              - obj_responses_5xx

    processors:
      batch: {}

    exporters:
      prometheus:
        endpoint: 0.0.0.0:9464
        # Strip the otel namespace prefix so labels stay readable.
        resource_to_telemetry_conversion:
          enabled: true

    service:
      telemetry:
        logs:
          level: info
      pipelines:
        metrics:
          receivers: [akamaicloudpulsereceiver]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aclp-collector
  namespace: monitoring
  labels:
    app: aclp-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aclp-collector
  template:
    metadata:
      labels:
        app: aclp-collector
    spec:
      containers:
        - name: collector
          # ':latest' is the known-runnable image (dbaas + nodebalancer work).
          # The '1.6.0' tag gives RunContainerError, so we stay on :latest with
          # objectstorage disabled above until a runnable newer image is found.
          # 1.6.0-docker = the runnable container build that accepts the
          # objectstorage schema (entity_regions/group_by). ':latest' is older
          # and rejects those keys; the plain '1.6.0' tag is not a runnable
          # image (RunContainerError).
          image: linode/aclp-collector:1.6.0-docker
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/aclp/config.yaml"]
          env:
            - name: LINODE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: linode-pat
                  key: TOKEN
          ports:
            - name: metrics
              containerPort: 9464
          volumeMounts:
            - name: config
              mountPath: /etc/aclp
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: aclp-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: aclp-collector
  namespace: monitoring
  labels:
    app: aclp-collector
spec:
  type: ClusterIP
  selector:
    app: aclp-collector
  ports:
    - name: metrics
      port: 9464
      targetPort: 9464
