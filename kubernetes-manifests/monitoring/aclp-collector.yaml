---
# Akamai Cloud Pulse Collector (aclp-collector)
# Pulls metrics from Akamai's monitoring API and re-exposes them as a
# Prometheus scrape endpoint. Currently collecting: dbaas, objectstorage.
#
# Auth: requires a Linode Personal Access Token with Monitor:Read and
# Databases:Read permissions, stored in the K8s Secret `linode-pat`
# (key=TOKEN). CI creates this Secret from the LINODE_PAT GitHub Secret.
#
# NodeBalancer metrics: still pending account-level enablement (support
# ticket opened 2026-05-15). Uncomment the nodebalancer block below once
# Akamai confirms access.

apiVersion: v1
kind: ConfigMap
metadata:
  name: aclp-collector-config
  namespace: monitoring
data:
  config.yaml: |
    # OpenTelemetry Collector config (Akamai distribution adds the
    # `aclp` receiver). Polls every 5 minutes; export everything as
    # Prometheus metrics on :9464/metrics.
    receivers:
      akamaicloudpulsereceiver:
        PAT: ${env:LINODE_API_TOKEN}
        polling_interval: 5m
        services:
          - service_type: dbaas
            # Linode Managed PostgreSQL cluster: a470692-akamai-prod...
            entity_ids: [470692]
            agg_function: avg
            metric_names:
              - cpu_usage
              - memory_usage
              - disk_usage
              - read_iops
              - write_iops

          # - service_type: nodebalancer
          #   # Uncomment when Akamai enables NB metrics for this account.
          #   # NLBs: jp-osa: 2154313, 2170616, 2187125; jp-tyo-3: 2154174;
          #   # standalone WP-OSA1: 2001057.
          #   # All traffic-rate metrics only support agg_function=sum.
          #   entity_ids: [2001057, 2154174, 2154313, 2170616, 2187125]
          #   agg_function: sum
          #   metric_names:
          #     - nb_ingress_traffic_rate
          #     - nb_egress_traffic_rate
          #     - nb_total_active_sessions
          #     - nb_new_sessions_per_second
          #     - nb_total_active_backends

          - service_type: objectstorage
            # Buckets in jp-osa (akamai-boutique-img, akamai-handson1, bm-test1)
            # and jp-tyo-3 (loki, thanos, velero, tokyo-test1).
            # Object Storage uses entity_regions instead of entity_ids.
            # Akamai support enabled this 2026-05-14.
            entity_regions: ["jp-osa", "jp-tyo-3"]
            agg_function: sum
            metric_names:
              - obj_bucket_size
              - obj_bucket_num_objects
              - obj_egress_throughput
              - obj_ingress_throughput
              - obj_responses_5xx

    processors:
      batch: {}

    exporters:
      prometheus:
        endpoint: 0.0.0.0:9464
        # Strip the otel namespace prefix so labels stay readable.
        resource_to_telemetry_conversion:
          enabled: true

    service:
      telemetry:
        logs:
          level: info
      pipelines:
        metrics:
          receivers: [akamaicloudpulsereceiver]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aclp-collector
  namespace: monitoring
  labels:
    app: aclp-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aclp-collector
  template:
    metadata:
      labels:
        app: aclp-collector
    spec:
      containers:
        - name: collector
          image: linode/aclp-collector:latest
          imagePullPolicy: Always
          args: ["--config=/etc/aclp/config.yaml"]
          env:
            - name: LINODE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: linode-pat
                  key: TOKEN
          ports:
            - name: metrics
              containerPort: 9464
          volumeMounts:
            - name: config
              mountPath: /etc/aclp
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: aclp-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: aclp-collector
  namespace: monitoring
  labels:
    app: aclp-collector
spec:
  type: ClusterIP
  selector:
    app: aclp-collector
  ports:
    - name: metrics
      port: 9464
      targetPort: 9464
