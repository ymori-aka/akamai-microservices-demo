          "fieldConfig": { "defaults": { "unit": "short", "noValue": "0", "thresholds": { "steps": [{"color":"green","value":0},{"color":"red","value":1}] } } }
        },

        {
          "id": 45, "type": "timeseries", "title": "Span Throughput",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 62 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "rate(otelcol_receiver_accepted_spans{job=\"otel-collector-internal\"}[1m]) * 60", "legendFormat": "received", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
