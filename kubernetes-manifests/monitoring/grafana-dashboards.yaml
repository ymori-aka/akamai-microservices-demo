          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 1, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean","max"] } }
        },

        {
          "id": 12, "type": "timeseries", "title": "Container Memory Usage by Service",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"default\",container!=\"\",container!=\"POD\"})", "legendFormat": "{{pod}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 1, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean","max"] } }
        },

        {
          "id": 13, "type": "timeseries", "title": "Node CPU Usage",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))", "legendFormat": "{{instance}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "lineWidth": 2, "fillOpacity": 15 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },

        {
          "id": 14, "type": "timeseries", "title": "Node Memory Usage",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "memory used", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "lineWidth": 2, "fillOpacity": 15 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },

        {
          "id": 15, "type": "timeseries", "title": "Node Network I/O",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum(rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cali.*|flannel.*\"}[1m]))", "legendFormat": "rx", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "sum(rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cali.*|flannel.*\"}[1m]))", "legendFormat": "tx", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
