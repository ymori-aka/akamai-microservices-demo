  service-graph.json: |
    {
      "title": "Service Graph (topology)",
      "uid": "service-graph",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "tags": ["topology", "tracing"],
      "style": "dark",
      "panels": [
        { "id": 100, "type": "text",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 3 },
          "options": { "mode": "html", "content": "<div style=\"display:flex;align-items:center;padding:8px 16px;background:linear-gradient(90deg,#0099ff 0%,#1a4dff 60%,#7700ff 100%);border-radius:6px;color:white;font-family:-apple-system,'Inter',sans-serif;\"><div><div style=\"font-size:22px;font-weight:700;\">Service Graph</div><div style=\"opacity:0.85;font-size:12px;margin-top:2px;\">Derived from Tempo service-graph metrics (traces_service_graph_*) - same data as the Vizceral map</div></div></div>" } },

        { "id": 1, "type": "nodeGraph", "title": "Service topology (Tempo service graph)",
          "gridPos": { "x": 0, "y": 3, "w": 24, "h": 14 },
          "datasource": { "type": "tempo", "uid": "tempo-uid" },
          "targets": [ { "queryType": "serviceMap", "datasource": { "type": "tempo", "uid": "tempo-uid" } } ] },

        { "id": 2, "type": "table", "title": "Edges - requests/sec (client to server)",
          "gridPos": { "x": 0, "y": 17, "w": 12, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [ { "expr": "sum by (client, server) (rate(traces_service_graph_request_total[1m]))", "format": "table", "instant": true, "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } } ],
          "transformations": [ { "id": "organize", "options": { "excludeByName": { "Time": true } } } ],
          "fieldConfig": { "defaults": { "decimals": 2, "custom": { "align": "auto" } } } },

        { "id": 3, "type": "table", "title": "Edges - failed requests/sec (errors)",
          "gridPos": { "x": 12, "y": 17, "w": 12, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [ { "expr": "sum by (client, server) (rate(traces_service_graph_request_failed_total[1m]))", "format": "table", "instant": true, "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } } ],
          "transformations": [ { "id": "organize", "options": { "excludeByName": { "Time": true } } } ],
          "fieldConfig": { "defaults": { "decimals": 2, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.01 } ] } } } }
      ]
    }
