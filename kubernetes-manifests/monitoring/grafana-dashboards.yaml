          "targets": [{ "expr": "rate(otelcol_exporter_sent_spans{job=\"otel-collector-internal\",exporter=\"otlp/tempo\"}[1m]) * 60", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "steps": [{"color":"green","value":0}] } } }
