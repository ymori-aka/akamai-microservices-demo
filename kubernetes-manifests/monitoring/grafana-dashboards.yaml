apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  microservices.json: |
    {
      "title": "Akamai Store - Operations",
      "uid": "akamai-ops",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
            "query": "label_values(kube_pod_info{namespace=\"default\"}, created_by_name)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [

        {
          "id": 1, "type": "stat", "title": "Running Pods",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"default\",phase=\"Running\"} == 1) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{"color":"red","value":0},{"color":"yellow","value":6},{"color":"green","value":10}] } } }
        },

        {
          "id": 2, "type": "stat", "title": "Redis Clients",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "redis_connected_clients{job=\"redis\"}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{"color":"green","value":0}] } } }
        },

        {
          "id": 3, "type": "stat", "title": "Redis Memory",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "redis_memory_used_bytes{job=\"redis\"}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "bytes", "thresholds": { "steps": [{"color":"green","value":0},{"color":"yellow","value":50000000},{"color":"red","value":200000000}] } } }
        },

        {
          "id": 4, "type": "stat", "title": "Pod Restarts (1h)",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"default\"}[1h])) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{"color":"green","value":0},{"color":"yellow","value":1},{"color":"red","value":5}] } } }
        },

        {
          "id": 5, "type": "stat", "title": "Error Logs (1h)",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "sum(count_over_time({namespace=\"default\"} |~ `(?i)(error|panic|fatal)` [1h]))", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{"color":"green","value":0},{"color":"yellow","value":10},{"color":"red","value":50}] } } }
        },

        {
          "id": 6, "type": "stat", "title": "Log Lines/min",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "sum(rate({namespace=\"default\"}[1m])) * 60", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "steps": [{"color":"green","value":0}] } } }
        },

        {
          "id": 10, "type": "row", "title": "Infrastructure",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 4 },
          "collapsed": false
        },

        {
          "id": 11, "type": "timeseries", "title": "Container CPU Usage by Service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"default\",container!=\"\",container!=\"POD\"}[2m]))", "legendFormat": "{{pod}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 1, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean","max"] } }
        },

        {
          "id": 12, "type": "timeseries", "title": "Container Memory Usage by Service",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"default\",container!=\"\",container!=\"POD\"})", "legendFormat": "{{pod}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 1, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean","max"] } }
        },

        {
          "id": 13, "type": "timeseries", "title": "Node CPU Usage",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))", "legendFormat": "{{instance}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "lineWidth": 2, "fillOpacity": 15 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },

        {
          "id": 14, "type": "timeseries", "title": "Node Memory Usage",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "memory used", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "lineWidth": 2, "fillOpacity": 15 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },

        {
          "id": 15, "type": "timeseries", "title": "Node Network I/O",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum(rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cali.*|flannel.*\"}[1m]))", "legendFormat": "rx", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "sum(rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cali.*|flannel.*\"}[1m]))", "legendFormat": "tx", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },

        {
          "id": 20, "type": "row", "title": "Redis",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 },
          "collapsed": false
        },

        {
          "id": 21, "type": "timeseries", "title": "Redis Commands/sec",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 22 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "rate(redis_commands_processed_total{job=\"redis\"}[1m])", "legendFormat": "cmds/s", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 20 } } }
        },

        {
          "id": 22, "type": "timeseries", "title": "Redis Hit / Miss Rate",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 22 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "rate(redis_keyspace_hits_total{job=\"redis\"}[1m])", "legendFormat": "hits/s", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "rate(redis_keyspace_misses_total{job=\"redis\"}[1m])", "legendFormat": "misses/s", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },

        {
          "id": 23, "type": "timeseries", "title": "Redis Memory",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 22 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "redis_memory_used_bytes{job=\"redis\"}", "legendFormat": "used", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "redis_memory_max_bytes{job=\"redis\"}", "legendFormat": "max", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },

        {
          "id": 30, "type": "row", "title": "Logs",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 29 },
          "collapsed": false
        },

        {
          "id": 31, "type": "timeseries", "title": "Log Volume by Service",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 30 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "sum by (app) (rate({namespace=\"default\"}[1m]))", "legendFormat": "{{app}}", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 1, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean"] } }
        },

        {
          "id": 32, "type": "timeseries", "title": "Error / Warn Log Rate by Service",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 30 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            { "expr": "sum by (app) (rate({namespace=\"default\"} |~ `(?i)error` [1m]))", "legendFormat": "error: {{app}}", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } },
            { "expr": "sum by (app) (rate({namespace=\"default\"} |~ `(?i)warn` [1m]))", "legendFormat": "warn: {{app}}", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 1 } } },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" } }
        },

        {
          "id": 33, "type": "logs", "title": "Recent Application Logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 37 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "{namespace=\"default\"}", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "prettifyLogMessage": false
          }
        },

        {
          "id": 34, "type": "logs", "title": "Errors & Warnings",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 47 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "{namespace=\"default\"} |~ `(?i)(error|warn|panic|fatal)`", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "prettifyLogMessage": false
          }
        }

      ]
    }
