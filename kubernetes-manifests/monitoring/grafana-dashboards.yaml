apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  microservices.json: |
    {
      "title": "Akamai Store - Microservices Overview",
      "uid": "akamai-microservices",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "type": "stat", "title": "Running Pods",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"default\",phase=\"Running\"} == 1) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "thresholds": { "steps": [{"color":"red","value":0},{"color":"yellow","value":5},{"color":"green","value":8}] } }
        },
        {
          "id": 2, "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "type": "stat", "title": "Redis Connected Clients",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "redis_connected_clients{job=\"redis\"}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background" }
        },
        {
          "id": 3, "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "type": "stat", "title": "Redis Memory Used",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "redis_memory_used_bytes{job=\"redis\"}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "unit": "bytes" }
        },
        {
          "id": 4, "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "type": "stat", "title": "Pod Restarts (1h)",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"default\"}[1h]))", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "thresholds": { "steps": [{"color":"green","value":0},{"color":"yellow","value":1},{"color":"red","value":5}] } }
        },
        {
          "id": 5, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "type": "timeseries", "title": "Container CPU Usage by Service",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"default\", container!=\"\", container!=\"POD\"}[1m]))", "legendFormat": "{{pod}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "short" } },
          "options": { "tooltip": { "mode": "multi" } }
        },
        {
          "id": 6, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "type": "timeseries", "title": "Container Memory Usage by Service",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"default\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 7, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "type": "timeseries", "title": "Redis Commands/sec",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "rate(redis_commands_processed_total{job=\"redis\"}[1m])", "legendFormat": "commands/s", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }]
        },
        {
          "id": 8, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "type": "timeseries", "title": "Redis Hit Rate",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "rate(redis_keyspace_hits_total{job=\"redis\"}[1m])", "legendFormat": "hits/s", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "rate(redis_keyspace_misses_total{job=\"redis\"}[1m])", "legendFormat": "misses/s", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ]
        },
        {
          "id": 9, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "type": "timeseries", "title": "Node CPU Usage",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))", "legendFormat": "{{instance}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1 } }
        },
        {
          "id": 10, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "type": "timeseries", "title": "Node Memory Usage",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "memory used %", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1 } }
        }
      ]
    }
