apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  home.json: |
    {
      "title": "Akamai Store - Home",
      "uid": "akamai-home",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["overview"],
      "style": "dark",
      "graphTooltip": 1,
      "templating": { "list": [
        { "name": "audit_q", "type": "textbox", "label": "Audit filter (regex)", "query": "", "current": { "text": "", "value": "" }, "hide": 0 }
      ] },
      "links": [
        { "title": "Operations", "type": "link", "url": "/d/akamai-microservices", "icon": "dashboard", "targetBlank": false, "tooltip": "Service-level deep dive" },
        { "title": "Infrastructure & LLM", "type": "link", "url": "/d/akamai-infrastructure", "icon": "dashboard", "targetBlank": false, "tooltip": "DB, NodeBalancer, LLM detail" },
        { "title": "Service Graph", "type": "link", "url": "/d/service-graph", "icon": "dashboard", "targetBlank": false, "tooltip": "Tempo service map + edges" },
        { "title": "Store", "type": "link", "url": "http://172.237.1.139/", "icon": "external link", "targetBlank": true, "tooltip": "Open the live storefront" },
        { "title": "Kiali", "type": "link", "url": "http://172.237.1.202:20001/", "icon": "external link", "targetBlank": true, "tooltip": "Istio ambient mesh graph" },
        { "title": "Vizceral", "type": "link", "url": "http://172.237.3.207/", "icon": "external link", "targetBlank": true, "tooltip": "Netflix-style animated traffic map" },
        { "title": "promviz", "type": "link", "url": "http://172.237.3.193/", "icon": "external link", "targetBlank": true, "tooltip": "Prometheus -> Vizceral bridge UI" }
      ],
      "panels": [
        { "id": 100, "type": "text",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 3 },
          "options": { "mode": "html", "content": "<div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:linear-gradient(90deg,#0099ff 0%,#1a4dff 60%,#7700ff 100%);border-radius:6px;color:white;font-family:-apple-system,'Inter',sans-serif;\"><div><div style=\"font-size:22px;font-weight:700;letter-spacing:-0.4px;\">Akamai Store</div><div style=\"opacity:0.85;font-size:12px;margin-top:2px;\">Live operations overview • LKE jp-tyo-3 • refreshed every 30s</div></div><div style=\"font-size:11px;text-align:right;opacity:0.85;line-height:1.6;\"><div>Microservices on LKE · AI at the edge</div><div>Linode Managed PG · Object Storage · Cloud Pulse</div></div></div>" } },

        { "id": 1, "type": "stat", "title": "Pods Running",
          "gridPos": { "x": 0, "y": 3, "w": 3, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"default\",phase=\"Running\"} == 1) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "value_and_name", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 1 }, { "color": "green", "value": 10 } ] } } } },

        { "id": 3, "type": "stat", "title": "HTTP req / min",
          "gridPos": { "x": 3, "y": 3, "w": 3, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "(sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=\"default\"}[1m])) * 60) or (sum(rate(k6_http_reqs_total[1m])) * 60) or vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "rpm", "color": { "mode": "fixed", "fixedColor": "blue" } } } },

        { "id": 2, "type": "stat", "title": "Revenue Yesterday (USD)",
          "description": "USD-denominated orders placed yesterday (UTC). Source: PostgreSQL orders table via postgres_exporter.",
          "gridPos": { "x": 6, "y": 3, "w": 3, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum(orders_daily_revenue_usd)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "value", "graphMode": "none", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 2, "unit": "currencyUSD", "color": { "mode": "fixed", "fixedColor": "green" } } } },

        { "id": 7, "type": "stat", "title": "Orders Yesterday",
          "description": "Total orders placed yesterday (UTC), all currencies. Source: PostgreSQL orders table via postgres_exporter.",
          "gridPos": { "x": 9, "y": 3, "w": 3, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum(orders_daily_order_count)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "value", "graphMode": "none", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "color": { "mode": "fixed", "fixedColor": "orange" } } } },

        { "id": 9, "type": "stat", "title": "Revenue Today (USD)",
          "description": "USD-denominated orders placed today so far (UTC). Source: PostgreSQL orders table via postgres_exporter.",
          "gridPos": { "x": 12, "y": 3, "w": 3, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum(orders_today_revenue_usd)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "value", "graphMode": "none", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 2, "unit": "currencyUSD", "color": { "mode": "fixed", "fixedColor": "semi-dark-green" } } } },

        { "id": 10, "type": "stat", "title": "Orders Today",
          "description": "Total orders placed today so far (UTC), all currencies. Source: PostgreSQL orders table via postgres_exporter.",
          "gridPos": { "x": 15, "y": 3, "w": 3, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum(orders_today_order_count)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "value", "graphMode": "none", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "color": { "mode": "fixed", "fixedColor": "semi-dark-orange" } } } },

        { "id": 4, "type": "stat", "title": "LLM tokens / hour",
          "gridPos": { "x": 18, "y": 3, "w": 3, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum(increase(llm_total_tokens_total[1h])) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "short", "color": { "mode": "fixed", "fixedColor": "purple" } } } },

        { "id": 8, "type": "stat", "title": "LLM p95 latency",
          "gridPos": { "x": 21, "y": 3, "w": 3, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le) (rate(llm_request_duration_seconds_bucket[5m]))) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 15 } ] } } } },

        { "id": 50, "type": "row", "title": "Application", "collapsed": false,
          "gridPos": { "x": 0, "y": 7, "w": 24, "h": 1 } },

        { "id": 10, "type": "timeseries", "title": "Request rate by service",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum by (destination_service_name) (rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=\"default\"}[1m])) * 60", "legendFormat": "{{destination_service_name}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "sum by (scenario) (rate(k6_http_reqs_total[1m])) * 60", "legendFormat": "{{scenario}} (k6 scenario)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "rpm", "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 1, "fillOpacity": 18, "gradientMode": "opacity", "lineInterpolation": "smooth", "showPoints": "never", "stacking": { "mode": "normal", "group": "A" } } } } },

        { "id": 11, "type": "timeseries", "title": "Error rate by app",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "sum by (app) (rate({namespace=\"default\"} |~ `(?i)\\\"severity\\\":\\\"error\\\"` [5m])) * 60", "legendFormat": "{{app}}", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "cpm", "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 1, "fillOpacity": 25, "gradientMode": "opacity", "lineInterpolation": "smooth", "showPoints": "never" } } } },

        { "id": 60, "type": "row", "title": "Infrastructure", "collapsed": false,
          "gridPos": { "x": 0, "y": 24, "w": 24, "h": 1 } },

        { "id": 40, "type": "gauge", "title": "PostgreSQL CPU",
          "gridPos": { "x": 0, "y": 25, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "max(avg_cpu_usage{entity_id=\"481207\"}) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "orientation": "auto", "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 85 } ] } } } },

        { "id": 41, "type": "gauge", "title": "PostgreSQL Memory",
          "gridPos": { "x": 6, "y": 25, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "max(avg_memory_usage{entity_id=\"481207\"}) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "orientation": "auto", "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 75 }, { "color": "red", "value": 90 } ] } } } },

        { "id": 42, "type": "gauge", "title": "PostgreSQL Disk",
          "gridPos": { "x": 12, "y": 25, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "max(avg_disk_usage{entity_id=\"481207\"}) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "orientation": "auto", "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 85 } ] } } } },

        { "id": 43, "type": "bargauge", "title": "PostgreSQL IOPS",
          "gridPos": { "x": 18, "y": 25, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "max(avg_read_iops{entity_id=\"481207\"})", "legendFormat": "read", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "max(avg_write_iops{entity_id=\"481207\"})", "legendFormat": "write", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true },
          "fieldConfig": { "defaults": { "unit": "iops", "color": { "mode": "continuous-BlPu" }, "decimals": 0 } } },

        { "id": 70, "type": "row", "title": "AI / LLM", "collapsed": false,
          "gridPos": { "x": 0, "y": 32, "w": 24, "h": 1 } },

        { "id": 22, "type": "timeseries", "title": "Token throughput",
          "gridPos": { "x": 0, "y": 33, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum(rate(llm_prompt_tokens_total[1m]))", "legendFormat": "prompt", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "sum(rate(llm_completion_tokens_total[1m]))", "legendFormat": "completion", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 1, "custom": { "lineWidth": 2, "fillOpacity": 30, "gradientMode": "opacity", "lineInterpolation": "smooth", "showPoints": "never" }, "color": { "mode": "palette-classic" } } } },

        { "id": 23, "type": "timeseries", "title": "Request latency (p50 / p95 / p99)",
          "gridPos": { "x": 12, "y": 33, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(llm_request_duration_seconds_bucket[5m])))", "legendFormat": "p50", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(llm_request_duration_seconds_bucket[5m])))", "legendFormat": "p95", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(llm_request_duration_seconds_bucket[5m])))", "legendFormat": "p99", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2, "custom": { "lineWidth": 2, "fillOpacity": 10, "lineInterpolation": "smooth", "showPoints": "never" }, "color": { "mode": "palette-classic" } } } },

        { "id": 90, "type": "row", "title": "Load Generation (k6)", "collapsed": false,
          "gridPos": { "x": 0, "y": 41, "w": 24, "h": 1 } },

        { "id": 91, "type": "stat", "title": "k6 active VUs",
          "gridPos": { "x": 0, "y": 42, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum(k6_vus) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "graphMode": "area", "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] } } } },

        { "id": 92, "type": "timeseries", "title": "k6 HTTP request rate by scenario",
          "gridPos": { "x": 6, "y": 42, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum by (scenario) (rate(k6_http_reqs_total[1m]))", "legendFormat": "{{scenario}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 1, "custom": { "lineWidth": 2, "fillOpacity": 25, "gradientMode": "opacity", "lineInterpolation": "smooth", "showPoints": "never", "stacking": { "mode": "normal" } }, "color": { "mode": "palette-classic" } } } },

        { "id": 93, "type": "timeseries", "title": "k6 HTTP duration p95",
          "description": "95th-percentile HTTP response time, broken down by k6 scenario. Value in milliseconds (k6 reports trend stats in ms).",
          "gridPos": { "x": 18, "y": 42, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "max by (scenario) (k6_http_req_duration_p95)", "legendFormat": "{{scenario}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 0, "custom": { "lineWidth": 2, "fillOpacity": 10, "lineInterpolation": "smooth", "showPoints": "never" }, "color": { "mode": "palette-classic" } } } },

        { "id": 200, "type": "row", "title": "Edge AI (Spin / Akamai Functions)", "collapsed": false,
          "gridPos": { "x": 0, "y": 50, "w": 24, "h": 1 } },

        { "id": 201, "type": "stat", "title": "Spin req / min (total)",
          "description": "Total request rate across all 3 Spin functions on Akamai Functions. Source: OTLP from the functions via the public OTel collector.",
          "gridPos": { "x": 0, "y": 51, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum(rate(boutique_spin_requests_total[5m])) * 60 OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "rpm", "decimals": 1, "color": { "mode": "fixed", "fixedColor": "purple" } } } },

        { "id": 202, "type": "timeseries", "title": "Spin request rate by function",
          "gridPos": { "x": 6, "y": 51, "w": 9, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum by (service) (rate(boutique_spin_requests_total[5m])) * 60", "legendFormat": "{{service}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "rpm", "decimals": 1, "custom": { "lineWidth": 2, "fillOpacity": 20, "gradientMode": "opacity", "lineInterpolation": "smooth", "showPoints": "never" }, "color": { "mode": "palette-classic" } } } },

        { "id": 203, "type": "timeseries", "title": "Spin avg latency by function",
          "description": "Average request duration. Note: histogram is bucket-less (see docs/spin-otel SPEC §3.3) so avg is accurate but p95 is not available.",
          "gridPos": { "x": 15, "y": 51, "w": 9, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum by (service) (rate(boutique_spin_request_duration_ms_sum[5m])) / clamp_min(sum by (service) (rate(boutique_spin_request_duration_ms_count[5m])), 0.0001)", "legendFormat": "{{service}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 0, "custom": { "lineWidth": 2, "fillOpacity": 10, "lineInterpolation": "smooth", "showPoints": "never" }, "color": { "mode": "palette-classic" } } } },

        { "id": 204, "type": "timeseries", "title": "Spin LLM tokens / min by function",
          "gridPos": { "x": 0, "y": 58, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum by (service, kind) (rate(boutique_spin_llm_tokens_total[5m])) * 60", "legendFormat": "{{service}} · {{kind}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["sum", "lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "custom": { "lineWidth": 2, "fillOpacity": 20, "gradientMode": "opacity", "lineInterpolation": "smooth", "showPoints": "never" }, "color": { "mode": "palette-classic" } } } },

        { "id": 205, "type": "timeseries", "title": "Spin LLM errors / min by function",
          "description": "LLM call failures (HTTP non-2xx or fetch errors) per function. Should normally be flat zero.",
