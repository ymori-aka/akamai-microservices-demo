                "targetBlank": false
              }]
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Duration" },
                "properties": [{ "id": "unit", "value": "ms" }] }
            ]
          }
        },

        {
          "id": 48, "type": "table", "title": "Checkout Traces",
