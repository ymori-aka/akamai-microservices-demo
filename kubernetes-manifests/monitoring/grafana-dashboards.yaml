apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  home.json: |
    {
      "title": "Akamai Store - Home",
      "uid": "akamai-home",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["overview"],
      "style": "dark",
      "graphTooltip": 1,
      "links": [
        { "title": "Operations", "type": "link", "url": "/d/akamai-microservices", "icon": "dashboard", "targetBlank": false, "tooltip": "Service-level deep dive" },
        { "title": "Infrastructure & LLM", "type": "link", "url": "/d/akamai-infrastructure", "icon": "dashboard", "targetBlank": false, "tooltip": "DB, NodeBalancer, LLM detail" },
        { "title": "Akamai Store", "type": "link", "url": "http://172.233.68.25/", "icon": "external link", "targetBlank": true, "tooltip": "Open the live storefront" }
      ],
      "panels": [
        { "id": 100, "type": "text",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 3 },
          "options": { "mode": "html", "content": "<div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:linear-gradient(90deg,#0099ff 0%,#1a4dff 60%,#7700ff 100%);border-radius:6px;color:white;font-family:-apple-system,'Inter',sans-serif;\"><div><div style=\"font-size:22px;font-weight:700;letter-spacing:-0.4px;\">Akamai Store</div><div style=\"opacity:0.85;font-size:12px;margin-top:2px;\">Live operations overview • LKE jp-osa • refreshed every 30s</div></div><div style=\"font-size:11px;text-align:right;opacity:0.85;line-height:1.6;\"><div>Microservices on LKE · AI at the edge</div><div>Linode Managed PG · Object Storage · Cloud Pulse</div></div></div>" } },

        { "id": 1, "type": "stat", "title": "Pods Running",
          "gridPos": { "x": 0, "y": 3, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"default\",phase=\"Running\"} == 1) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "value_and_name", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 1 }, { "color": "green", "value": 10 } ] } } } },

        { "id": 3, "type": "stat", "title": "HTTP req / min",
          "gridPos": { "x": 4, "y": 3, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum(rate(rpc_server_duration_milliseconds_count[1m])) * 60 OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "rpm", "color": { "mode": "fixed", "fixedColor": "blue" } } } },

        { "id": 2, "type": "stat", "title": "Errors / min",
          "gridPos": { "x": 8, "y": 3, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "sum(rate({namespace=\"default\"} |~ `(?i)\\\"severity\\\":\\\"error\\\"` [1m])) * 60", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 1, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 30 } ] } } } },

        { "id": 7, "type": "stat", "title": "Orders / hour",
          "gridPos": { "x": 12, "y": 3, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "sum(count_over_time({app=\"checkoutservice\"} |~ `payment went through` [1h]))", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "color": { "mode": "fixed", "fixedColor": "orange" } } } },

        { "id": 4, "type": "stat", "title": "LLM tokens / hour",
          "gridPos": { "x": 16, "y": 3, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum(increase(llm_total_tokens_total[1h])) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "short", "color": { "mode": "fixed", "fixedColor": "purple" } } } },

        { "id": 8, "type": "stat", "title": "LLM p95 latency",
          "gridPos": { "x": 20, "y": 3, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le) (rate(llm_request_duration_seconds_bucket[5m]))) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "value", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 15 } ] } } } },

        { "id": 50, "type": "row", "title": "Application", "collapsed": false,
          "gridPos": { "x": 0, "y": 7, "w": 24, "h": 1 } },

        { "id": 10, "type": "timeseries", "title": "Request rate by service",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum by (service_name) (rate(rpc_server_duration_milliseconds_count[1m])) * 60", "legendFormat": "{{service_name}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "rpm", "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 1, "fillOpacity": 18, "gradientMode": "opacity", "lineInterpolation": "smooth", "showPoints": "never", "stacking": { "mode": "normal", "group": "A" } } } } },

        { "id": 11, "type": "timeseries", "title": "Error rate by app",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "sum by (app) (rate({namespace=\"default\"} |~ `(?i)\\\"severity\\\":\\\"error\\\"` [5m])) * 60", "legendFormat": "{{app}}", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "cpm", "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 1, "fillOpacity": 25, "gradientMode": "opacity", "lineInterpolation": "smooth", "showPoints": "never" } } } },

        { "id": 60, "type": "row", "title": "Infrastructure", "collapsed": false,
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 1 } },

        { "id": 40, "type": "gauge", "title": "PostgreSQL CPU",
          "gridPos": { "x": 0, "y": 17, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "max(avg_cpu_usage{entity_id=\"470692\"}) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "orientation": "auto", "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 85 } ] } } } },

        { "id": 41, "type": "gauge", "title": "PostgreSQL Memory",
          "gridPos": { "x": 6, "y": 17, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "max(avg_memory_usage{entity_id=\"470692\"}) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "orientation": "auto", "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 75 }, { "color": "red", "value": 90 } ] } } } },

        { "id": 42, "type": "gauge", "title": "PostgreSQL Disk",
          "gridPos": { "x": 12, "y": 17, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "max(avg_disk_usage{entity_id=\"470692\"}) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "orientation": "auto", "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 85 } ] } } } },

        { "id": 43, "type": "bargauge", "title": "PostgreSQL IOPS",
          "gridPos": { "x": 18, "y": 17, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "max(avg_read_iops{entity_id=\"470692\"})", "legendFormat": "read", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "max(avg_write_iops{entity_id=\"470692\"})", "legendFormat": "write", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true },
          "fieldConfig": { "defaults": { "unit": "iops", "color": { "mode": "continuous-BlPu" }, "decimals": 0 } } },

        { "id": 70, "type": "row", "title": "AI / LLM", "collapsed": false,
          "gridPos": { "x": 0, "y": 24, "w": 24, "h": 1 } },

        { "id": 22, "type": "timeseries", "title": "Token throughput",
          "gridPos": { "x": 0, "y": 25, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "sum(rate(llm_prompt_tokens_total[1m]))", "legendFormat": "prompt", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "sum(rate(llm_completion_tokens_total[1m]))", "legendFormat": "completion", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 1, "custom": { "lineWidth": 2, "fillOpacity": 30, "gradientMode": "opacity", "lineInterpolation": "smooth", "showPoints": "never" }, "color": { "mode": "palette-classic" } } } },

        { "id": 23, "type": "timeseries", "title": "Request latency (p50 / p95 / p99)",
          "gridPos": { "x": 12, "y": 25, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(llm_request_duration_seconds_bucket[5m])))", "legendFormat": "p50", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(llm_request_duration_seconds_bucket[5m])))", "legendFormat": "p95", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(llm_request_duration_seconds_bucket[5m])))", "legendFormat": "p99", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }
          ],
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2, "custom": { "lineWidth": 2, "fillOpacity": 10, "lineInterpolation": "smooth", "showPoints": "never" }, "color": { "mode": "palette-classic" } } } },

        { "id": 30, "type": "text", "title": "",
          "gridPos": { "x": 0, "y": 33, "w": 24, "h": 3 },
          "options": { "mode": "html", "content": "<div style=\"display:flex;gap:12px;font-family:-apple-system,'Inter',sans-serif;\"><a href=\"/d/akamai-microservices\" style=\"flex:1;text-decoration:none;\"><div style=\"padding:14px 18px;background:#1f2937;border:1px solid #374151;border-radius:8px;color:#e5e7eb;transition:background 0.2s;\"><div style=\"font-size:14px;font-weight:600;color:#60a5fa;\">→ Operations</div><div style=\"font-size:12px;opacity:0.7;margin-top:4px;\">Per-service request rate, latency, errors, traces, logs</div></div></a><a href=\"/d/akamai-infrastructure\" style=\"flex:1;text-decoration:none;\"><div style=\"padding:14px 18px;background:#1f2937;border:1px solid #374151;border-radius:8px;color:#e5e7eb;\"><div style=\"font-size:14px;font-weight:600;color:#a78bfa;\">→ Infrastructure &amp; LLM</div><div style=\"font-size:12px;opacity:0.7;margin-top:4px;\">PostgreSQL, NodeBalancer, LLM token / latency drill-down</div></div></a><a href=\"http://172.233.68.25/\" target=\"_blank\" style=\"flex:1;text-decoration:none;\"><div style=\"padding:14px 18px;background:#1f2937;border:1px solid #374151;border-radius:8px;color:#e5e7eb;\"><div style=\"font-size:14px;font-weight:600;color:#fb923c;\">↗ Live Storefront</div><div style=\"font-size:12px;opacity:0.7;margin-top:4px;\">Open the public e-commerce site in a new tab</div></div></a></div>" } }
      ]
    }
  microservices.json: |
    {
      "title": "Akamai Store - Operations",
      "uid": "akamai-microservices",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
            "query": "label_values(kube_pod_info{namespace=\"default\"}, created_by_name)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [

        {
          "id": 1, "type": "stat", "title": "Running Pods",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"default\",phase=\"Running\"} == 1) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{"color":"red","value":0},{"color":"yellow","value":6},{"color":"green","value":10}] } } }
        },

        {
          "id": 2, "type": "stat", "title": "Redis Clients",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "redis_connected_clients{job=\"redis\"}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{"color":"green","value":0}] } } }
        },

        {
          "id": 3, "type": "stat", "title": "Redis Memory",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "redis_memory_used_bytes{job=\"redis\"}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "bytes", "thresholds": { "steps": [{"color":"green","value":0},{"color":"yellow","value":50000000},{"color":"red","value":200000000}] } } }
        },

        {
          "id": 4, "type": "stat", "title": "Pod Restarts (1h)",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"default\"}[1h])) OR vector(0)", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{"color":"green","value":0},{"color":"yellow","value":1},{"color":"red","value":5}] } } }
        },

        {
          "id": 5, "type": "stat", "title": "Error Logs (1h)",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "sum(count_over_time({namespace=\"default\"} |~ `(?i)(error|panic|fatal)` [1h]))", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{"color":"green","value":0},{"color":"yellow","value":10},{"color":"red","value":50}] } } }
        },

        {
          "id": 6, "type": "stat", "title": "Log Lines/min",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{ "expr": "sum(rate({namespace=\"default\"}[1m])) * 60", "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" } }],
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "steps": [{"color":"green","value":0}] } } }
        },

        {
          "id": 10, "type": "row", "title": "Infrastructure",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 4 },
          "collapsed": false
        },

        {
          "id": 11, "type": "timeseries", "title": "Container CPU Usage by Service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"default\",container!=\"\",container!=\"POD\"}[2m]))", "legendFormat": "{{pod}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 1, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean","max"] } }
        },

        {
          "id": 12, "type": "timeseries", "title": "Container Memory Usage by Service",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"default\",container!=\"\",container!=\"POD\"})", "legendFormat": "{{pod}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 1, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean","max"] } }
        },

        {
          "id": 13, "type": "timeseries", "title": "Node CPU Usage",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))", "legendFormat": "{{instance}}", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "lineWidth": 2, "fillOpacity": 15 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },

        {
          "id": 14, "type": "timeseries", "title": "Node Memory Usage",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [{ "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "memory used", "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" } }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "lineWidth": 2, "fillOpacity": 15 } } },
