# Grafana
# Exposed via LoadBalancer on port 3000.
# Default login: admin / admin (change after first login)
# Pre-configured: Prometheus datasource
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    # Force re-create on every provisioning pass so the UID stays pinned
    # to the value our dashboards hardcode. Without this, an existing
    # entry in Grafana's PVC database (with a different auto-generated
    # UID) shadows the provisioned config and dashboard queries fail.
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: PBFA97CFB590B2093
        url: http://prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: true
      - name: Loki
        type: loki
        uid: P8E80F9AEF21F6940
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        editable: true
      - name: Tempo
        type: tempo
        uid: tempo-uid
        url: http://tempo.monitoring.svc.cluster.local:3200
        access: proxy
        editable: true
        jsonData:
          tracesToLogsV2:
            datasourceUid: P8E80F9AEF21F6940
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            filterByTraceID: true
            filterBySpanID: false
            customQuery: false
          tracesToMetrics:
            datasourceUid: PBFA97CFB590B2093
          serviceMap:
            datasourceUid: PBFA97CFB590B2093
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: P8E80F9AEF21F6940
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Akamai Store
        type: file
        # false so dashboards removed from the path (e.g. the Istio ones
        # that used to be double-imported here) get cleaned up on restart.
        # Safe because allowUiUpdates is false — this is a pure GitOps setup.
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
      # Istio Service Mesh dashboards — official Istio addons.
      # Populated by kubernetes-manifests/monitoring/grafana-istio-dashboards.yaml
      # (downloaded from istio/istio release-1.22/manifests/addons/dashboards/).
      - name: istio
        orgId: 1
        folder: Istio Service Mesh
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards-istio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:10.4.3
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-password
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/home.json
            # Anonymous read-only access for demo viewing (no login).
            # Admins still log in normally to edit dashboards/users.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_NAME
              value: "Main Org."
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            # Viewers (incl. anonymous demo users) cannot open Explore by
            # default, so clicking a trace's "Open trace in Explore" data link
            # bounced them to the Home dashboard. viewers_can_edit lets Viewers
            # use Explore + make in-session (non-persisted) edits. Required for
            # the Frontend/Checkout Traces panels' trace drill-down to work.
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "true"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: istio-dashboards
              # Mounted OUTSIDE /var/lib/grafana/dashboards so the default
              # file provider (which scans that path recursively) does not
              # double-import these — that was creating duplicate Istio
              # dashboards (one in "Akamai Store", one in "Istio Service Mesh").
              mountPath: /var/lib/grafana/dashboards-istio
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: istio-dashboards
          configMap:
            name: grafana-istio-dashboards
            optional: true
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
