# OpenTelemetry Collector
#
# Receives OTLP traces/metrics from:
#  - Microservices inside LKE (ClusterIP, no auth)
#  - Spin functions on Akamai Functions (LoadBalancer, Bearer auth)
#
# Exposes a Prometheus scrape endpoint for metrics, forwards traces
# to Grafana Tempo.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    extensions:
      # Bearer-token authentication for the public OTLP HTTP receiver.
      # The token value is mounted as the env var OTEL_BEARER_TOKEN
      # (sourced from the otel-bearer-token K8s Secret).
      bearertokenauth:
        scheme: "Bearer"
        token: "${env:OTEL_BEARER_TOKEN}"
      # Separate token for the GPU inference hosts (us-sea), so they never hold
      # the token the Spin apps use and either can be rotated alone.
      bearertokenauth/gpu:
        scheme: "Bearer"
        token: "${env:OTEL_GPU_BEARER_TOKEN}"

    receivers:
      # Internal cluster receiver — no auth, ClusterIP only.
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

      # Public receiver — Bearer-token authenticated, exposed via
      # LoadBalancer for Akamai Functions Spin apps.
      otlp/public:
        protocols:
          http:
            endpoint: "0.0.0.0:4319"
            auth:
              authenticator: bearertokenauth

      # Public receiver for the GPU inference hosts: an otelcol on each host
      # scrapes llama-server /metrics and forwards Laya's traces here.
      otlp/gpu:
        protocols:
          http:
            endpoint: "0.0.0.0:4320"
            auth:
              authenticator: bearertokenauth/gpu

      # OpenCensus receiver — the custom ymori-aka app images (frontend,
      # cartservice, currencyservice, productcatalogservice, checkoutservice)
      # are the classic Online Boutique build that exports traces via the
      # OpenCensus agent protocol to COLLECTOR_SERVICE_ADDR (host:55678),
      # NOT OTLP. This bridges them into the same trace pipeline so they
      # appear in the Tempo service graph / Vizceral / Node Graph.
      opencensus:
        endpoint: "0.0.0.0:55678"

    processors:
      batch:
        timeout: 10s
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
      # Datadog 向けパイプライン専用。既存パイプライン(Tempo/Loki/Prometheus)の
      # ラベルを変えないよう、env タグはここでだけ付ける。
      resource/datadog:
        attributes:
          - key: deployment.environment
            value: akamai-ec-demo
            action: upsert
      # Datadog 向けホスト名の固定。何もしないと Collector や一部サービスの Pod 名が
      # そのままホスト名になり、Pod 再起動のたびに APM ホストが増える。
      # 送信元 Pod のノード名 (Agent 導入済みのホスト) を引き、取れないもの
      # (Spin 関数など) は固定名にまとめる。
      k8sattributes/datadog:
        passthrough: false
        pod_association:
          - sources:
              - from: connection
        extract:
          metadata:
            - k8s.node.name
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
      transform/datadog_host:
        error_mode: ignore
        trace_statements: &dd_host_statements
          - context: resource
            statements:
              - set(attributes["datadog.host.name"], attributes["k8s.node.name"]) where attributes["k8s.node.name"] != nil
              - set(attributes["datadog.host.name"], "otel-collector-tokyo") where attributes["datadog.host.name"] == nil
        metric_statements: *dd_host_statements
        log_statements: *dd_host_statements
      # Datadog intake のサイズ上限(traces 3.2MB 等)に合わせて小さめにする
      batch/datadog:
        send_batch_size: 100
        send_batch_max_size: 500
        timeout: 10s
      # Keeps only the store assistant's gateway spans (set in the frontend's
      # /bot handler) for the spanmetrics connector below.
      filter/assistant_spans:
        error_mode: ignore
        traces:
          span:
            - 'not IsMatch(name, "^(assistant\\.gateway|ai_gateway\\.classify)$")'

    connectors:
      # 0.101.0 の datadog exporter は APM stats を計算しないため connector で計算する
      # (traces -> metrics。出力は datadog exporter 専用パイプラインにだけ流す)
      datadog/connector:
      # Latency histograms + call counts for the store assistant, split by
      # classifier (router), tier, served model, cache and outcome. The
      # assistant.gateway span is the whole gateway call; ai_gateway.classify
      # is derived from the gateway's x-ai-classify-ms header. Exported to
      # Prometheus as boutique_assistant_* and to Datadog as assistant.*.
      spanmetrics/assistant:
        namespace: assistant
        histogram:
          unit: ms
          explicit:
            buckets: [50ms, 100ms, 250ms, 500ms, 1s, 1500ms, 2s, 3s, 5s, 8s, 13s, 20s, 30s, 45s, 60s]
        dimensions:
          - name: ai_gateway.router
          - name: ai_gateway.complexity
          - name: gen_ai.response.model
          - name: ai_gateway.cache
          - name: ai_gateway.outcome
          - name: chat.lang
        exclude_dimensions: [span.kind]
        metrics_flush_interval: 15s

    exporters:
      # Exposes metrics at :8889/metrics for Prometheus to scrape
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: boutique
        resource_to_telemetry_conversion:
          enabled: true
      # Forward traces to Grafana Tempo
      otlp/tempo:
        endpoint: "tempo.monitoring.svc.cluster.local:4317"
        tls:
          insecure: true
      # Forward logs to Loki. Loki 2.9.7 has no native OTLP ingestion, so we
      # use the contrib `loki` exporter which pushes to the Loki HTTP push API.
      # This is what carries the Akamai Functions (Spin) app logs — and any
      # other OTLP logs — into Loki/Grafana.
      loki:
        endpoint: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        default_labels_enabled:
          exporter: true
          job: true
      # Datadog (AP1) へ並行送信。API キーは Secret datadog-api-key から env で渡す
      datadog:
        api:
          site: ap1.datadoghq.com
          key: "${env:DD_API_KEY}"
        # Collector Pod 自体をホストとして登録させない(Infra ホスト課金を避ける)
        host_metadata:
          enabled: false

    service:
      extensions: [bearertokenauth, bearertokenauth/gpu]
      pipelines:
        metrics:
          receivers: [otlp, otlp/public, otlp/gpu]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp, otlp/public, otlp/gpu, opencensus]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp, otlp/public, otlp/gpu]
          processors: [memory_limiter, batch]
          exporters: [loki]
        # ---- Datadog 向け(既存パイプラインとは独立。同じ receiver から fan-out) ----
        traces/datadog:
          receivers: [otlp, otlp/public, otlp/gpu, opencensus]
          processors: [memory_limiter, k8sattributes/datadog, transform/datadog_host, resource/datadog, batch/datadog]
          exporters: [datadog/connector, datadog]
        metrics/datadog:
          receivers: [otlp, otlp/public, otlp/gpu]
          processors: [memory_limiter, k8sattributes/datadog, transform/datadog_host, resource/datadog, batch/datadog]
          exporters: [datadog]
        # store assistant の spanmetrics (frontend の span だけを入力にする)
        traces/assistant_metrics:
          receivers: [otlp]
          processors: [memory_limiter, filter/assistant_spans]
          exporters: [spanmetrics/assistant]
        metrics/assistant:
          receivers: [spanmetrics/assistant]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        metrics/assistant_datadog:
          receivers: [spanmetrics/assistant]
          processors: [memory_limiter, transform/datadog_host, resource/datadog, batch/datadog]
          exporters: [datadog]
        # connector が出す APM stats はスパン側のホスト名を引き継ぐので加工しない
        metrics/datadog_apm_stats:
          receivers: [datadog/connector]
          processors: [memory_limiter, batch/datadog]
          exporters: [datadog]
        logs/datadog:
          receivers: [otlp, otlp/public, otlp/gpu]
          processors: [memory_limiter, k8sattributes/datadog, transform/datadog_host, resource/datadog, batch/datadog]
          exporters: [datadog]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: monitoring
---
# k8sattributes 用 (送信元 Pod -> ノード名/Deployment 名の解決のみ。読み取り専用)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-k8sattributes
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-k8sattributes
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: otel-collector-k8sattributes
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      # k8sattributes が送信元 Pod のノード名を引くために使う
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.101.0
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          env:
            - name: OTEL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: otel-bearer-token
                  key: token
            - name: OTEL_GPU_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: otel-gpu-bearer-token
                  key: token
            # optional にしない: Secret が無いときは新 Pod が起動せず、旧 Pod が
            # 動き続ける(空キーで exporter が起動失敗→Tempo/Loki まで止まるのを防ぐ)
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-api-key
                  key: api-key
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: otlp-http-pub
              containerPort: 4319
            - name: otlp-http-gpu
              containerPort: 4320
            - name: opencensus
              containerPort: 55678
            - name: metrics
              containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
# Internal-only ClusterIP service (existing LKE microservices use this).
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: opencensus
      port: 55678
      targetPort: 55678
    - name: metrics
      port: 8889
      targetPort: 8889
    - name: internal-metrics
      port: 8888
      targetPort: 8888
---
# Public LoadBalancer for Akamai Functions Spin apps.
# Bearer-token authentication is enforced by the OTel Collector itself
# (otlp/public receiver). Linode auto-creates a NodeBalancer; its IPv4
# is surfaced in CI logs as `service/otel-collector-public` EXTERNAL-IP.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-public
  namespace: monitoring
  annotations:
    # Linode NodeBalancer label for easier identification in the Cloud Manager
    service.beta.kubernetes.io/linode-loadbalancer-throttle: "0"
spec:
  type: LoadBalancer
  selector:
    app: otel-collector
  ports:
    - name: otlp-http-pub
      port: 4319
      targetPort: 4319
    - name: otlp-http-gpu
      port: 4320
      targetPort: 4320
      protocol: TCP
