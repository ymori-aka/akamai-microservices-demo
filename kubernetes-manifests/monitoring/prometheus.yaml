# Prometheus
# Scrapes metrics from OTel Collector, Redis Exporter, and Kubernetes.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # Alerting rules — evaluated every evaluation_interval (15s).
    # Fires into the in-cluster Alertmanager and is always visible at
    # http://prometheus:9090/alerts.
    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

    scrape_configs:
      # App metrics via OTel Collector (Prometheus exporter)
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.monitoring.svc.cluster.local:8889']

      # OTel Collector internal telemetry (spans received/sent/dropped)
      - job_name: 'otel-collector-internal'
        static_configs:
          - targets: ['otel-collector.monitoring.svc.cluster.local:8888']

      # Redis metrics
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter.monitoring.svc.cluster.local:9121']

      # postgres_exporter — queries orders table for yesterday's order count
      # and revenue. Values are GAUGE (not counters), so no increase() needed.
      - job_name: 'postgres-exporter'
        scrape_interval: 1m
        static_configs:
          - targets: ['postgres-exporter.monitoring.svc.cluster.local:9187']

      # Akamai Cloud Pulse — Linode Managed PostgreSQL (DBaaS) metrics
      - job_name: 'aclp-dbaas'
        # Cloud Pulse polls upstream every 5 min; no value in scraping
        # the collector faster than that.
        scrape_interval: 1m
        static_configs:
          - targets: ['aclp-collector.monitoring.svc.cluster.local:9464']

      # LLM server (llama-cpp-python on Linode VM) — Prometheus metrics
      # exposed by prometheus-fastapi-instrumentator + custom token
      # counters. See /root/llm_server_instrumented.py on the VM.
      - job_name: 'llm-server'
        scrape_interval: 15s
        static_configs:
          - targets: ['172.238.48.187:8000']

      # kube-state-metrics (deployed by grafana-k8s-monitoring)
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['grafana-k8s-monitoring-kube-state-metrics.monitoring.svc.cluster.local:8080']

      # Node exporter (deployed by grafana-k8s-monitoring)
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['grafana-k8s-monitoring-node-exporter.monitoring.svc.cluster.local:9100']

      # cAdvisor - container CPU/memory metrics via Kubernetes API
      - job_name: 'cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      # Kubernetes nodes (CPU, memory, disk)
      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      # ── Istio control-plane metrics ───────────────────────────────────────
      # istiod exposes Pilot/XDS metrics on port 15014 (/metrics).
      # Required by Kiali for control-plane health indicators.
      - job_name: 'istiod'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [istio-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name,
                            __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: 'istiod;http-monitoring'

      # ── Istio data-plane (Envoy sidecar) metrics ──────────────────────
      # Each sidecar exposes Envoy stats on port 15090 (/stats/prometheus).
      # These are the metrics Kiali uses to build the traffic graph
      # (request rate, error rate, latency percentiles per service pair).
      - job_name: 'istio-proxies'
        honor_labels: true
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape pods that have an Envoy sidecar
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: 'istio-proxy'
          # Rewrite address to the Envoy stats port
          - source_labels: [__address__]
            action: replace
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:15090'
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod_name

      # Kubernetes pod metrics (for pods with prometheus.io/scrape annotation)
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  # PVC is RWO and TSDB takes a file lock; with the default
  # RollingUpdate strategy the new pod starts before the old one
  # terminates and crash-loops on the lock. Recreate avoids that.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
            # Accept remote_write traffic from k6 (load generator) so its
            # built-in HTTP metrics (k6_http_*) land in our existing TSDB
            # without needing a separate Prometheus instance for k6.
            - "--web.enable-remote-write-receiver"
            # Native histograms support — k6 exports HTTP duration as
            # native histograms (much better resolution than buckets).
            - "--enable-feature=native-histograms"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
