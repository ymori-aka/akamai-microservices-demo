# tools-proxy — path-based fan-out behind the EXISTING Grafana NodeBalancer.
#
# Why this exists: every `type: LoadBalancer` Service creates its own Linode
# NodeBalancer ($10/mo each). The demo had 9. Only three genuinely need their
# own public IP:
#   - default/frontend-external   (storefront, TLS terminated at the NB)
#   - monitoring/grafana          (grafana.tserof.net, TLS at the NB)
#   - monitoring/otel-collector-public (Spin functions hard-code this IP in
#     their spin.toml allow-list, so it cannot move without redeploying them)
#
# The rest are demo/observability UIs. Rather than give each one a NodeBalancer,
# this nginx sits behind the *existing* Grafana NodeBalancer and fans out by
# path. Because the `monitoring/grafana` Service object is reused (only its
# selector/targetPort change), the public IP and the tserof-tls TLS termination
# are preserved — no DNS change and no new certificate SANs are needed.
#
#   grafana.tserof.net/            -> grafana        (unchanged)
#   grafana.tserof.net/kiali/      -> kiali
#   grafana.tserof.net/vizceral/   -> vizceral
#   grafana.tserof.net/promviz/    -> promviz-front
#   grafana.tserof.net/chaos/      -> chaos-dashboard
#   grafana.tserof.net/chaos-btn/  -> chaos-button
#
# Uses nginx-unprivileged (listens on 8080 as a non-root user) so the pod
# satisfies the `restricted` Pod Security Standard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tools-proxy-config
  namespace: monitoring
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }

    server {
      listen 8080;
      server_name _;

      # Generous body size so Grafana imports / Chaos Mesh YAML posts work.
      client_max_body_size 32m;

      # Own health endpoint, so the NodeBalancer health check never depends
      # on Grafana being up.
      location = /_proxy_healthz {
        access_log off;
        return 200 "ok\n";
      }

      # ---- Grafana keeps the root path: behaviour is unchanged ----
      location / {
        proxy_pass http://grafana.monitoring.svc.cluster.local:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
      }

      # ---- Kiali: configured with server.web_root=/kiali, so keep the prefix ----
      location /kiali/ {
        proxy_pass http://kiali.istio-system.svc.cluster.local:20001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
      }

      # ---- Vizceral (SPA served at root upstream): strip the prefix and
      #      rewrite absolute asset paths back under /vizceral/ ----
      location /vizceral/ {
        proxy_pass http://vizceral.monitoring.svc.cluster.local:80/;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;
        sub_filter 'href="/'   'href="/vizceral/';
        sub_filter 'src="/'    'src="/vizceral/';
        sub_filter '"/static/' '"/vizceral/static/';
      }

      # ---- promviz-front (SPA) ----
      location /promviz/ {
        proxy_pass http://promviz-front.monitoring.svc.cluster.local:80/;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;
        sub_filter 'href="/'   'href="/promviz/';
        sub_filter 'src="/'    'src="/promviz/';
        sub_filter '"/static/' '"/promviz/static/';
      }

      # ---- Chaos Mesh dashboard ----
      location /chaos/ {
        proxy_pass http://chaos-dashboard.chaos-mesh.svc.cluster.local:2333/;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade         $http_upgrade;
        proxy_set_header Connection      $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;
        sub_filter 'href="/'   'href="/chaos/';
        sub_filter 'src="/'    'src="/chaos/';
      }

      # ---- chaos-button (small custom app) ----
      location /chaos-btn/ {
        proxy_pass http://chaos-button.default.svc.cluster.local:80/;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/'   'href="/chaos-btn/';
        sub_filter 'src="/'    'src="/chaos-btn/';
        sub_filter 'fetch("/'  'fetch("/chaos-btn/';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools-proxy
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tools-proxy
  template:
    metadata:
      labels:
        app: tools-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /_proxy_healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_proxy_healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: tools-proxy-config
---
# ClusterIP only. Public exposure happens through the existing
# monitoring/grafana LoadBalancer Service, whose selector is repointed here.
apiVersion: v1
kind: Service
metadata:
  name: tools-proxy
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: tools-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
