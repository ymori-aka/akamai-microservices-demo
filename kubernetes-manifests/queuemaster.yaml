# queuemaster — async order event consumer.
#
# Consumes from RabbitMQ queue "order.placed" (published by
# checkoutservice after a successful order), simulates fulfillment
# work, and re-publishes to "order.fulfilled".
#
# Exposes Prometheus metrics on :8080/metrics:
#   - queuemaster_orders_received_total
#   - queuemaster_orders_processed_total
#   - queuemaster_processing_duration_seconds
#
# Sidecar injection disabled: LKE's managed control plane cannot reach
# the Istio admission webhook, so all new workloads must opt out.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: queuemaster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queuemaster
  labels:
    app: queuemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queuemaster
  template:
    metadata:
      labels:
        app: queuemaster
      annotations:
        sidecar.istio.io/inject: "false"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: queuemaster
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          image: ghcr.io/ymori-aka/queuemaster:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RABBITMQ_ADDR
              value: "user:pass@rabbitmq:5672"
            - name: OTEL_SERVICE_NAME
              value: "queuemaster"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: queuemaster
  labels:
    app: queuemaster
spec:
  type: ClusterIP
  selector:
    app: queuemaster
  ports:
    - name: http
      port: 8080
      targetPort: 8080
