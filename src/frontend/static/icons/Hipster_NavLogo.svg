<svg version="1.1" viewBox="0 0 280 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Akamai logo: three blue arcs + orange text -->
  <g transform="translate(4, 6)">
    <!-- Arc 1 (innermost / shortest) -->
    <path d="M 6,38 A 28,28 0 0,1 34,10" stroke="#009BDE" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Arc 2 (middle) -->
    <path d="M 6,48 A 40,40 0 0,1 46,8" stroke="#009BDE" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Arc 3 (outermost / longest) -->
    <path d="M 6,58 A 52,52 0 0,1 58,6" stroke="#009BDE" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- "Akamai" text in Akamai orange, bold italic -->
  <text x="72" y="44"
    font-family="Arial Black, Arial, sans-serif"
    font-size="36"
    font-weight="900"
    font-style="italic"
    fill="#F47920"
    letter-spacing="-1">Akamai</text>
</svg>
