<svg version="1.1" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Akamai official logo recreation -->
  <!-- Blue swoosh arcs -->
  <g transform="translate(8, 4)">
    <!-- Outer arc -->
    <path d="M 8,36 A 40,40 0 0,1 48,4" stroke="#009BDE" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Middle arc -->
    <path d="M 8,54 A 58,58 0 0,1 62,4" stroke="#009BDE" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Inner arc (longest) -->
    <path d="M 8,70 A 74,74 0 0,1 76,4" stroke="#009BDE" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Orange "Akamai" text -->
  <text x="88" y="58"
    font-family="Arial Black, Arial, sans-serif"
    font-size="46"
    font-weight="900"
    font-style="italic"
    fill="#F7941D"
    letter-spacing="-1">Akamai</text>
</svg>
