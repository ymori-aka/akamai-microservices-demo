spin_manifest_version = 2

[application]
authors = ["ymori-aka"]
description = "AI-powered product recommendation service using Gemma"
name = "recommendation-service"
version = "0.1.0"

[[trigger.http]]
route = "/..."
component = "recommendation-service"

[component.recommendation-service]
source = "dist/recommendation-service.wasm"
exclude_files = ["**/node_modules"]
allowed_outbound_hosts = [
  # Migrated 2026-09-02: the GPU node moved behind the llm-gpu-sea
  # NodeBalancer (see src/index.ts). Update this list AND LLM_ENDPOINT
  # together — a mismatch fails as a generic "NetworkError when attempting
  # to fetch resource" with no hint it's an egress policy.
  "https://llm.tserof.net:8001",
  "http://172.237.3.147:4319",
]

[component.recommendation-service.build]
command = ["npm install", "npm run build"]
watch = ["src/**/*.ts"]
