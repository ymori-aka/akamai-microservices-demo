spin_manifest_version = 2

[application]
authors = ["ymori-aka"]
description = "LLM proxy for the Akamai Store shopping assistant"
name = "shopping-assistant-service"
version = "0.1.0"

[[trigger.http]]
route = "/..."
component = "shopping-assistant-service"

[component.shopping-assistant-service]
source = "dist/shopping-assistant-service.wasm"
exclude_files = ["**/node_modules"]
allowed_outbound_hosts = [
  # Migrated to the new Zuplo AI Gateway 2026-09-02 (see src/index.ts). Spin's
  # WASM sandbox enforces this list independently of LLM_ENDPOINT in the code
  # — fetch() calls to hosts not listed here fail as a generic "NetworkError
  # when attempting to fetch resource" with no indication it's an egress
  # policy. Update both together, or a gateway migration silently breaks.
  "https://ec-chat-main-c4d1d89.zuplo.app",
  "http://172.237.3.147:4319",
]

[component.shopping-assistant-service.build]
command = ["npm install", "npm run build"]
watch = ["src/**/*.ts"]
